<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF6E9">
<title>NEKO-ZUKAI — ネコと貯めるおこづかい帳</title>
<meta name="description" content="毎月自由に使えるお金を決めて、毎日使った分を記録する。余りは次の月へ繰り越し。家ネコといっしょに続けるおこづかい帳。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9;
  --paper:#FFFFFF;
  --ink:#5A3E2B;
  --soft:#9A7B62;
  --line:#EAD6BC;
  --cream:#FFF1DE;
  --fur:#E8A25C;
  --stripe:#C97B3A;
  --accent:#E08A3C;
  --accent-dark:#B86A26;
  --minus:#C8553D;
  --good:#6C9A4B;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-weight:500;
  min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---- header ---- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.logo{font-weight:900;letter-spacing:.12em;font-size:15px}
.logo span{color:var(--accent)}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.icon-btn:active{background:var(--cream)}

/* ---- today ---- */
.today{padding:6px 4px 0}
.today .lbl{font-size:13px;color:var(--soft)}
.today .amt{font-size:46px;font-weight:900;line-height:1.1;margin:2px 0 4px;letter-spacing:.01em}
.today .amt.minus{color:var(--minus)}
.today .sub{font-size:12.5px;color:var(--soft)}
.today .sub b{color:var(--ink);font-weight:700}

/* ---- cat ---- */
.stage{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.cat{width:200px;height:180px;display:block;cursor:pointer;transform-origin:50% 100%}
.cat.bounce{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.94)}60%{transform:scale(.97,1.04)}}
.cat .tail{transform-origin:150px 150px;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.bubble{
  position:relative;background:var(--paper);border:2px solid var(--line);
  border-radius:16px;padding:8px 14px;font-size:14px;margin-top:6px;max-width:90%;text-align:center;
}
.bubble::before{
  content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-top:0;border-bottom-color:var(--line);
}
.bubble::after{
  content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;
  border:6px solid transparent;border-top:0;border-bottom-color:var(--paper);
}
.bubble .who{font-size:11px;color:var(--soft);display:block}

/* ---- buttons ---- */
.btn{
  display:block;width:100%;border:0;border-radius:var(--r);padding:16px;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dark);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.ghost{background:transparent;color:var(--soft);box-shadow:none;font-size:14px;padding:10px;font-weight:500}
.btn.ghost:active{transform:none;background:var(--cream)}
.btn:disabled{opacity:.45}
.actions{margin-top:14px}

/* ---- cards ---- */
.card{background:var(--paper);border-radius:var(--r);padding:14px 16px;margin-top:16px;border:1.5px solid var(--line)}
.card h2{font-size:14px;color:var(--soft);font-weight:700;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.stats .k{font-size:12px;color:var(--soft)}
.stats .v{font-size:18px;font-weight:700}
.stats .v.minus{color:var(--minus)}
.bar{height:10px;background:var(--cream);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--fur);border-radius:99px;transition:width .4s}
.bar.minus i{background:var(--minus)}

/* ---- history ---- */
.day{margin-top:10px}
.day:first-of-type{margin-top:0}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);border-bottom:1px dashed var(--line);padding-bottom:3px;margin-bottom:2px}
.ent{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 2px;text-align:left;border-radius:10px}
.ent:active{background:var(--cream)}
.ent .memo{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .memo.none{color:var(--soft)}
.ent .yen{font-weight:700}
.empty{color:var(--soft);font-size:13.5px;text-align:center;padding:8px 0}

/* ---- sheet (bottom modal) ---- */
.scrim{position:fixed;inset:0;background:rgba(90,62,43,.35);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;
  background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .25s ease;max-height:92vh;overflow:auto;
}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-size:16px;font-weight:900;text-align:center;margin-bottom:10px}

/* entry */
.disp{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r);
  padding:8px 16px;text-align:right;font-size:38px;font-weight:900;min-height:64px;
}
.disp small{font-size:20px;margin-right:4px;color:var(--soft)}
.row2{display:flex;gap:8px;margin-top:10px}
.field{
  flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;
}
.field:focus{outline:2px solid var(--fur);outline-offset:-1px}
.date-chip{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:4px;padding:10px 12px;border-radius:12px;background:var(--cream);border:1.5px solid var(--line);font-size:14px;white-space:nowrap}
.date-chip input{position:absolute;inset:0;opacity:0;width:100%}
.favs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.fav{display:flex;justify-content:space-between;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-size:13px;text-align:left}
.fav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.fav.on{border-color:var(--fur);background:var(--cream)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.key{border:0;border-radius:14px;background:var(--paper);font-size:24px;font-weight:700;padding:12px 0;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none;background:var(--cream)}
.key.fn{font-size:18px;color:var(--soft)}

/* forms */
.form label{display:block;margin-top:14px;font-size:13.5px;font-weight:700}
.form label .hint{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.form .field{display:block;width:100%;margin-top:6px}
.yen-field{position:relative}
.yen-field::before{content:"¥";position:absolute;left:12px;top:50%;transform:translateY(-50%);margin-top:3px;color:var(--soft)}
.yen-field .field{padding-left:28px}
.err{color:var(--minus);font-size:13px;margin-top:10px;min-height:1em}

/* setup page */
.setup{padding-top:24px}
.setup .hello{text-align:center}
.setup .hello h1{font-size:22px;font-weight:900;letter-spacing:.08em;margin-top:4px}
.setup .hello h1 span{color:var(--accent)}
.setup .hello p{font-size:13.5px;color:var(--soft);margin-top:6px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;
  animation:fade .2s;white-space:nowrap;
}
.note{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
</style>
</head>
<body>

<!-- ネコ（表情は data-mood で切り替える） -->

<svg class="cat" viewBox="0 0 200 180" role="img" aria-label="ネコ">

<div class="wrap" id="app"></div>

<script>
(() => {
'use strict';

/* =========================================================
   保存（段階1はこの端末だけ。段階2で Firebase に差し替える）
   ========================================================= */
const KEY = 'neko-zukai-v1';
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } },
  save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){ toast('保存できませんでした'); } },
};

/*
  data = {
    catName: 'ミケ',
    start:   'YYYY-MM-DD',       // 記録を始めた期間の開始日
    opening: 30000,              // 始めたときの「今期の残り」
    configs: [{from:'YYYY-MM-DD', amount:30000, payday:25}],  // 設定の履歴（過去の期間を書き換えないため）
    entries: [{id, date:'YYYY-MM-DD', amount:500, memo:'', at:ms}],
  }
*/
let data = store.load();

/* =========================================================
   日付
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dim = (y, m) => new Date(y, m+1, 0).getDate();   // その月の日数
const todayStr = () => ymd(new Date());
const WD = ['日','月','火','水','木','金','土'];
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const yen = n => (n < 0 ? '−' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');

/* 加算日（31日などは月末に寄せる） */
const isPayday = (d, payday) => d.getDate() === Math.min(payday, dim(d.getFullYear(), d.getMonth()));

/* d を含む期間の開始日 */
function periodStartOf(d, payday){
  for(let i=0; i<32; i++){ const x = addDays(d, -i); if(isPayday(x, payday)) return x; }
  return d;
}
function configAt(s){
  let c = data.configs[0];
  for(const x of data.configs) if(x.from <= s) c = x;
  return c;
}

/* =========================================================
   計算
   ========================================================= */
function compute(){
  const today = todayStr();
  const spentBy = {};
  for(const e of data.entries) spentBy[e.date] = (spentBy[e.date]||0) + e.amount;

  // 開始日から今日まで1日ずつ進め、加算日が来たら期間を区切る
  const periods = [];
  let cur = { start: data.start, carry: 0, amount: data.opening, spent: 0 };
  let d = parse(data.start);
  const end = parse(today);
  while(d <= end){
    const s = ymd(d);
    const cfg = configAt(s);
    if(s !== data.start && isPayday(d, cfg.payday)){
      const left = cur.carry + cur.amount - cur.spent;
      cur.end = ymd(addDays(d, -1));
      periods.push(cur);
      cur = { start: s, carry: left, amount: cfg.amount, spent: 0 };
    }
    cur.spent += spentBy[s] || 0;
    d = addDays(d, 1);
  }

  // 次の加算日（今の設定で探す）
  const cfgNow = configAt(today);
  let next = addDays(end, 1);
  while(!isPayday(next, cfgNow.payday)) next = addDays(next, 1);
  cur.end = ymd(addDays(next, -1));

  const remaining = cur.carry + cur.amount - cur.spent;   // 今期の残り
  const spentToday = spentBy[today] || 0;
  const daysLeft = Math.round((next - end) / 864e5);       // 今日を含む残り日数
  const beforeToday = remaining + spentToday;              // 今朝の時点の残り
  const base = beforeToday > 0 ? Math.floor(beforeToday / daysLeft) : 0;
  const todayLeft = base - spentToday;

  return {
    today, cur, periods, remaining, spentToday, daysLeft, base, todayLeft,
    next: ymd(next), recordedToday: data.entries.some(e => e.date === today),
  };
}

/* =========================================================
   ネコのせりふ
   ========================================================= */
const LINES = {
  waiting: ['きょうは何に使ったにゃ？','記録をまってるにゃ','使わなかった日も教えてほしいにゃ'],
  happy:   ['きょうも記録えらいにゃ','いい調子だにゃ','おさいふにやさしい一日だにゃ','この調子でいくにゃ'],
  over:    ['ちょっと使いすぎたにゃ…','だいじょうぶ、あしたの目安がすこし下がるだけにゃ','あしたから取りもどすにゃ'],
  minus:   ['今期はマイナスだにゃ…','次の加算日までがまんだにゃ','マイナスの分は次の期間から引かれるにゃ'],
  zero:    ['使わない日、すてきだにゃ','おさいふがよろこんでるにゃ'],
  pet:     ['にゃ〜ん','ごろごろ…','なでてくれてうれしいにゃ','ふみふみ…'],
  saved:   ['記録したにゃ！','ちゃんと書けてえらいにゃ','おぼえたにゃ'],
};
const pick = a => a[Math.floor(Math.random()*a.length)];

function moodOf(c){
  if(c.remaining < 0) return { face:'sad', line: pick(LINES.minus) };
  if(c.todayLeft < 0) return { face:'worried', line: pick(LINES.over) };
  if(c.recordedToday && c.spentToday === 0) return { face:'happy', line: pick(LINES.zero) };
  if(c.recordedToday) return { face:'happy', line: pick(LINES.happy) };
  return { face:'normal', line: pick(LINES.waiting) };
}

/* =========================================================
   描画
   ========================================================= */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastLine = null;   // 直前に言わせたいせりふ（記録した直後など）

function render(){
  if(!data){ renderSetup(); return; }
  const c = compute();
  const mood = moodOf(c);
  const line = lastLine || mood.line; lastLine = null;
  const budget = c.cur.carry + c.cur.amount;
  const usedPct = budget > 0 ? Math.min(100, Math.max(0, c.remaining / budget * 100)) : 0;

  const byDay = {};
  for(const e of data.entries) if(e.date >= c.cur.start) (byDay[e.date] ||= []).push(e);
  const days = Object.keys(byDay).sort().reverse();

  $app.innerHTML = `
    <header>
      <div class="logo">NEKO<span>-</span>ZUKAI</div>
      <button class="icon-btn" id="open-settings" aria-label="設定">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section class="today">
      <div class="lbl">今日つかえるお金</div>
      <div class="amt num ${c.todayLeft < 0 ? 'minus' : ''}">${yen(c.todayLeft)}</div>
      <div class="sub">今日の目安 <b class="num">${yen(c.base)}</b> ・ 使った <b class="num">${yen(c.spentToday)}</b></div>
    </section>

    <section class="stage">
      <div id="cat-slot"></div>
      <div class="bubble" id="bubble"><span class="who">${esc(data.catName)}</span><span id="line">${esc(line)}</span></div>
    </section>

    <div class="actions">
      <button class="btn" id="open-entry">🐾 使ったお金を入れる</button>
      ${c.recordedToday ? '' : '<button class="btn ghost" id="zero-day">今日は使わなかった</button>'}
    </div>

    <section class="card">
      <h2>今期（${md(c.cur.start)} 〜 ${md(c.cur.end)}）</h2>
      <div class="stats">
        <div><div class="k">今期の残り</div><div class="v num ${c.remaining < 0 ? 'minus' : ''}">${yen(c.remaining)}</div></div>
        <div><div class="k">次の加算日まで</div><div class="v num">あと${c.daysLeft}日</div></div>
        <div><div class="k">今期使える額</div><div class="v num">${yen(budget)}</div></div>
        <div><div class="k">${c.periods.length ? '先月からの繰越' : '開始時の残り'}</div><div class="v num ${c.cur.carry < 0 ? 'minus' : ''}">${c.periods.length ? yen(c.cur.carry) : yen(c.cur.amount)}</div></div>
      </div>
      <div class="bar ${c.remaining < 0 ? 'minus' : ''}"><i style="width:${usedPct}%"></i></div>
    </section>

    <section class="card">
      <h2>今期の記録</h2>
      ${days.length ? days.map(day => {
        const list = byDay[day].slice().sort((a,b) => b.at - a.at);
        const sum = list.reduce((s,e) => s + e.amount, 0);
        return `<div class="day">
          <div class="day-h"><span>${md(day)}</span><span class="num">${yen(sum)}</span></div>
          ${list.map(e => `<button class="ent" data-id="${e.id}">
            <span class="memo ${e.memo ? '' : 'none'}">${e.amount === 0 && !e.memo ? '使わなかった日' : esc(e.memo || 'メモなし')}</span>
            <span class="yen num">${yen(e.amount)}</span></button>`).join('')}
        </div>`;
      }).join('') : '<p class="empty">まだ記録がないにゃ</p>'}
    </section>
    <p class="note">記録はこの端末の中だけに保存されています（段階1）</p>
  `;

  const slot = $app.querySelector('#cat-slot');
  slot.replaceWith(makeCat(mood.face));
  $app.querySelector('#open-entry').onclick = () => openEntry();
  $app.querySelector('#open-settings').onclick = openSettings;
  const z = $app.querySelector('#zero-day');
  if(z) z.onclick = () => { addEntry({ date: c.today, amount: 0, memo: '' }); lastLine = pick(LINES.zero); render(); };
  $app.querySelectorAll('.ent').forEach(b => b.onclick = () => openEntry(data.entries.find(e => e.id === b.dataset.id)));
}

function makeCat(face){
  const svg = document.getElementById('cat-tpl').content.firstElementChild.cloneNode(true);
  svg.querySelectorAll('.face').forEach(g => g.style.display = g.dataset.face === face ? '' : 'none');
  svg.addEventListener('click', () => {
    svg.classList.remove('bounce'); void svg.offsetWidth; svg.classList.add('bounce');
    const l = document.getElementById('line'); if(l) l.textContent = pick(LINES.pet);
  });
  return svg;
}

/* =========================================================
   記録
   ========================================================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function addEntry(e){
  data.entries.push({ id: uid(), at: Date.now(), ...e });
  store.save(data);
}

/* よく入れる「金額＋メモ」。2回以上入れたものを、回数 → 新しさの順に4つまで */
function frequent(){
  const m = new Map();
  for(const e of data.entries){
    if(!e.amount) continue;
    const k = e.amount + '\u0000' + e.memo;
    const x = m.get(k) || { amount: e.amount, memo: e.memo, n: 0, at: 0 };
    x.n++; x.at = Math.max(x.at, e.at); m.set(k, x);
  }
  return [...m.values()].filter(x => x.n >= 2).sort((a,b) => b.n - a.n || b.at - a.at).slice(0, 4);
}

/* 入力シート（e を渡すと編集） */
function openEntry(edit){
  let val = edit ? String(edit.amount) : '';
  let date = edit ? edit.date : todayStr();
  const favs = frequent();
  const { scrim, sheet, close } = openSheet(`
    <h3>${edit ? '記録をなおす' : '使ったお金'}</h3>
    <div class="disp num"><small>¥</small><span id="val"></span></div>
    <div class="row2">
      <label class="date-chip"><span id="date-txt"></span> ▾<input type="date" id="date" max="${todayStr()}" min="${data.start}"></label>
      <input class="field" id="memo" placeholder="メモ（例: ランチ）" maxlength="40" value="${edit ? esc(edit.memo) : ''}">
    </div>
    ${!edit && favs.length ? `<div class="favs">${favs.map((f,i) =>
      `<button class="fav" data-i="${i}"><span>${esc(f.memo || 'メモなし')}</span><b class="num">${yen(f.amount)}</b></button>`).join('')}</div>` : ''}
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')}
      <button class="key fn" data-k="00">00</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="bs" aria-label="1文字けす">⌫</button>
    </div>
    <button class="btn" id="save">記録する</button>
    ${edit ? '<button class="btn ghost" id="del" style="margin-top:8px;color:var(--minus)">この記録を消す</button>' : ''}
  `);
  const $val = sheet.querySelector('#val'), $save = sheet.querySelector('#save');
  const $date = sheet.querySelector('#date'), $dtxt = sheet.querySelector('#date-txt');
  const paint = () => {
    $val.textContent = val ? Number(val).toLocaleString('ja-JP') : '0';
    $save.disabled = !val && !edit;
    $dtxt.textContent = date === todayStr() ? '今日' : md(date);
  };
  $date.value = date;
  $date.onchange = () => { if($date.value) date = $date.value; paint(); };
  sheet.querySelectorAll('.key').forEach(k => k.onclick = () => {
    const x = k.dataset.k;
    if(x === 'bs') val = val.slice(0, -1);
    else if(val.length < 8) val = (val + x).replace(/^0+/, '');
    paint();
  });
  sheet.querySelectorAll('.fav').forEach(b => b.onclick = () => {
    const f = favs[b.dataset.i];
    val = String(f.amount); sheet.querySelector('#memo').value = f.memo;
    sheet.querySelectorAll('.fav').forEach(x => x.classList.toggle('on', x === b));
    paint();
  });
  $save.onclick = () => {
    const amount = Number(val || 0);
    const memo = sheet.querySelector('#memo').value.trim();
    if(edit){ Object.assign(edit, { amount, memo, date }); store.save(data); toast('なおしたにゃ'); }
    else { addEntry({ date, amount, memo }); lastLine = pick(LINES.saved); }
    close(); render();
  };
  const del = sheet.querySelector('#del');
  if(del) del.onclick = () => {
    if(!confirm('この記録を消しますか？')) return;
    data.entries = data.entries.filter(e => e !== edit); store.save(data);
    close(); render(); toast('消したにゃ');
  };
  paint();
}

/* =========================================================
   設定
   ========================================================= */
function settingsForm(v){
  return `
    <div class="form">
      <label>ネコの名前<input class="field" id="f-name" maxlength="12" value="${esc(v.catName)}" placeholder="例: ミケ"></label>
      <label>毎月自由に使えるお金
        <div class="yen-field"><input class="field num" id="f-amount" inputmode="numeric" value="${v.amount || ''}" placeholder="30000"></div>
      </label>
      <label>お金が加算される日<span class="hint">29〜31日を選ぶと、短い月は月末に加算します</span>
        <select class="field" id="f-payday">${Array.from({length:31}, (_,i) => `<option value="${i+1}" ${i+1 === v.payday ? 'selected' : ''}>毎月 ${i+1}日</option>`).join('')}</select>
      </label>
      ${v.setup ? `<label>今期の残り<span class="hint">いま自由に使えるお金。加算日に受け取ったばかりなら、毎月の額と同じです</span>
        <div class="yen-field"><input class="field num" id="f-opening" inputmode="numeric" placeholder="毎月の額と同じ"></div></label>` : ''}
      <p class="err" id="f-err"></p>
    </div>`;
}
function readForm(root, setup){
  const n = s => Number(String(s).replace(/[^\d]/g, ''));
  const name = root.querySelector('#f-name').value.trim();
  const amountRaw = root.querySelector('#f-amount').value;
  const amount = n(amountRaw);
  const payday = Number(root.querySelector('#f-payday').value);
  let opening = amount;
  if(setup){ const o = root.querySelector('#f-opening').value; if(o.trim() !== '') opening = n(o); }
  if(!name) return { err: 'ネコの名前を入れてほしいにゃ' };
  if(!amount) return { err: '毎月の金額を入れてほしいにゃ' };
  return { name, amount, payday, opening };
}

function renderSetup(){
  $app.innerHTML = `
    <div class="setup">
      <div class="hello">
        <div id="cat-slot"></div>
        <h1>NEKO<span>-</span>ZUKAI</h1>
        <p>はじめまして。まずは名前をつけてほしいにゃ</p>
      </div>
      <div class="card">${settingsForm({ catName:'', amount:'', payday:25, setup:true })}
        <button class="btn" id="start" style="margin-top:6px">はじめる</button>
      </div>
    </div>`;
  $app.querySelector('#cat-slot').replaceWith(makeCat('normal'));
  $app.querySelector('#start').onclick = () => {
    const f = readForm($app, true);
    if(f.err){ $app.querySelector('#f-err').textContent = f.err; return; }
    const start = ymd(periodStartOf(new Date(), f.payday));
    data = {
      catName: f.name, start, opening: f.opening,
      configs: [{ from: start, amount: f.amount, payday: f.payday }],
      entries: [],
    };
    store.save(data);
    lastLine = `${f.name}だにゃ。よろしくにゃ！`;
    render();
  };
}

function openSettings(){
  const cfg = configAt(todayStr());
  const { sheet, close } = openSheet(`
    <h3>設定</h3>
    ${settingsForm({ catName: data.catName, amount: cfg.amount, payday: cfg.payday })}
    <p class="hint" style="font-size:12px;color:var(--soft)">金額と加算日を変えると、次の加算日から反映されます。それまでの記録はそのままです。</p>
    <button class="btn" id="s-save" style="margin-top:12px">保存する</button>
    <button class="btn ghost" id="s-reset" style="margin-top:18px;color:var(--minus)">すべての記録を消して最初から</button>
  `);
  sheet.querySelector('#s-save').onclick = () => {
    const f = readForm(sheet, false);
    if(f.err){ sheet.querySelector('#f-err').textContent = f.err; return; }
    data.catName = f.name;
    if(f.amount !== cfg.amount || f.payday !== cfg.payday){
      const t = todayStr();
      data.configs = data.configs.filter(x => x.from !== t || x === data.configs[0]);
      data.configs.push({ from: t, amount: f.amount, payday: f.payday });
    }
    store.save(data); close(); render(); toast('保存したにゃ');
  };
  sheet.querySelector('#s-reset').onclick = () => {
    if(!confirm('すべての記録と設定を消します。元に戻せません。よろしいですか？')) return;
    localStorage.removeItem(KEY); data = null; close(); render();
  };
}

/* =========================================================
   部品
   ========================================================= */
function openSheet(html){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<div class="grip"></div>' + html;
  const close = () => { scrim.remove(); sheet.remove(); };
  scrim.onclick = close;
  document.body.append(scrim, sheet);
  return { scrim, sheet, close };
}
let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}

/* 日付が変わったら描き直す（開きっぱなし対策） */
let shown = todayStr();
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && shown !== todayStr()){ shown = todayStr(); render(); }
});

render();
})();
</script>
