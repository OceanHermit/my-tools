<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF6E9">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20261111a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261111a">
<link rel="manifest" href="manifest.webmanifest?v=20261111a">
<meta name="apple-mobile-web-app-title" content="NEKO-ZUKAI">
<title>NEKO-ZUKAI — ネコと貯めるおこづかい帳</title>
<meta name="description" content="毎月自由に使えるお金を決めて、毎日使った分を記録する。余りは次の月へ繰り越し。家ネコといっしょに続けるおこづかい帳。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9;
  --paper:#FFFFFF;
  --ink:#5A3E2B;
  --soft:#9A7B62;
  --line:#EAD6BC;
  --cream:#FFF1DE;
  --fur:#E8A25C;
  --stripe:#C97B3A;
  --accent:#E08A3C;
  --accent-dark:#B86A26;
  --minus:#C8553D;
  --good:#6C9A4B;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-weight:500;
  min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---- header ---- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.logo{font-weight:900;letter-spacing:.12em;font-size:15px}
.logo span{color:var(--accent)}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.icon-btn:active{background:var(--cream)}

/* ---- today ---- */
.today{padding:6px 4px 0}
.today .lbl{font-size:13px;color:var(--soft)}
.today .amt{font-size:46px;font-weight:900;line-height:1.1;margin:2px 0 4px;letter-spacing:.01em}
.today .amt.minus{color:var(--minus)}
.today .sub{font-size:12.5px;color:var(--soft)}
.today .sub b{color:var(--ink);font-weight:700}

/* ---- cat ---- */
.stage{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.cat{width:230px;height:220px;display:block;cursor:pointer;transform-origin:50% 100%}
.cat.bounce{animation:bounce .5s ease}
@keyframes bounce{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.94)}60%{transform:scale(.97,1.04)}}
.cat .lick-paw{transform-origin:157px 156px;animation:lick 1.4s ease-in-out infinite}
@keyframes lick{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.cat .twinkle{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cat *{animation:none!important}}

/* ---- savings ---- */
.save-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.save-top .v{font-size:24px;font-weight:900}
.save-top .v.minus{color:var(--minus)}
.lv-name{font-size:13px;color:var(--soft)}
.lv-name b{color:var(--accent);font-weight:900}
.lv-next{font-size:12px;color:var(--soft);margin-top:6px}
.lv-steps{display:flex;gap:4px;margin-top:10px}
.lv-steps i{flex:1;height:6px;border-radius:9px;background:var(--cream)}
.lv-steps i.on{background:var(--fur)}

/* ---- review ---- */
.review{text-align:center}
.review .cat{margin:0 auto;width:200px;height:190px}

/* ---- color pick ---- */
.steps{margin:0 0 14px;padding-left:20px;font-size:13.5px;line-height:1.7}
.steps li{margin-bottom:4px}
.color-pick{margin-top:14px}
.color-lbl{display:block;font-size:13.5px;font-weight:700}
.color-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.color-opt{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;color:var(--soft)}
.color-opt .cat{width:100%;height:auto;aspect-ratio:240/230;cursor:pointer}
.color-lbl small{font-weight:500;color:var(--soft);margin-left:8px;font-size:12px}
.color-opts.many{grid-template-columns:repeat(3,1fr);gap:6px}
.color-opts.many .color-opt{font-size:11px;padding:4px 2px 6px;line-height:1.3}
.color-opt.on{border-color:var(--accent);background:var(--cream);color:var(--ink)}
.review .big{font-size:34px;font-weight:900;margin:2px 0}
.review .big.minus{color:var(--minus)}
.review p{font-size:14px;color:var(--soft);margin-top:4px}
.gift-box{border:0;background:transparent;padding:0;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.cat.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.review .up{display:inline-block;margin-top:10px;background:var(--cream);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--accent-dark)}
.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.hist th{font-weight:500;color:var(--soft);font-size:12px;text-align:right;padding:4px 2px;border-bottom:1px dashed var(--line)}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist td{text-align:right;padding:7px 2px;border-bottom:1px dashed var(--line)}
.hist td.plus{color:var(--good);font-weight:700}
.hist td.minus{color:var(--minus);font-weight:700}
.bubble{
  position:relative;background:var(--paper);border:2px solid var(--line);
  border-radius:16px;padding:8px 14px;font-size:14px;margin-top:6px;max-width:90%;text-align:center;
}
.bubble::before{
  content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-top:0;border-bottom-color:var(--line);
}
.bubble::after{
  content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;
  border:6px solid transparent;border-top:0;border-bottom-color:var(--paper);
}
.bubble .who{font-size:11px;color:var(--soft);display:block}

/* ---- buttons ---- */
.btn{
  display:block;width:100%;border:0;border-radius:var(--r);padding:16px;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-dark);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.ghost{background:transparent;color:var(--soft);box-shadow:none;font-size:14px;padding:10px;font-weight:500}
.btn.ghost:active{transform:none;background:var(--cream)}
.btn:disabled{opacity:.45}
.actions{margin-top:14px}

/* ---- cards ---- */
.card{background:var(--paper);border-radius:var(--r);padding:14px 16px;margin-top:16px;border:1.5px solid var(--line)}
.card h2{font-size:14px;color:var(--soft);font-weight:700;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.stats .k{font-size:12px;color:var(--soft)}
.stats .v{font-size:18px;font-weight:700}
.stats .v.minus{color:var(--minus)}
.bar{height:10px;background:var(--cream);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--fur);border-radius:99px;transition:width .4s}
.bar.minus i{background:var(--minus)}

/* ---- history ---- */
.day{margin-top:10px}
.day:first-of-type{margin-top:0}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);border-bottom:1px dashed var(--line);padding-bottom:3px;margin-bottom:2px}
.ent{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 2px;text-align:left;border-radius:10px}
.ent:active{background:var(--cream)}
.ent .memo{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .memo.none{color:var(--soft)}
.ent .yen{font-weight:700}
.empty{color:var(--soft);font-size:13.5px;text-align:center;padding:8px 0}

/* ---- streak ---- */
.streak{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 16px;margin-top:16px}
.streak > svg{width:36px;height:36px;flex:0 0 auto}
.streak-t{font-size:14px}
.streak-t b{font-size:28px;font-weight:900;margin-right:2px}
.streak-t small{display:block;color:var(--soft);font-size:12px;line-height:1.3}

/* ---- calendar ---- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-h h2{margin:0;color:var(--ink)}
.cal-nav,.cal-nav-sp{width:36px;height:32px}
.cal-nav{border:0;background:transparent;font-size:22px;color:var(--soft);border-radius:10px;line-height:1}
.cal-nav:active{background:var(--cream)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-wd{font-size:11px;color:var(--soft)}
.cal-d{
  aspect-ratio:1;border:0;background:transparent;border-radius:10px;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--soft);padding:0;
}
button.cal-d:active{background:var(--cream)}
.cal-d.off{opacity:.4}
.cal-d.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-d svg{width:76%;height:76%}
.cal-d .n{position:absolute;top:1px;left:4px;font-size:9px;line-height:1}
.cal-d.stamped svg{animation:stamp .35s ease}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}70%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:11.5px;color:var(--soft);margin-top:8px}
.cal-legend span{display:flex;align-items:center;gap:3px}
.cal-legend svg{width:16px;height:16px}

/* ---- sheet (bottom modal) ---- */
.scrim{position:fixed;inset:0;background:rgba(90,62,43,.35);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .25s ease;max-height:92vh;overflow:auto;
}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-x{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--cream);color:var(--soft);font-size:16px;line-height:1;display:grid;place-items:center}
.sheet-x:active{background:var(--line)}
.sheet h3{font-size:16px;font-weight:900;text-align:center;margin-bottom:10px}

/* entry */
.disp{
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r);
  padding:8px 16px;text-align:right;font-size:38px;font-weight:900;min-height:64px;
}
.disp small{font-size:20px;margin-right:4px;color:var(--soft)}
.row2{display:flex;gap:8px;margin-top:10px}
.field{
  flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;
}
.field:focus{outline:2px solid var(--fur);outline-offset:-1px}
.date-chip{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:4px;padding:10px 12px;border-radius:12px;background:var(--cream);border:1.5px solid var(--line);font-size:14px;white-space:nowrap}
.date-chip input{position:absolute;inset:0;opacity:0;width:100%}
.favs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.fav{display:flex;justify-content:space-between;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-size:13px;text-align:left}
.fav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.fav.on{border-color:var(--fur);background:var(--cream)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.key{border:0;border-radius:14px;background:var(--paper);font-size:24px;font-weight:700;padding:12px 0;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none;background:var(--cream)}
.key.fn{font-size:18px;color:var(--soft)}

/* forms */
.form label{display:block;margin-top:14px;font-size:13.5px;font-weight:700}
.form label .hint{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.form .field{display:block;width:100%;margin-top:6px}
.yen-field{position:relative}
.yen-field::before{content:"¥";position:absolute;left:12px;top:50%;transform:translateY(-50%);margin-top:3px;color:var(--soft)}
.yen-field .field{padding-left:28px}
.err{color:var(--minus);font-size:13px;margin-top:10px;min-height:1em}

/* setup page */
.setup{padding-top:24px}
.setup .hello{text-align:center}
.setup .cat{margin:0 auto;width:200px;height:190px}
.setup .hello h1{font-size:22px;font-weight:900;letter-spacing:.08em;margin-top:4px}
.setup .hello h1 span{color:var(--accent)}
.setup .hello p{font-size:13.5px;color:var(--soft);margin-top:6px}

/* login / account */
.gbtn{
  display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 22px;border-radius:99px;
  background:var(--paper);border:1.5px solid var(--line);font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--line);
}
.gbtn:active{transform:translateY(2px);box-shadow:none}
.acct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--soft)}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .btn{width:auto;flex:0 0 auto}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;
  animation:fade .2s;white-space:nowrap;
}
.note{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="cat.js?v=20261111a"></script>
<script src="breeds/breeds.js?v=20261111a"></script>

<script>
(() => {
'use strict';

/* =========================================================
   保存（Firebase: Google ログイン + Firestore）

   users/{uid}                 catName / start / opening / configs
   users/{uid}/entries/{id}    date / amount / memo / at

   自分の uid の下しか読み書きできない（firestore.rules）。
   Firestore のオフライン保存を入れてあるので、圏外でも記録でき、つながると送られる。
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCxsW8vcezsybApzAd73Pazgsi0zPGDqOE",
  authDomain: "neko-zukai.firebaseapp.com",
  projectId: "neko-zukai",
  storageBucket: "neko-zukai.firebasestorage.app",
  messagingSenderId: "432650311710",
  appId: "1:432650311710:web:18495f9c6f8573800ab60f"
};
const LOCAL_KEY = 'neko-zukai-v1';   // 段階1でこの端末に保存していた記録（ログイン後に一度だけ引き継ぐ）

/*
  data = {
    catName: 'ミケ',
    start:   'YYYY-MM-DD',       // 記録を始めた期間の開始日
    opening: 30000,              // 始めたときの「今期の残り」
    configs: [{from:'YYYY-MM-DD', amount:30000, payday:25}],  // 設定の履歴（過去の期間を書き換えないため）
    entries: [{id, date:'YYYY-MM-DD', amount:500, memo:'', at:ms}],
  }
*/
let data = null;
const FB = { state: 'loading', msg: '', user: null, db: null, profile: undefined, entries: null, unsub: [] };

const userRef  = () => FB.db.collection('users').doc(FB.user.uid);
const entryCol = () => userRef().collection('entries');
const PROFILE_KEYS = ['catName','start','opening','configs'];
const profileOf = d => Object.fromEntries(PROFILE_KEYS.map(k => [k, d[k]]));

function fbMessage(e){
  const c = e && e.code;
  if(c === 'no-sdk') return 'ネットにつながらず、準備ができませんでした。通信を確かめて、開き直してください。';
  if(c === 'permission-denied') return 'Firestore のルールで許可されていません。ルールが反映されているか確かめてください。';
  if(c === 'auth/operation-not-allowed') return 'Firebase 側で Google ログインが有効になっていません。';
  if(c === 'auth/unauthorized-domain') return 'このドメインが Firebase の「承認済みドメイン」に入っていません。';
  if(c === 'unavailable' || c === 'auth/network-request-failed') return '通信が届きませんでした。電波を確かめて、もう一度お試しください。';
  return 'うまくいきませんでした（' + (c || 'unknown') + '）。';
}
const saveErr = e => toast(fbMessage(e));

/* snapshot が来るたびに data を組み立て直す */
function rebuild(){
  if(FB.profile === undefined || FB.entries === null){ data = null; return; }
  data = FB.profile ? { ...FB.profile, entries: FB.entries } : null;
}

function connect(){
  if(typeof firebase === 'undefined'){ FB.state = 'error'; FB.msg = fbMessage({ code:'no-sdk' }); render(); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    FB.db = firebase.firestore();
    FB.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  }catch(e){ FB.state = 'error'; FB.msg = fbMessage(e); render(); return; }

  const auth = firebase.auth();
  auth.getRedirectResult().catch(e => { if(e && e.code) toast(fbMessage(e)); });
  auth.onAuthStateChanged(user => {
    FB.unsub.forEach(f => f()); FB.unsub = [];
    FB.user = user; FB.profile = undefined; FB.entries = null; FB.profileLive = FB.entriesLive = false; data = null;
    if(!user){ FB.state = 'signedout'; render(); return; }
    FB.state = 'ready'; render();
    const fail = e => { FB.state = 'error'; FB.msg = fbMessage(e); render(); };
    FB.unsub.push(userRef().onSnapshot({ includeMetadataChanges: true }, s => {
      FB.profile = s.exists ? s.data() : null;
      FB.profileLive = !s.metadata.fromCache && !s.metadata.hasPendingWrites;   // 書き込みの途中の状態では判定しない
      if(!s.exists && !s.metadata.fromCache) migrateLocal();
      rebuild(); render();
    }, fail));
    FB.unsub.push(entryCol().onSnapshot({ includeMetadataChanges: true }, s => {
      FB.entries = s.docs.map(d => ({ id: d.id, ...d.data() }));
      FB.entriesLive = !s.metadata.fromCache && !s.metadata.hasPendingWrites;
      rebuild(); render();
    }, fail));
  });
}

function googleProvider(){
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  return p;
}
async function signIn(){
  const auth = firebase.auth();
  try{ await auth.signInWithPopup(googleProvider()); }
  catch(e){
    const c = e && e.code;
    if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if(c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-environment'){
      try{ await auth.signInWithRedirect(googleProvider()); }catch(e2){ toast(fbMessage(e2)); }
      return;
    }
    toast(fbMessage(e));
  }
}

/* 段階1でこの端末に保存していた記録を、クラウドが空のときだけ引き継ぐ */
let migrating = false;
async function migrateLocal(){
  if(migrating) return;
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(LOCAL_KEY)); }catch(e){}
  if(!local || !local.start) return;
  migrating = true;
  try{
    const list = local.entries || [];
    for(let i = 0; i < list.length; i += 400){
      const b = FB.db.batch();
      for(const e of list.slice(i, i + 400)){
        const { id, ...rest } = e;
        b.set(entryCol().doc(id), rest);
      }
      await b.commit();
    }
    await userRef().set(profileOf(local));
    localStorage.setItem(LOCAL_KEY + '-migrated', localStorage.getItem(LOCAL_KEY));
    localStorage.removeItem(LOCAL_KEY);
    toast('この端末の記録を引き継いだにゃ');
  }catch(e){ saveErr(e); }
  migrating = false;
}

/* =========================================================
   日付
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dim = (y, m) => new Date(y, m+1, 0).getDate();   // その月の日数
const todayStr = () => ymd(new Date());
const WD = ['日','月','火','水','木','金','土'];
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const yen = n => (n < 0 ? '−' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');

/* 加算日（31日などは月末に寄せる） */
const isPayday = (d, payday) => d.getDate() === Math.min(payday, dim(d.getFullYear(), d.getMonth()));

/* d を含む期間の開始日 */
function periodStartOf(d, payday){
  for(let i=0; i<32; i++){ const x = addDays(d, -i); if(isPayday(x, payday)) return x; }
  return d;
}
function configAt(s){
  let c = data.configs[0];
  for(const x of data.configs) if(x.from <= s) c = x;
  return c;
}

/* =========================================================
   計算
   ========================================================= */
function compute(){
  const today = todayStr();
  const spentBy = {};
  for(const e of data.entries) spentBy[e.date] = (spentBy[e.date]||0) + e.amount;

  // 開始日から今日まで1日ずつ進め、加算日が来たら期間を区切る
  const periods = [];
  let cur = { start: data.start, carry: 0, amount: data.opening, spent: 0 };
  let d = parse(data.start);
  const end = parse(today);
  while(d <= end){
    const s = ymd(d);
    const cfg = configAt(s);
    if(s !== data.start && isPayday(d, cfg.payday)){
      const left = cur.carry + cur.amount - cur.spent;
      cur.end = ymd(addDays(d, -1));
      periods.push(cur);
      cur = { start: s, carry: left, amount: cfg.amount, spent: 0 };
    }
    cur.spent += spentBy[s] || 0;
    d = addDays(d, 1);
  }

  // 次の加算日（今の設定で探す）
  const cfgNow = configAt(today);
  let next = addDays(end, 1);
  while(!isPayday(next, cfgNow.payday)) next = addDays(next, 1);
  cur.end = ymd(addDays(next, -1));

  const remaining = cur.carry + cur.amount - cur.spent;   // 今期の残り
  const spentToday = spentBy[today] || 0;
  const daysLeft = Math.round((next - end) / 864e5);       // 今日を含む残り日数

  // 1日の額: 期間の予算を日数で割る。使わなかった分はそのまま翌日へ、使いすぎた分は翌日から引く
  const all = [...periods, cur];
  const firstDay = firstCountDay(spentBy, today);
  const plan = dayPlan(cur, all.length === 1 ? firstDay : cur.start);
  const spentBefore = cur.spent - spentToday;
  const share = plan.through(today) - plan.through(ymd(addDays(end, -1)));   // 今日の分
  const carryDay = plan.through(ymd(addDays(end, -1))) - spentBefore;        // 昨日までの繰り越し（マイナスは使いすぎ）
  const base = share + carryDay;                                             // 今日使える額（朝の時点）
  const todayLeft = base - spentToday;

  return {
    today, cur, periods, remaining, spentToday, daysLeft, base, todayLeft, share, carryDay, plan,
    next: ymd(next), recordedToday: data.entries.some(e => e.date === today),
    stamps: stampsOf(all, spentBy, today, firstDay),
    ...growthOf(cur.carry, periods.length, cfgNow.amount), monthly: cfgNow.amount,
    ...streakOf(spentBy, today),
  };
}

/* 貯まった額とネコの段階。
   貯まった額 = これまでの期間の余りの合計（= 今期に繰り越された額）。
   段階は毎月の額に対する割合で決める */
const LEVELS = [
  { name: 'ぼさぼさ', min: -Infinity },
  { name: 'ふつう', min: 0 },
  { name: '毛づくろい', min: .1 },
  { name: 'にっこり', min: .5 },
  { name: '液体ネコ', min: 1 },
];
function levelOf(saved, monthly){
  if(saved < 0) return 0;
  const r = monthly > 0 ? saved / monthly : 0;
  let lv = 1;
  for(let i = 2; i < LEVELS.length; i++) if(r >= LEVELS[i].min) lv = i;
  return lv;
}
function growthOf(carry, closed, monthly){
  const saved = closed ? carry : 0;
  const level = levelOf(saved, monthly);
  const next = level < LEVELS.length - 1 ? Math.max(0, Math.ceil(LEVELS[level + 1].min * monthly) - saved) : 0;
  return { saved, level, toNext: level === 0 ? -saved : next };
}

/* カレンダーのスタンプ。記録のある日ごとに、その日の目安を守れたかを出す
   good = 目安内 / over = 使いすぎ / zero = 使わなかった */
function stampsOf(periods, spentBy, today, firstDay){
  const out = {};
  periods.forEach((p, i) => {
    const plan = dayPlan(p, i === 0 ? firstDay : p.start);
    let before = 0;                         // その日より前に使った額
    const last = parse(p.end);
    for(let d = parse(p.start); d <= last; d = addDays(d, 1)){
      const s = ymd(d);
      if(s > today) break;
      const spent = spentBy[s];
      if(spent !== undefined){
        const can = plan.through(s) - before;   // 繰り越しを含めた、その日に使える額
        out[s] = spent === 0 ? 'zero' : spent <= can ? 'good' : 'over';
      }
      before += spent || 0;
    }
  });
  return out;
}

/* 期間の予算を日割りにする。through(s) = その期間の初めから s の日までに使ってよい額の合計。
   最後の日にはちょうど予算全体になるので、割り切れない端数も最後に残る */
function dayPlan(p, from){
  const start = from > p.start ? from : p.start;
  const total = Math.round((parse(p.end) - parse(start)) / 864e5) + 1;
  const budget = p.carry + p.amount;
  return {
    start, total, budget,
    through(s){
      if(s < start) return 0;
      const k = Math.min(total, Math.round((parse(s) - parse(start)) / 864e5) + 1);
      return Math.floor(budget * k / total);
    },
  };
}
/* 最初の期間は、記録を始めた日から数える（それより前の日を「使わなかった日」として繰り越さないため） */
function firstCountDay(spentBy, today){
  const days = Object.keys(spentBy).filter(s => s >= data.start).sort();
  return days.length && days[0] < today ? days[0] : today;
}

/* 連続記録。あとから入れた日もつながる。今日まだ記録していなくても、昨日までつながっていれば途切れない */
function streakOf(spentBy, today){
  const has = s => spentBy[s] !== undefined;
  let d = parse(today);
  if(!has(today)) d = addDays(d, -1);
  let streak = 0;
  while(has(ymd(d))){ streak++; d = addDays(d, -1); }

  let best = 0, run = 0, prev = null;
  for(const s of Object.keys(spentBy).sort()){
    run = prev && ymd(addDays(parse(prev), 1)) === s ? run + 1 : 1;
    best = Math.max(best, run); prev = s;
  }
  return { streak, best };
}

  happy:   ['きょうも記録えらいにゃ','いい調子だにゃ','おさいふにやさしい一日だにゃ','この調子でいくにゃ'],
  over:    ['ちょっと使いすぎたにゃ…','だいじょうぶ、あしたの目安がすこし下がるだけにゃ','あしたから取りもどすにゃ'],
  minus:   ['今期はマイナスだにゃ…','次の加算日までがまんだにゃ','マイナスの分は次の期間から引かれるにゃ'],
  zero:    ['使わない日、すてきだにゃ','おさいふがよろこんでるにゃ'],
  pet:     ['にゃ〜ん','ごろごろ…','なでてくれてうれしいにゃ','ふみふみ…'],
  saved:   ['記録したにゃ！','ちゃんと書けてえらいにゃ','おぼえたにゃ'],
};
const pick = a => a[Math.floor(Math.random()*a.length)];

function moodOf(c){
  if(c.remaining < 0) return { face:'sad', line: pick(LINES.minus) };
  if(c.todayLeft < 0) return { face:'worried', line: pick(LINES.over) };
  if(c.recordedToday && c.spentToday === 0) return { face:'happy', line: pick(LINES.zero) };
  if(c.recordedToday) return { face:'happy', line: pick(LINES.happy) };
  return { face:'normal', line: pick(LINES.waiting) };
}

const seenKey = () => 'neko-zukai-review-' + FB.user.uid;
function maybeReview(c){
  // 手元のキャッシュだけで判断すると記録が足りずに数字を間違えるので、サーバーから届いてから
  if(!FB.profileLive || !FB.entriesLive) return;
  if(document.querySelector('.sheet')) return;
  let seen = null; try{ seen = localStorage.getItem(seenKey()); }catch(e){}
  if(seen === c.cur.start) return;
  try{ localStorage.setItem(seenKey(), c.cur.start); }catch(e){}
  if(!c.periods.length) return;   // まだ締めたことがない
  const last = c.periods[c.periods.length - 1];
  const surplus = last.amount - last.spent;               // その期間に浮かせた額
  const before = c.periods.length > 1 ? c.periods[c.periods.length - 2] : null;
  const prevLv = levelOf(c.periods.length > 1 ? last.carry : 0, c.monthly);
  const lunch = Math.floor(surplus / 800);
  const { sheet, close } = openSheet(`
    <div class="review">
      <div id="rv-cat"></div>
      <p>${md(last.start)} 〜 ${md(last.end)} の振り返り</p>
      <div class="big num ${surplus < 0 ? 'minus' : ''}">${surplus >= 0 ? yen(surplus) + ' 浮いたにゃ！' : yen(-surplus) + ' 使いすぎたにゃ…'}</div>
      ${surplus > 0 && lunch > 0 ? `<p>ランチ ${lunch}回分のお金を、使わずにすんだにゃ</p>` : ''}
      ${before ? `<p>その前の期間より ${surplus - (before.amount - before.spent) >= 0 ? yen(surplus - (before.amount - before.spent)) + ' 多く' : yen((before.amount - before.spent) - surplus) + ' 少なく'}浮いたにゃ</p>` : ''}
      <p>貯まった額は ${yen(c.saved)} になったにゃ</p>
      ${c.level > prevLv ? `<div class="up">${esc(data.catName)}が「${LEVELS[c.level].name}」になったにゃ！</div>` : ''}
      ${c.level < prevLv ? `<div class="up">${esc(data.catName)}が「${LEVELS[c.level].name}」になっちゃったにゃ…</div>` : ''}
      <button class="btn" id="rv-ok" style="margin-top:18px">${surplus >= 0 ? '今期もがんばるにゃ' : '今期は取りもどすにゃ'}</button>
    </div>`);
  sheet.querySelector('#rv-cat').replaceWith(makeCat(c.level, surplus >= 0 ? 'happy' : 'worried', 'rv'));
  sheet.querySelector('#rv-ok').onclick = () => { close(); maybeGift(c); };
}

/* =========================================================
   プレゼント
   期間を締めたとき液体ネコ（段階4）なら、まだ持っていない品種を1つもらえる。
   もらったかどうかはアカウントに記録する（giftPeriod = もらった期間の開始日）ので、端末が違っても1期間に1回だけ
   ========================================================= */
let giftBusy = false;
function giftReady(c){
  if(!FB.profileLive || !FB.entriesLive || !c.periods.length || c.level !== 4) return false;
  if(FB.profile.giftPeriod === c.cur.start) return false;
  return allBreeds().length > ownedBreeds().length;
}
function maybeGift(c){
  if(giftBusy || document.querySelector('.sheet') || !giftReady(c)) return;
  const { sheet, close } = openSheet(`
    <div class="review gift">
      <p>液体ネコのまま期間を終えたごほうびだにゃ</p>
      <button class="gift-box" id="gift-open" aria-label="プレゼントを開ける">
        <svg viewBox="0 0 120 120" width="150" height="150"><rect x="18" y="52" width="84" height="56" rx="8" fill="#F3B76C" stroke="#5A3E2B" stroke-width="4"/>
          <rect x="12" y="34" width="96" height="24" rx="8" fill="#F6C98C" stroke="#5A3E2B" stroke-width="4"/>
          <rect x="52" y="34" width="16" height="74" fill="#E0694F" stroke="#5A3E2B" stroke-width="4"/>
          <path d="M60 34 C44 8 22 18 34 30 Q46 38 60 34 C76 8 98 18 86 30 Q74 38 60 34 Z" fill="#E0694F" stroke="#5A3E2B" stroke-width="4" stroke-linejoin="round"/></svg>
      </button>
      <div class="big" style="font-size:22px">プレゼントがとどいたにゃ！</div>
      <p>箱を押して開けてね</p>
    </div>`);
  sheet.querySelector('#gift-open').onclick = async () => {
    if(giftBusy) return; giftBusy = true;
    let got = null;
    try{
      // 2つの端末で同時に開けても1つだけになるよう、トランザクションで確かめてから書く
      got = await FB.db.runTransaction(async tx => {
        const snap = await tx.get(userRef()), p = snap.data() || {};
        if(p.giftPeriod === c.cur.start) return null;
        const owned = p.breeds || [], rest = allBreeds().filter(b => !owned.includes(b.id));
        if(!rest.length) return null;
        const pick = rest[Math.floor(Math.random() * rest.length)];
        tx.set(userRef(), { breeds: [...owned, pick.id], giftPeriod: c.cur.start }, { merge: true });
        return pick;
      });
    }catch(e){ giftBusy = false; toast(e && e.code === 'permission-denied' ? 'Firestore のルールの更新が必要だにゃ' : fbMessage(e)); return; }
    giftBusy = false;
    if(!got){ close(); return; }

/* =========================================================
   カレンダー（肉球スタンプ）
   ========================================================= */
const PAW = c => `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="26" rx="9" ry="8" fill="${c}"/><circle cx="9" cy="16" r="4" fill="${c}"/><circle cx="16" cy="9" r="4" fill="${c}"/><circle cx="24" cy="9" r="4" fill="${c}"/><circle cx="31" cy="16" r="4" fill="${c}"/></svg>`;
const STAMP = { good: '#E8A25C', over: '#C9B6A5', zero: '#F2C14E' };
const STAMP_LABEL = { good: '目安内', over: '使いすぎ', zero: '使わなかった' };
let calMonth = null;   // 'YYYY-MM'。null なら今月
let seenStamps = null; // 前回描いたスタンプ。新しく押された日だけ動かす

function calendarHTML(c){
  const ym = s => s.slice(0, 7);
  const first = ym(data.start), last = ym(c.today);
  let m = calMonth || last;
  if(m < first) m = first;
  if(m > last) m = last;
  const [y, mo] = m.split('-').map(Number);
  const shift = k => { const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };

  let cells = WD.map(w => `<div class="cal-wd">${w}</div>`).join('');
  for(let i = 0; i < new Date(y, mo - 1, 1).getDay(); i++) cells += '<div></div>';
  for(let d = 1; d <= dim(y, mo - 1); d++){
    const s = `${m}-${pad(d)}`;
    const st = c.stamps[s];
    const fresh = st && seenStamps && seenStamps[s] !== st;
    const can = s >= data.start && s <= c.today;
    const label = `${mo}月${d}日${st ? ' ' + STAMP_LABEL[st] : ''}`;
    cells += `<${can ? 'button' : 'div'} class="cal-d ${s === c.today ? 'today' : ''} ${can ? '' : 'off'} ${fresh ? 'stamped' : ''}" ${can ? `data-d="${s}" aria-label="${label}"` : ''}>
      ${st ? `<span class="n">${d}</span>${PAW(STAMP[st])}` : d}</${can ? 'button' : 'div'}>`;
  }
  const nav = (k, txt, show) => show
    ? `<button class="cal-nav" data-m="${shift(k)}" aria-label="${k < 0 ? '前の月' : '次の月'}">${txt}</button>`
    : '<span class="cal-nav-sp"></span>';
  seenStamps = { ...c.stamps };
  return `<section class="card cal">
    <div class="cal-h">${nav(-1, '‹', m > first)}<h2>${y}年 ${mo}月</h2>${nav(1, '›', m < last)}</div>
    <div class="cal-g">${cells}</div>
    <div class="cal-legend">${Object.keys(STAMP).map(k => `<span>${PAW(STAMP[k])}${STAMP_LABEL[k]}</span>`).join('')}</div>
  </section>`;
}

/* ネコの絵（cat.js）。段階でポーズと毛並み、その日の様子で表情が変わる */
const catCache = {};
const COLOR_KEY = 'neko-zukai-color';
const BASE_KINDS = [{ id: 'white', name: '白' }, { id: 'apricot', name: 'アプリコット' }];
const allBreeds = () => window.nekoBreeds || [];
const ownedBreeds = () => { const o = (FB.profile && FB.profile.breeds) || []; return allBreeds().filter(b => o.includes(b.id)); };
const catKinds = () => [...BASE_KINDS, ...ownedBreeds()];
const isBreed = id => allBreeds().some(b => b.id === id);
function catColor(){
  const c = FB.profile && FB.profile.catColor;

/* 毛色は設定とは別に保存する（ルールが古いままでも、ほかの設定の保存を巻き込まないため） */
function saveColor(color){
  try{ localStorage.setItem(COLOR_KEY, color); }catch(e){}
  if(FB.user && FB.db) userRef().set({ catColor: color }, { merge: true }).catch(e => {
    if(e && e.code === 'permission-denied') toast('毛色はこの端末にだけ保存したにゃ（Firestore のルールの更新が必要）');
    else saveErr(e);
  });
}
function faceOpt(lv, face){
  if(face === 'worried' || face === 'sad') return { eye: 'tired', mouth: 'frown' };
  if(face === 'happy') return lv === 0 ? { eye: 'tired', mouth: 'normal' } : lv === 3 ? {} : { eye: 'happy', mouth: 'normal' };
  return {};
}
function makeCat(lv = 1, face = 'normal', key = 'nk', color = catColor()){
  const opt = { ...faceOpt(lv, face), color }, ck = `${key}-${color}-${lv}-${opt.eye || ''}-${opt.mouth || ''}`;
  if(!catCache[ck]) catCache[ck] = isBreed(color) ? nekoBreed(color, ck, lv, opt) : window.nekoCat ? nekoCat(lv, ck, opt) : '<svg class="cat" viewBox="0 0 240 230"></svg>';
  const box = document.createElement('div'); box.innerHTML = catCache[ck];
  const svg = box.firstElementChild;
  svg.addEventListener('click', () => {

/* よく入れる「金額＋メモ」。2回以上入れたものを、回数 → 新しさの順に4つまで */
function frequent(){
  const m = new Map();
  for(const e of data.entries){
    if(!e.amount) continue;
    const k = e.amount + '\u0000' + e.memo;
    const x = m.get(k) || { amount: e.amount, memo: e.memo, n: 0, at: 0 };
    x.n++; x.at = Math.max(x.at, e.at); m.set(k, x);
  }
  return [...m.values()].filter(x => x.n >= 2).sort((a,b) => b.n - a.n || b.at - a.at).slice(0, 4);
}

    $val.textContent = val ? Number(val).toLocaleString('ja-JP') : '0';

/* =========================================================
   ウィジェット（Scriptable）
   ・設定でリンクを作ると、widgets/{秘密の番号} にまとめを置く。誰でも読めるが、番号を知らないと見つけられない
   ・まとめには、日割りを計算し直せる数字だけを入れる（記録の中身やメモは入れない）
     今日つかえるお金 = through(今日) − spent。アプリを開かない日が続いても、ウィジェット側で正しく計算できる
   ========================================================= */
let widgetLast = '';
const widgetToken = () => FB.profile && FB.profile.widgetToken;
function widgetData(c){
  return {
    uid: FB.user.uid, catName: data.catName, color: catColor(), level: c.level,
    start: c.plan.start, end: c.cur.end, total: c.plan.total, budget: c.plan.budget, spent: c.cur.spent,
    streak: c.streak, updated: c.today,
  };
}
function syncWidget(c){
  const t = widgetToken();
  if(!t || !FB.profileLive || !FB.entriesLive) return;
  const d = widgetData(c), key = JSON.stringify(d);
  if(key === widgetLast) return;
  widgetLast = key;
  FB.db.collection('widgets').doc(t).set(d).catch(e => { widgetLast = ''; if(e && e.code !== 'permission-denied') saveErr(e); });
}
function newToken(){
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(a, x => abc[x % abc.length]).join('');
}
function widgetScript(token){
  return `// NEKO-ZUKAI ウィジェット（小）。Scriptable に貼って使う
const TOKEN = "${token}";
const KEY = "${firebaseConfig.apiKey}";
const BASE = "https://oceanhermit.github.io/my-tools/neko-zukai/";
const DOC = "https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/widgets/" + TOKEN + "?key=" + KEY;

const C = { bg: new Color("#FFF6E9"), ink: new Color("#5A3E2B"), soft: new Color("#9A7B62"), minus: new Color("#C8553D"), accent: new Color("#E08A3C") };
const yen = n => (n < 0 ? "−" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const day = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

async function load(){
  try{
    const j = await new Request(DOC).loadJSON();
    if(!j.fields) return null;
    const o = {};
    for(const [k, v] of Object.entries(j.fields)) o[k] = v.stringValue ?? Number(v.integerValue ?? v.doubleValue);
    return o;
  }catch(e){ return null; }
}
async function catImage(d){
  const fm = FileManager.local(), path = fm.joinPath(fm.cacheDirectory(), "neko-" + d.color + "-" + d.level + ".png");
  try{ const img = await new Request(BASE + "widget/cat-" + d.color + "-" + d.level + ".png").loadImage(); fm.writeImage(path, img); return img; }
  catch(e){ return fm.fileExists(path) ? fm.readImage(path) : null; }
}

const d = await load();
const w = new ListWidget();
w.backgroundColor = C.bg;
w.setPadding(12, 12, 10, 12);
w.url = BASE + "#add";
w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);

if(!d){
  const t = w.addText("NEKO-ZUKAI"); t.font = Font.boldRoundedSystemFont(14); t.textColor = C.ink;
  w.addSpacer(6);
  const m = w.addText("読みこめなかったにゃ。電波を確かめてね"); m.font = Font.systemFont(11); m.textColor = C.soft;
}else{
  const today = ymd(new Date());
  const through = s => s < d.start ? 0 : Math.floor(d.budget * Math.min(d.total, Math.round((day(s) - day(d.start)) / 864e5) + 1) / d.total);
  const top = w.addStack(); top.layoutHorizontally(); top.centerAlignContent();
  const left = top.addStack(); left.layoutVertically();
  const lbl = left.addText("今日つかえる"); lbl.font = Font.mediumRoundedSystemFont(11); lbl.textColor = C.soft;
  top.addSpacer();
  const img = await catImage(d);
  if(img){ const im = top.addImage(img); im.imageSize = new Size(58, 56); }
  w.addSpacer(2);
  if(today > d.end){
    const a = w.addText("加算日だにゃ"); a.font = Font.boldRoundedSystemFont(18); a.textColor = C.ink;
    const b = w.addText("アプリを開いてね"); b.font = Font.systemFont(11); b.textColor = C.soft;
  }else{
    const left2 = through(today) - d.spent;
    const a = w.addText(yen(left2)); a.font = Font.boldRoundedSystemFont(26); a.textColor = left2 < 0 ? C.minus : C.ink; a.minimumScaleFactor = .6; a.lineLimit = 1;
    const b = w.addText("今期の残り " + yen(d.budget - d.spent)); b.font = Font.systemFont(10.5); b.textColor = C.soft; b.lineLimit = 1;
  }
  w.addSpacer();
  const btn = w.addStack(); btn.backgroundColor = C.accent; btn.cornerRadius = 12; btn.setPadding(6, 10, 6, 10); btn.centerAlignContent();
  btn.addSpacer();
  const bt = btn.addText("＋ 記録する"); bt.font = Font.boldRoundedSystemFont(13); bt.textColor = Color.white();
  btn.addSpacer();
}
if(config.runsInWidget) Script.setWidget(w); else await w.presentSmall();
Script.complete();
`;
}
async function openWidgetSetup(){
  let t = widgetToken();
  if(!t){
    t = newToken();
    try{ await userRef().set({ widgetToken: t }, { merge: true }); }
    catch(e){ toast(e && e.code === 'permission-denied' ? 'Firestore のルールの更新が必要だにゃ' : fbMessage(e)); return; }
    FB.profile = { ...(FB.profile || {}), widgetToken: t };
    widgetLast = ''; syncWidget(compute());
  }
  const script = widgetScript(t);
  const { sheet } = openSheet(`
    <h3>ホーム画面のウィジェット</h3>
    <ol class="steps">
      <li>App Store で「Scriptable」（無料）を入れる</li>
      <li>下のボタンでスクリプトをコピーする</li>
      <li>Scriptable を開き、右上の「＋」→ 貼り付け → 上の名前を「NEKO-ZUKAI」にする</li>
      <li>ホーム画面を長押し →「＋」→ Scriptable → いちばん小さいサイズを追加</li>
      <li>追加したウィジェットを長押し →「ウィジェットを編集」→ Script で「NEKO-ZUKAI」を選ぶ</li>
    </ol>
    <button class="btn" id="w-copy">スクリプトをコピー</button>
    <p class="note" style="text-align:left">ウィジェットを押すと、Safari で記録の画面が開くにゃ。はじめて開くときだけ、Safari でもログインしてね。<br>
      スクリプトには、あなた専用の秘密の番号が入っているので、ほかの人に渡さないでね。</p>`);
  sheet.querySelector('#w-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(script); toast('コピーしたにゃ'); }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = script; sheet.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('コピーしたにゃ'); }catch(e2){ toast('コピーできなかったにゃ'); }
      ta.remove();
    }
  };
}

let addHandled = false;
window.addEventListener('hashchange', () => { if(location.hash === '#add'){ addHandled = false; if(data) maybeOpenAdd(); } });
function maybeOpenAdd(){
  if(addHandled || location.hash !== '#add' || document.querySelector('.sheet')) return;
  addHandled = true;
  history.replaceState(null, '', location.pathname + location.search);
  openEntry();
}

/* 下から出る画面。閉じ方は ✕ ボタン・外側を押す・下へスワイプ・Esc キー */
function openSheet(html){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<div class="grip"></div><button class="sheet-x" aria-label="閉じる">✕</button>' + html;
  const onKey = e => { if(e.key === 'Escape') close(); };
  const close = () => { scrim.remove(); sheet.remove(); document.removeEventListener('keydown', onKey); };
  scrim.onclick = close;
  sheet.querySelector('.sheet-x').onclick = close;
  document.addEventListener('keydown', onKey);

  // 下へスワイプで閉じる。いちばん上までスクロールしているときだけ（中身のスクロールとぶつからないように）
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if(e.target.closest('input, select, textarea, .keys')) return;
    y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
    else { sheet.style.transform = ''; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if(y0 === null) return;
    y0 = null;
    sheet.style.transition = 'transform .2s ease';
    if(dy > 90){ sheet.style.transform = 'translateY(100%)'; setTimeout(close, 180); }
    else sheet.style.transform = '';
  });

  document.body.append(scrim, sheet);
  return { scrim, sheet, close };
}
let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && shown !== todayStr()){ shown = todayStr(); render(); }
});
