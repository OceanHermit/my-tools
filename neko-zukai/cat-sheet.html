<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEKO-ZUKAI ネコの確認</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E9;font-family:"Zen Maru Gothic",sans-serif;color:#5A3E2B}
h1{font-size:18px;text-align:center;margin:20px 16px 4px}
h2{font-size:15px;text-align:center;margin:24px 0 8px}
p.lead{text-align:center;font-size:13px;margin:0 16px 12px;color:#9A7B62}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 16px}
.cell{width:200px;background:#fff;border:1.5px solid #EAD6BC;border-radius:14px;padding:6px;text-align:center;font-size:13px}
.cell svg{width:188px;height:180px;display:block;margin:0 auto}
.cell small{display:block;color:#9A7B62}
.twinkle{animation:tw 1.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.lick-paw{transform-origin:157px 156px;animation:lick 1.4s ease-in-out infinite}@keyframes lick{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
</style>
<script src="cat.js"></script>
</head><body>
<h1>NEKO-ZUKAI のネコ</h1>
<p class="lead">貯まった額で段階が変わります（毛色は設定で白とアプリコットから選べます）</p>
<div id="out"></div>
<script>
const L = [['0. ぼさぼさ','貯金がマイナス'],['1. ふつう','0円〜'],['2. 毛づくろい','毎月の額の10%〜'],['3. にっこり','50%〜'],['4. 液体ネコ','100%〜']];
document.getElementById('out').innerHTML = [['white','白'],['apricot','アプリコット']].map(([c, n]) =>
  `<h2>${n}</h2><div class="grid">${L.map((o, i) => `<div class="cell">${nekoCat(i, c + i, { color: c })}<b>${o[0]}</b><small>${o[1]}</small></div>`).join('')}</div>`).join('');
</script>
</body></html>
