<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4; --card:#fff; --ink:#2c2a26; --muted:#7a736a;
    --line:#e6e0d6; --accent:#c2703d; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#1a1815;--card:#232019;--ink:#efe9df;--muted:#a49a8c;--line:#38322a;--accent:#e0925c;
          --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
       line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:56px 20px 80px}
  header{margin-bottom:40px}
  h1{font-size:1.9rem;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:.92rem;margin:0}
  .grid{display:grid;gap:14px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);
        border:1px solid var(--line);border-radius:14px;padding:20px 22px;
        box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card h2{margin:0 0 4px;font-size:1.12rem;font-weight:700}
  .card p{margin:0;color:var(--muted);font-size:.88rem}
  .tag{display:inline-block;margin-top:10px;font-size:.72rem;padding:2px 9px;border-radius:99px;
       border:1px solid var(--line);color:var(--muted)}
  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛠️ My Tools</h1>
    <p class="sub">自作ツール置き場</p>
  </header>

  <div class="grid">
    <a class="card" href="./kyogaku-go/">
      <h2>教学でGo!</h2>
      <p>仏教教学のクイズアプリ</p>
      <span class="tag">単体で動作</span>
    </a>

    <a class="card" href="./kizuna-karuta/">
      <h2>キズナかるた</h2>
      <p>オンライン対戦かるた</p>
      <span class="tag">Firebase 連携</span>
    </a>
  </div>

  <footer>更新したら GitHub に push するだけで自動反映されます。</footer>
</div>
</body>
</html>
