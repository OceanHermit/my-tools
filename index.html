<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudeツール開発台帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#D9DFE7; --line-soft:#E7EBF1;
  --ink:#17202B; --ink-2:#5C6875; --ink-3:#8B96A3;
  --accent:#2F5D8C; --accent-soft:#E2EAF3; --accent-ink:#24486C;
  --s-idea:#6C6AA0; --s-build:#A46A16; --s-test:#1B7368; --s-live:#2C7048; --s-hold:#77828F;
  --shadow:0 1px 2px rgba(23,32,43,.05), 0 8px 20px -12px rgba(23,32,43,.18);
  --radius:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#191F27; --surface-2:#202832; --line:#2C3641; --line-soft:#232C36;
    --ink:#E7EBF1; --ink-2:#9BA6B4; --ink-3:#6F7B89;
    --accent:#7FAFDE; --accent-soft:#1C2937; --accent-ink:#A8C9EC;
    --s-idea:#A6A2E0; --s-build:#DFA44C; --s-test:#54BFAF; --s-live:#6BBF8B; --s-hold:#98A4B2;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#191F27; --surface-2:#202832; --line:#2C3641; --line-soft:#232C36;
  --ink:#E7EBF1; --ink-2:#9BA6B4; --ink-3:#6F7B89;
  --accent:#7FAFDE; --accent-soft:#1C2937; --accent-ink:#A8C9EC;
  --s-idea:#A6A2E0; --s-build:#DFA44C; --s-test:#54BFAF; --s-live:#6BBF8B; --s-hold:#98A4B2;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -14px rgba(0,0,0,.6);
}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:28px 18px 96px; display:flex; flex-direction:column; gap:22px}

/* ---------- header ---------- */
.masthead{display:flex; flex-direction:column; gap:14px; padding-bottom:18px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:"Roboto Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.title-row{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px}
h1{font-family:"Shippori Mincho B1","Yu Mincho",serif; font-weight:600;
   font-size:clamp(24px,4.4vw,33px); line-height:1.3; margin:0; letter-spacing:.02em; text-wrap:balance}
.lede{margin:0; color:var(--ink-2); font-size:13.5px; max-width:60ch}
.meta{font-family:"Roboto Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- tally / filters ---------- */
.tally{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 10px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  font-size:12.5px; color:var(--ink-2); cursor:pointer; font-family:inherit;
  transition:border-color .15s, color .15s, background .15s}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--d,var(--ink-3)); flex:none}
.chip .n{font-family:"Roboto Mono",monospace; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:var(--accent-ink)}

/* ---------- cards ---------- */
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 16px 14px; display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow)}
.card.has-url{border-color:color-mix(in srgb, var(--c) 40%, var(--line))}
.card-head{display:flex; align-items:flex-start; gap:10px; justify-content:space-between}
.card h2{margin:0; font-size:15.5px; font-weight:700; line-height:1.45; letter-spacing:.01em}
.pill{flex:none; font-size:11px; font-weight:500; padding:3px 9px; border-radius:4px; white-space:nowrap;
  color:var(--c); border:1px solid color-mix(in srgb, var(--c) 38%, transparent);
  background:color-mix(in srgb, var(--c) 11%, transparent)}
.summary{margin:0; font-size:13px; color:var(--ink-2); line-height:1.72}

/* 公開済みツールを開くボタン */
.open{display:flex; align-items:center; justify-content:space-between; gap:8px;
  text-decoration:none; font-size:13px; font-weight:500; padding:9px 13px; border-radius:5px;
  color:#fff; background:var(--c); transition:filter .15s}
.open:hover{filter:brightness(1.12)}
.open .arw{font-family:"Roboto Mono",monospace; opacity:.85}

.bar{display:flex; align-items:center; gap:9px}
.bar-track{flex:1; height:5px; border-radius:3px; background:var(--line-soft); overflow:hidden}
.bar-fill{height:100%; border-radius:3px; background:var(--c); transition:width .35s ease}
.bar-num{font-family:"Roboto Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:34px; text-align:right}
.block-label{font-family:"Roboto Mono",monospace; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 5px}
.next{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px}
.next li{position:relative; padding-left:15px; font-size:13px; color:var(--ink); line-height:1.65}
.next li::before{content:""; position:absolute; left:1px; top:.62em; width:5px; height:5px; border-radius:1px; background:var(--c); opacity:.8}
.links{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:11.5px; padding:3px 9px; border-radius:4px; border:1px solid var(--line);
  color:var(--ink-2); background:var(--surface-2); text-decoration:none; display:inline-block}
a.tag{color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 34%, transparent)}
a.tag:hover{background:var(--accent-soft)}
.card-foot{display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:auto; padding-top:11px; border-top:1px solid var(--line-soft)}
.stamp{font-family:"Roboto Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
button{font-family:inherit}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:5px; padding:6px 13px; font-size:12.5px; cursor:pointer;
  transition:border-color .15s, color .15s, background .15s}
.btn:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
.btn-primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:#fff}
.btn-danger{color:#B3452F; border-color:color-mix(in srgb,#B3452F 34%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,#B3452F 10%,transparent); border-color:#B3452F; color:#B3452F}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.empty{padding:44px 20px; text-align:center; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--radius)}

/* ---------- ローカル編集バナー ---------- */
.draft{display:none; align-items:center; flex-wrap:wrap; gap:9px; padding:11px 14px;
  background:var(--surface); border:1px solid color-mix(in srgb,var(--s-build) 42%,transparent);
  border-left:3px solid var(--s-build); border-radius:var(--radius); font-size:12.5px; color:var(--ink-2)}
.draft[data-show="1"]{display:flex}
.draft .grow{flex:1; min-width:190px}

/* ---------- 保存トースト ---------- */
.savebar{position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(140%);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:999px; padding:9px 18px; font-size:12.5px; color:var(--ink-2);
  transition:transform .25s ease, opacity .2s ease; z-index:60; max-width:calc(100vw - 32px);
  opacity:0; visibility:hidden; pointer-events:none}
.savebar[data-show="1"]{transform:translateX(-50%) translateY(0); opacity:1; visibility:visible}
.savebar[data-tone="err"]{color:#B3452F; border-color:color-mix(in srgb,#B3452F 40%,transparent)}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink);
  padding:0; width:min(560px, calc(100vw - 24px)); max-height:calc(100dvh - 40px); box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(12,17,23,.5)}
.dlg{display:flex; flex-direction:column; max-height:calc(100dvh - 40px)}
.dlg-head{padding:16px 18px 12px; border-bottom:1px solid var(--line-soft)}
.dlg-head h3{margin:0; font-family:"Shippori Mincho B1",serif; font-weight:600; font-size:17px; letter-spacing:.02em}
.dlg-body{padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
.dlg-foot{padding:12px 18px; border-top:1px solid var(--line-soft); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.dlg-foot .spacer{margin-right:auto}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; font-weight:500; color:var(--ink-2)}
.field .hint{font-size:11px; color:var(--ink-3); line-height:1.6}
input[type="text"], textarea, select{font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:5px; padding:8px 10px; width:100%; line-height:1.7}
textarea{resize:vertical; min-height:74px}
input:focus, textarea:focus, select:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.range-row{display:flex; align-items:center; gap:10px}
input[type="range"]{flex:1; accent-color:var(--accent)}
.range-val{font-family:"Roboto Mono",monospace; font-size:12.5px; min-width:42px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2)}
@media (max-width:520px){ .row2{grid-template-columns:1fr} .wrap{padding:20px 14px 90px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<script src="./ledger.js" defer></script>
</body>
</html>
