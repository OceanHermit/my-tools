<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>かさなり — 時間帯で決める日程調整</title>
<meta name="description" content="候補日ごとに空いている時間帯を集めて、いちばん重なる時間を5分単位で割り出す日程調整ツール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14182B;
  --slate:#59627E;
  --line:#D3D9E6;
  --field:#EBEFF6;
  --paper:#FFFFFF;
  --pulse:#2F5BFF;
  --maybe:#E8912B;
  --none:#B9C0D1;
  --bg:#E4E9F2;
  --solid:#14182B;
  --on-solid:#FFFFFF;
  --sat:#2C63A8;
  --sun:#B4453F;
  --memo-bg:#FCF4E8;
  --memo-ink:#7A5417;
  --hour:rgba(255,255,255,.85);
  --card-shadow:0 1px 0 rgba(20,24,43,.05),0 8px 24px -18px rgba(20,24,43,.5);
  --toast-shadow:0 10px 30px -10px rgba(20,24,43,.7);
  --r:14px;
  color-scheme:light;   /* select やスクロールバーなど、ブラウザ側の部品もライトで描かせる */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  padding:0 0 96px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---- header ---- */
header{padding:22px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{
  font-size:23px;font-weight:900;letter-spacing:.14em;margin:0;
}
.brand span{font-size:11px;letter-spacing:.18em;color:var(--slate)}
.tagline{margin:4px 0 0;font-size:12.5px;color:var(--slate)}

/* ---- signature: stacked bars in the logo ---- */
.mark{display:flex;flex-direction:column;gap:2px;width:26px}
.mark i{display:block;height:4px;border-radius:2px;background:var(--pulse)}
.mark i:nth-child(1){opacity:.25;width:70%}
.mark i:nth-child(2){opacity:.5;width:100%;margin-left:14%}
.mark i:nth-child(3){opacity:.9;width:52%;margin-left:30%}

/* ---- cards ---- */
.card{background:var(--paper);border-radius:var(--r);padding:18px 16px;margin:0 0 14px;
  box-shadow:var(--card-shadow)}
.card h2{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:.02em}
.eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--slate);font-weight:600;margin:0 0 8px}
.hint{font-size:12.5px;color:var(--slate);margin:6px 0 0}

label.f{display:block;font-size:12px;font-weight:700;color:var(--slate);margin:14px 0 6px;letter-spacing:.04em}
label.f:first-of-type{margin-top:0}
input[type=text],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--field);
  border:1px solid transparent;border-radius:10px;padding:11px 12px;appearance:none;
}
::placeholder{color:var(--slate);opacity:.8}
textarea{resize:vertical;min-height:56px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--slate) 50%),linear-gradient(135deg,var(--slate) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pulse);outline-offset:2px}

button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{display:block;width:100%;background:var(--solid);color:var(--on-solid);border-radius:11px;
  padding:14px;font-weight:700;letter-spacing:.04em;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.alt{background:var(--field);color:var(--ink)}
.btn.ghost{background:none;color:var(--slate);font-size:13px;padding:10px;font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* ---- calendar ---- */
.cal{margin-top:4px}
.cal .mon{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.cal .mon strong{font-size:14px;letter-spacing:.06em}
.cal .nav{width:34px;height:34px;border-radius:9px;background:var(--field);font-size:15px;line-height:1;flex:0 0 auto}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid7 .dow{text-align:center;font-size:10.5px;color:var(--slate);padding:2px 0;letter-spacing:.06em}
.day{aspect-ratio:1;border-radius:9px;background:var(--field);font-size:13.5px;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.day.out{background:none;color:transparent;pointer-events:none}
.day.past{opacity:.32}
.day.sat{color:var(--sat)}.day.sun{color:var(--sun)}
.day.on{background:var(--solid);color:var(--on-solid)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--field);border-radius:999px;padding:5px 10px;font-size:12px;font-family:"IBM Plex Mono",monospace}
.chip b{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500}

/* ---- answer blocks ---- */
.dayblock{border-top:1px solid var(--line);padding:16px 0 4px}
.dayblock:first-of-type{border-top:0;padding-top:2px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dhead .dt{font-size:15px;font-weight:700;letter-spacing:.03em}
.dhead .dt em{font-style:normal;font-size:12px;color:var(--slate);margin-left:4px}
.marks{display:flex;gap:6px;flex:0 0 auto}
.mk{width:42px;height:38px;border-radius:10px;background:var(--field);font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--slate);font-weight:700}
.mk.on[data-m=o]{background:var(--pulse);color:#fff}
.mk.on[data-m=t]{background:var(--maybe);color:#fff}
.mk.on[data-m=x]{background:var(--none);color:#fff}

.band{display:flex;align-items:center;gap:7px;margin:0 0 7px}
.band select{flex:1}
.band .tilde{color:var(--slate);font-size:12px;flex:0 0 auto}
.band .del{flex:0 0 auto;width:34px;height:36px;border-radius:9px;background:var(--field);color:var(--slate);font-size:16px}
.addband{font-size:12.5px;color:var(--pulse);font-weight:700;padding:4px 0}

/* ---- density track (signature) ---- */
.track{margin:12px 0 0}
.tlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--slate);margin-bottom:3px}
.tbar{display:flex;height:30px;border-radius:7px;overflow:hidden;background:var(--field)}
.slot{flex:1;position:relative;min-width:0}
.slot.hour{box-shadow:inset -1px 0 0 var(--hour)}
.slot:last-child{box-shadow:none}
.slot .fill{position:absolute;inset:0;background:var(--pulse)}
.slot .mb{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--maybe)}

/* ---- results ---- */
.win{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:0 0 9px;background:var(--paper)}
.win.top{border-color:var(--ink);border-width:1.5px}
.win .wtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.win .time{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;letter-spacing:-.01em}
.win .date{font-size:12px;color:var(--slate);margin-right:6px}
.tally{display:flex;gap:8px;font-size:12px;font-family:"IBM Plex Mono",monospace;flex:0 0 auto}
.tally .o{color:var(--pulse);font-weight:600}
.tally .t{color:var(--maybe);font-weight:600}
.tally .x{color:var(--none)}
.who{margin-top:8px;font-size:12.5px;color:var(--slate);display:flex;flex-wrap:wrap;gap:4px 8px}
.who b{font-weight:500;color:var(--ink)}
.memo{margin-top:7px;font-size:12.5px;background:var(--memo-bg);border-radius:9px;padding:8px 10px;color:var(--memo-ink)}
.memo p{margin:0 0 3px}.memo p:last-child{margin:0}
.free{font-size:11.5px;color:var(--slate);margin-top:5px}

.codebox{display:flex;align-items:center;gap:10px;background:var(--solid);border-radius:12px;padding:14px 16px;color:var(--on-solid)}
.codebox .cd{font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.24em;font-weight:600}
.codebox small{display:block;font-size:10.5px;letter-spacing:.16em;opacity:.6;margin-bottom:2px}

.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--paper);padding:5px;border-radius:12px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--slate)}
.tabs button.on{background:var(--solid);color:var(--on-solid)}

.empty{text-align:center;color:var(--slate);font-size:13px;padding:28px 10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
  background:var(--solid);color:var(--on-solid);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;
  z-index:50;box-shadow:var(--toast-shadow);max-width:calc(100% - 32px);text-align:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.3,1.2),visibility 0s linear .3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;
  transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.3,1.2),visibility 0s}
.mine{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mine:first-child{border-top:0}
.mine .t{font-size:14px;font-weight:700}
.mine .c{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);letter-spacing:.1em}
.closedtag{display:inline-block;font-size:10.5px;letter-spacing:.12em;background:var(--field);color:var(--slate);padding:3px 8px;border-radius:999px;font-weight:700}
.notice{border-radius:11px;padding:10px 12px;font-size:12.5px;margin:0 0 14px}
.notice.wait{background:var(--field);color:var(--slate)}
.notice.bad{background:var(--memo-bg);color:var(--memo-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- account row ---- */
.acct{background:var(--paper);border-radius:var(--r);padding:12px 14px;margin:0 0 14px;
  box-shadow:var(--card-shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.acct .sub{font-size:12px;color:var(--slate);margin:0;flex:1 1 190px;min-width:0;line-height:1.55}
.acct .me{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.acct .nm{font-size:14px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--pulse);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
/* Google のボタンはブランド指定に合わせて明色のまま固定する */
.gbtn{display:flex;align-items:center;gap:9px;background:#FFFFFF;color:#1F1F1F;border:1px solid #DADCE0;
  border-radius:999px;padding:9px 16px 9px 12px;font-size:13.5px;font-weight:700;flex:0 0 auto;
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif}
.gbtn:active{background:#F1F3F4}
.gbtn svg{width:18px;height:18px;flex:0 0 auto;display:block}
.lnk{font-size:12.5px;color:var(--slate);text-decoration:underline;padding:6px 2px;flex:0 0 auto}
.vmark{color:var(--pulse);font-weight:700;margin-left:1px;font-size:11px;vertical-align:.05em}

/* ---- 時間帯えらび（ドラッグ式） ---- */
.tl{margin:2px 0}
.tl-track{position:relative;height:40px;border-radius:9px;background:var(--field);overflow:hidden;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.tl-track .tk{position:absolute;top:0;bottom:0;width:1px;background:var(--hour);pointer-events:none}
.tl-band{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--pulse);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:grab;min-width:3px}
.tl-band.t{background:var(--maybe)}
.tl-band .bl{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  letter-spacing:-.02em;pointer-events:none;white-space:nowrap}
.tl-band .h{position:absolute;top:0;bottom:0;width:15px;touch-action:none;cursor:ew-resize}
.tl-band .h.l{left:0}.tl-band .h.r{right:0}
.tl-band .h::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:3px;height:15px;border-radius:2px;background:rgba(255,255,255,.9)}
.tl-lbl{position:relative;height:14px;margin-top:3px}
.tl-lbl span{position:absolute;top:0;font-size:10px;color:var(--slate);white-space:nowrap}
.brows{margin-top:8px}
.brow{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.brow .bt{font-size:13.5px;font-weight:600;flex:0 0 auto;letter-spacing:-.01em}
.brow .tilde{color:var(--slate);font-size:11px;flex:0 0 auto}
.step{width:30px;height:30px;border-radius:8px;background:var(--field);color:var(--ink);font-size:15px;
  line-height:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.del{margin-left:auto;color:var(--slate);font-weight:400}
.tlwarn{font-size:12px;color:var(--maybe);margin:6px 0 0}
.tl-acts{display:flex;gap:16px;align-items:center;margin-top:2px}
.addband.sub{color:var(--slate)}
.tlhelp{font-size:11.5px;color:var(--slate);margin:4px 0 0;line-height:1.5}

/* ---- 取り消しのきかない操作 ---- */
:root{--danger:#C0392F}
.btn.ghost.danger-link{color:var(--danger);font-weight:700;margin-top:2px}
.danger{background:var(--memo-bg);color:var(--memo-ink);border-radius:11px;padding:12px 13px;
  margin-top:12px;font-size:12.5px;line-height:1.65}
.danger p{margin:0}
.danger strong{color:var(--danger)}
.btn.del2{background:var(--danger);color:#fff}
img.avatar{object-fit:cover;background:var(--field);display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><i></i><i></i><i></i></div>
      <h1>かさなり</h1>
      <span>SCHEDULE OVERLAP</span>
    </div>
    <p class="tagline">「この時間の中でなら空いている」を集めて、重なりを探す</p>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   かさなり — 時間帯で決める日程調整
   保存は Firebase（匿名認証 + Firestore）
   パス: artifacts/kasanari/public/data/events/{CODE}
         └ responses/{uid}
   ============================================================ */
const APP_ID = 'kasanari';
// かさなり専用の Firebase プロジェクト。
// かるた（karuta-game-c8fc8）とは別なので、ルールも無料枠も独立している。
// Storage は使わないので storageBucket は持たない。
const firebaseConfig = {
  apiKey: "AIzaSyDYpJB6-_caUp4A2ysRwMmOmEzxpbNWj1I",
  authDomain: "kasanari-9f071.firebaseapp.com",
  projectId: "kasanari-9f071"
};

const SLOT = 5;
const DOW = ['日','月','火','水','木','金','土'];
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

let S = { view:'home', ev:null, tab:'answer', draft:null, mine:[], calMonth:null, confirmDel:false };
let FB = { state:'connecting', msg:'', uid:null, user:null, isAnon:true, db:null, base:null };
let unsubEv = null, unsubResp = null;
let lastUid = null;

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const dlabel = s => { const d=parseD(s); return `${d.getMonth()+1}/${d.getDate()}<em>(${DOW[d.getDay()]})</em>`; };
const dshort = s => { const d=parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }

function lget(k,d){ try{ const v=localStorage.getItem('kasanari:'+k); return v==null? d : JSON.parse(v); }catch(e){ return d; } }
function lset(k,v){ try{ localStorage.setItem('kasanari:'+k, JSON.stringify(v)); }catch(e){} }

function durLabel(v){
  const h=Math.floor(v/60), m=v%60;
  return (h?`${h}時間`:'') + (m?`${m}分`:'') || '0分';
}
function newCode(){ let s=''; for(let i=0;i<6;i++) s+=ALPHA[Math.floor(Math.random()*ALPHA.length)]; return s; }
function timeOptions(start,end,sel,step){
  const k = step || SLOT;
  let h='';
  for(let t=start;t<=end;t+=k) h+=`<option value="${t}"${t===sel?' selected':''}>${fmt(t)}</option>`;
  if(sel!=null && (sel-start)%k!==0) h = `<option value="${sel}" selected>${fmt(sel)}</option>` + h;
  return h;
}
/* 所要時間は 1時間までは5分刻み、そこから先はだんだん粗く。
   288項目のスクロールを出さないための刻み。 */
function durationChoices(){
  const out=[];
  for(let v=5; v<=60; v+=5) out.push(v);
  for(let v=75; v<=240; v+=15) out.push(v);
  for(let v=270; v<=480; v+=30) out.push(v);
  return out;
}
function shareURL(code){
  return location.origin + location.pathname + '#' + code;
}

/* ---------- availability logic ---------- */
function slotList(ev){ const o=[]; for(let t=ev.dayStart;t+SLOT<=ev.dayEnd;t+=SLOT) o.push(t); return o; }
function statusAt(resp,date,t){
  const d = resp.days && resp.days[date];
  if(!d || d.mark==='x' || !d.mark) return 'x';
  const ok = (d.bands||[]).some(b=> t>=b[0] && t+SLOT<=b[1]);
  return ok ? d.mark : 'x';
}
function density(ev,date){
  return slotList(ev).map(t=>{
    let o=0,m=0;
    for(const r of ev.responses){ const s=statusAt(r,date,t); if(s==='o')o++; else if(s==='t')m++; }
    return {t,o,m};
  });
}
function windowsFor(ev,date){
  const ts = slotList(ev), need = Math.max(1,Math.ceil(ev.duration/SLOT)), out=[];
  for(let i=0;i+need<=ts.length;i++){
    const per = ev.responses.map(r=>{
      let s='o';
      for(let k=0;k<need;k++){ const st=statusAt(r,date,ts[i+k]); if(st==='x'){s='x';break;} if(st==='t') s='t'; }
      return s;
    });
    out.push({start:ts[i], end:ts[i]+need*SLOT, per, sig:per.join(''),
      yes:per.filter(x=>x==='o').length, maybe:per.filter(x=>x==='t').length});
  }
  const merged=[];
  for(const w of out){
    const p = merged[merged.length-1];
    if(p && p.sig===w.sig && w.start===p.lastStart+SLOT){ p.lastStart=w.start; p.to=w.end; }
    else merged.push({date, from:w.start, to:w.end, lastStart:w.start, sig:w.sig, per:w.per, yes:w.yes, maybe:w.maybe});
  }
  return merged;
}
function allWindows(ev){
  let a=[]; for(const d of ev.dates) a=a.concat(windowsFor(ev,d));
  a.sort((x,y)=> (y.yes-x.yes) || (y.maybe-x.maybe) || (x.date<y.date?-1:x.date>y.date?1:0) || (x.from-y.from));
  return a;
}

/* ---------- Firebase / ログイン ---------- */
const GLOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.7c-.3 2.1-1.6 5.3-4.7 7.4l7.7 5.9c4.6-4.2 7.4-10.4 7.4-17z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-5.9c-2.1 1.4-4.8 2.4-8.2 2.4-6.3 0-11.6-4-13.5-9.6l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>';

/* onAuthStateChanged は非同期なので、ログイン直後に FB を見ると古い。
   currentUser から FB を引き写す口をひとつにして、都度ここを通す。 */
function syncUser(){
  if(typeof firebase==='undefined' || !firebase.apps.length) return false;
  const u = firebase.auth().currentUser;
  if(!u) return false;
  if(lastUid && lastUid!==u.uid) A = null;   // 別人になったら書きかけは持ち越さない
  FB.user=u; FB.uid=u.uid; FB.isAnon=!!u.isAnonymous; FB.state='ready'; lastUid=u.uid;
  return true;
}

/* 匿名ユーザーに linkWithPopup で連携した場合、Firebase はユーザー本体の
   displayName / photoURL を空のままにする。中身は providerData の側にだけ入る。
   本体 → providerData → メールアドレス、の順に拾う。 */
function profileOf(u){
  if(!u) return {name:'', photo:null};
  let name = u.displayName || '', photo = u.photoURL || null;
  for(const p of (u.providerData || [])){
    if(!p) continue;
    if(!name)  name  = p.displayName || '';
    if(!photo) photo = p.photoURL || null;
  }
  return { name: name || u.email || '', photo };
}

/* 拾えたプロフィールをアカウント本体にも書き戻しておく。
   次に開いたときは本体から素直に取れるようになる。 */
async function backfillProfile(){
  const u = firebase.auth().currentUser;
  if(!u || u.isAnonymous || !u.updateProfile) return;
  const pr = profileOf(u);
  const patch = {};
  if(!u.displayName && pr.name && pr.name!==u.email) patch.displayName = pr.name;
  if(!u.photoURL && pr.photo) patch.photoURL = pr.photo;
  if(!Object.keys(patch).length) return;
  try{ await u.updateProfile(patch); }catch(e){}
}

function googleProvider(){
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  return p;
}
const isDupCred = e => e && (e.code==='auth/credential-already-in-use'
  || e.code==='auth/email-already-in-use' || e.code==='auth/account-exists-with-different-credential');

function connect(){
  return new Promise(resolve=>{
    let settled=false;
    const done=()=>{ if(!settled){ settled=true; resolve(); } };
    if(typeof firebase === 'undefined'){ FB.state='error'; FB.msg=fbMessage({code:'no-sdk'}); render(); return done(); }
    let auth;
    try{
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      FB.db = firebase.firestore();
      FB.base = FB.db.collection('artifacts').doc(APP_ID).collection('public').doc('data');
    }catch(e){ FB.state='error'; FB.msg=fbMessage(e); render(); return done(); }

    // ポップアップが使えずリダイレクトで戻ってきた場合
    if(auth.getRedirectResult){
      auth.getRedirectResult()
        .then(res=>{ if(res && res.user) toast('ログインしました'); })
        .catch(e=>{ if(isDupCred(e)) takeOver(e.credential); else if(e && e.code) toast(fbMessage(e)); });
    }

    auth.onAuthStateChanged(user=>{
      if(!user){
        auth.signInAnonymously().catch(e=>{ FB.state='error'; FB.msg=fbMessage(e); render(); done(); });
        return;
      }
      syncUser();
      render(); done();
    }, err=>{ FB.state='error'; FB.msg=fbMessage(err); render(); done(); });
  });
}

async function signIn(){
  const auth = firebase.auth(), u = auth.currentUser;
  try{
    // 匿名のまま回答した人は「連携」で入る。uid が変わらないので回答はそのまま残る。
    if(u && u.isAnonymous) await u.linkWithPopup(googleProvider());
    else await auth.signInWithPopup(googleProvider());
    await backfillProfile();
    syncUser();
    await markProvider('google');
    adoptAccountName();
    toast('ログインしました'); render();
  }catch(e){
    const c = e && e.code;
    if(isDupCred(e)) return takeOver(e.credential);
    if(c==='auth/popup-closed-by-user' || c==='auth/cancelled-popup-request') return;
    if(c==='auth/popup-blocked' || c==='auth/operation-not-supported-in-environment'){
      try{
        if(u && u.isAnonymous) await u.linkWithRedirect(googleProvider());
        else await auth.signInWithRedirect(googleProvider());
      }catch(e2){ toast(fbMessage(e2)); }
      return;
    }
    toast(fbMessage(e));
  }
}

/* そのGoogleアカウントが既に別のuidで使われていた場合。
   匿名側の回答をいったん引き上げてから入り直し、新しいuidで書き直す。
   「自分の文書しか書けない」厳しめのルールでも通る順序にしてある。 */
async function takeOver(cred){
  if(!cred) return toast('ログインできませんでした');
  const oldUid = FB.uid;
  const codes = [];
  if(S.ev && S.ev.code) codes.push(S.ev.code);
  for(const m of S.mine) if(codes.indexOf(m.code)<0) codes.push(m.code);
  const carry = [];
  for(const code of codes.slice(0,20)){
    try{
      const ref = evRef(code).collection('responses').doc(oldUid);
      const snap = await ref.get();
      if(snap.exists){ carry.push({code, data:snap.data()}); await ref.delete(); }
    }catch(e){}
  }
  let res;
  try{
    res = await firebase.auth().signInWithCredential(cred);
  }catch(e){
    // 入り直せなかったので、引き上げた回答を元に戻す
    for(const c of carry){ try{ await evRef(c.code).collection('responses').doc(oldUid).set(c.data); }catch(e2){} }
    return toast(fbMessage(e));
  }
  await backfillProfile();
  syncUser();
  for(const c of carry){
    try{ await evRef(c.code).collection('responses').doc(res.user.uid).set(Object.assign({}, c.data, {provider:'google'})); }catch(e){}
  }
  let stuck = 0;
  for(const code of codes){
    try{
      const snap = await evRef(code).get();
      if(snap.exists && snap.data().ownerUid===oldUid) await evRef(code).update({ownerUid:res.user.uid});
    }catch(e){ stuck++; }
  }
  toast(stuck? 'ログインしました（一部の予定の管理は元の端末に残ります）' : 'ログインしました');
  render();
}

/* 連携でログインすると uid が変わらないぶん書きかけも残るので、
   名前欄だけはアカウント名に寄せる。自分で打ち直した名前は触らない。 */
function adoptAccountName(){
  // onAuthStateChanged は非同期なので FB.* はまだ古いことがある。currentUser を直接見る。
  const u = firebase.auth().currentUser;
  if(!A || !u || u.isAnonymous) return;
  const gname = profileOf(u).name;
  if(!gname || gname===u.email) return;   // メールしか無いなら勝手に入れない
  const posted = (S.ev && S.ev.responses) ? S.ev.responses.find(r=>r.id===u.uid) : null;
  if(posted) return;
  const auto = lget('name','');
  if(A.name && A.name!==auto) return;
  A.name = gname;
}

/* 送信済みの回答にも、いまのログイン状態を反映しておく（✓表示を実態に合わせる） */
async function markProvider(kind){
  const u = firebase.auth().currentUser;
  const uid = (u && u.uid) || FB.uid;
  const codes = [];
  if(S.ev && S.ev.code) codes.push(S.ev.code);
  for(const m of S.mine) if(codes.indexOf(m.code)<0) codes.push(m.code);
  for(const code of codes.slice(0,20)){
    try{
      const ref = evRef(code).collection('responses').doc(uid);
      const snap = await ref.get();
      if(snap.exists && snap.data().provider!==kind) await ref.update({provider:kind});
    }catch(e){}
  }
}

async function signOut(){
  try{ await firebase.auth().signOut(); A=null; toast('ログアウトしました'); }
  catch(e){ toast(fbMessage(e)); }
}

function fbMessage(e){
  const c = e && e.code;
  if(c==='no-sdk') return 'ネットワークにつながらず、保存の準備ができませんでした。通信状態を確かめて再読み込みしてください。';
  if(c==='permission-denied') return 'Firestore のルールで許可されていません（artifacts/'+APP_ID+'/public/data 以下への読み書き・削除が必要です）。';
  if(c==='auth/operation-not-allowed') return 'Firebase 側でこのログイン方法が有効になっていません。';
  if(c==='auth/unauthorized-domain') return 'このドメインが Firebase の「承認済みドメイン」に入っていません（oceanhermit.github.io を追加してください）。';
  if(c==='unavailable' || c==='auth/network-request-failed') return '通信が届きませんでした。電波やネットワークを確かめて、もう一度お試しください。';
  return '保存の準備ができませんでした（' + (c || 'unknown') + '）。';
}
const evRef = code => FB.base.collection('events').doc(code);

/* ---------- アカウント表示 ---------- */
function acctHTML(){
  if(FB.state!=='ready') return '';
  if(FB.isAnon){
    return `<div class="acct">
      <p class="sub">回答するだけならログインは要りません。予定をつくるとき、また別の端末から自分の回答を直したいときにログインしてください。</p>
      <button class="gbtn" id="gin">${GLOGO}<span>Google でログイン</span></button>
    </div>`;
  }
  const pr = profileOf(FB.user);
  const name = pr.name || 'ログイン中';
  const ini = esc(name.trim().charAt(0));
  const photo = pr.photo;
  // Google のプロフィール画像。referrerpolicy を付けないと 403 で落ちることがある。
  // 取れなかったときは頭文字にさし替える（bindAcct の onerror）。
  const av = photo
    ? `<img class="avatar" id="avimg" src="${esc(photo)}" alt="" referrerpolicy="no-referrer" data-ini="${ini}">`
    : `<span class="avatar">${ini}</span>`;
  return `<div class="acct">
    <div class="me">${av}
      <div style="min-width:0"><div class="nm">${esc(name)}</div><div class="sub">Google でログイン中</div></div></div>
    <button class="lnk" id="gout">ログアウト</button>
  </div>`;
}
function bindAcct(){
  const i=$('#gin'); if(i) i.onclick = signIn;
  const o=$('#gout'); if(o) o.onclick = signOut;
  const im=$('#avimg');
  if(im) im.onerror = ()=>{
    const sp=document.createElement('span');
    sp.className='avatar'; sp.textContent=im.dataset.ini||'';
    im.replaceWith(sp);
  };
}

function detach(){
  if(unsubEv){ unsubEv(); unsubEv=null; }
  if(unsubResp){ unsubResp(); unsubResp=null; }
}
function attach(code){
  detach();
  S.ev = S.ev && S.ev.code===code ? S.ev : {code, responses:[], dates:[], dayStart:540, dayEnd:1320, duration:60, title:'', note:'', closed:false, loading:true};
  unsubEv = evRef(code).onSnapshot(snap=>{
    if(!snap.exists){
      const wasOpen = S.ev && S.ev.code===code && !S.ev.loading;
      detach(); S.view='home'; S.ev=null; A=null; S.confirmDel=false;
      S.mine = S.mine.filter(m=>m.code!==code); lset('mine', S.mine);
      if(location.hash) location.hash='';
      render();
      return toast(wasOpen ? 'この予定は消されました' : 'その予定は見つかりません');
    }
    const d = snap.data();
    S.ev = Object.assign({}, S.ev, d, {code, loading:false, responses:S.ev.responses||[]});
    render();
  }, err=>{ FB.state='error'; FB.msg=fbMessage(err); render(); });
  unsubResp = evRef(code).collection('responses').onSnapshot(qs=>{
    const rs = qs.docs.map(doc=>{
      const d = doc.data();
      let days = {};
      try{ days = JSON.parse(d.daysJson||'{}'); }catch(e){}
      return { id:doc.id, name:d.name||'（名前なし）', updatedAt:d.updatedAt||0, provider:d.provider||'anon', days };
    }).sort((a,b)=> (a.updatedAt-b.updatedAt) || (a.id<b.id?-1:1));
    if(S.ev) S.ev.responses = rs;
    render();
  }, err=>{ FB.state='error'; FB.msg=fbMessage(err); render(); });
}

/* ---------- render ---------- */
function render(){

  else if(v==='create') renderCreate();
  else if(v==='event') renderEvent();

}

}

function calDays(cm, picked){
  const lead = new Date(cm.getFullYear(), cm.getMonth(), 1).getDay();
  const last = new Date(cm.getFullYear(), cm.getMonth()+1, 0).getDate();
  const today = iso(new Date());
  let h='';
  for(let i=0;i<lead;i++) h+=`<div class="day out"></div>`;
  for(let n=1;n<=last;n++){
    const dt = new Date(cm.getFullYear(), cm.getMonth(), n), k = iso(dt);
    const on = picked.includes(k);
    const cls = ['day', dt.getDay()===0?'sun':dt.getDay()===6?'sat':'', k<today?'past':'', on?'on':''].filter(Boolean).join(' ');
    h+=`<button class="${cls}" data-d="${k}" aria-pressed="${on}">${n}</button>`;
  }
  return h;
}
async function createEvent(){
  const d = S.draft;
  if(!d.title.trim()) return toast('タイトルを入れてください');
  if(!d.dates.length) return toast('候補日を選んでください');
  if(FB.state!=='ready') return toast('保存サーバーにつながっていません');
  if(FB.isAnon) return toast('予定をつくるにはログインが必要です');
  const btn=$('#mk'); btn.disabled=true; btn.textContent='つくっています…';
  try{
    let code='';
    for(let tries=0;tries<6;tries++){
      code = newCode();
      const s = await evRef(code).get();
      if(!s.exists) break;
      code='';
    }
    if(!code) throw {code:'code-exhausted'};
    await evRef(code).set({
      code, title:d.title.trim(), note:d.note.trim(), dates:d.dates.slice().sort(),
      dayStart:d.dayStart, dayEnd:d.dayEnd, duration:d.duration, slot:SLOT,
      closed:false, createdAt:Date.now(), ownerUid:FB.uid
    });
    S.mine = [{code, title:d.title.trim()}].concat(S.mine.filter(m=>m.code!==code)).slice(0,30);
    lset('mine', S.mine);
    openEvent(code);
  }catch(e){
    btn.disabled=false; btn.textContent='この内容でつくる';
    toast(e && e.code==='code-exhausted' ? 'コードが作れませんでした。もう一度お試しください' : fbMessage(e));
  }
}

function openEvent(code){
  if(!/^[A-Z0-9]{6}$/.test(code||'')) return toast('6文字のコードを入れてください');
  if(FB.state!=='ready') return toast('保存サーバーにつながっていません');
  A = null; S.confirmDel = false;
  S.view='event'; S.tab='answer';
  if(location.hash.slice(1)!==code) location.hash = code;
  attach(code);
  render();
}

/* --- event --- */
function renderEvent(){
  const ev = S.ev;
  if(!ev || ev.loading){ $('#app').innerHTML = statusNotice() + acctHTML() + `<div class="card"><div class="empty">読み込んでいます…</div></div>`; return; }
  const owner = ev.ownerUid ? ev.ownerUid===FB.uid : S.mine.some(m=>m.code===ev.code);
  if(ev.closed && S.tab==='answer') S.tab='result';
  const head = `
  <div class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
      <div>
        <h2 style="margin:0 0 2px">${esc(ev.title)}</h2>
        <div class="mono" style="font-size:12px;color:var(--slate)">
          ${ev.dates.length}日 ／ ${fmt(ev.dayStart)}–${fmt(ev.dayEnd)} ／ 所要 ${durLabel(ev.duration)}
        </div>
      </div>
      ${ev.closed?'<span class="closedtag">しめきり済み</span>':''}
    </div>
    ${ev.note? `<p class="hint" style="margin-top:8px">${esc(ev.note)}</p>`:''}
    <div class="codebox" style="margin-top:14px">
      <div style="flex:1;min-width:0"><small>あいことば</small><div class="cd">${esc(ev.code)}</div></div>
      <button class="btn alt" id="cp" style="width:auto;padding:10px 14px;font-size:12.5px;white-space:nowrap">リンクをコピー</button>
    </div>
    <p class="hint">このリンクを渡すと、相手はそのまま回答できます。</p>
  </div>`;

  const tabs = `<div class="tabs">
    <button data-tab="answer" class="${S.tab==='answer'?'on':''}">回答する</button>
    <button data-tab="result" class="${S.tab==='result'?'on':''}">集計を見る</button>
  </div>`;

  $('#app').innerHTML = statusNotice() + acctHTML() + head + tabs + (S.tab==='answer'? answerHTML(ev) : resultHTML(ev)) +
    (owner? `<div class="card"><p class="eyebrow">管理</p>
      <button class="btn alt" id="tog">${ev.closed?'回答を再開する':'回答をしめきる'}</button>
      ${S.confirmDel? `
        <div class="danger">
          <p>この予定と、集まった<strong> ${ev.responses.length} 件の回答</strong>をすべて消します。元にはもどせません。</p>
          <div class="row" style="margin-top:11px">
            <button class="btn del2" id="delgo">消す</button>
            <button class="btn alt" id="delno">やめる</button>
          </div>
        </div>`
      : `<button class="btn ghost danger-link" id="del">この予定を消す</button>`}
      </div>`:'') +
    `<button class="btn ghost" id="home">ホームにもどる</button>`;

  $('#cp').onclick = async ()=>{
    const url = shareURL(ev.code);
    try{ await navigator.clipboard.writeText(url); toast('リンクをコピーしました'); }
    catch(e){ toast(url); }
  };
  $('#home').onclick = ()=>{ detach(); S.view='home'; S.ev=null; A=null; S.confirmDel=false; location.hash=''; render(); };
  document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=>{ S.tab=b.dataset.tab; S.confirmDel=false; render(); });
  const tg = $('#tog');
  if(tg) tg.onclick = async ()=>{
    tg.disabled = true;
    try{
      await evRef(ev.code).update({closed: !ev.closed});
      toast(!ev.closed?'しめきりました':'回答を再開しました');
    }catch(e){ toast(fbMessage(e)); tg.disabled=false; }
  };
  const dl=$('#del');   if(dl) dl.onclick = ()=>{ S.confirmDel=true; render(); };
  const dn=$('#delno'); if(dn) dn.onclick = ()=>{ S.confirmDel=false; render(); };
  const dg=$('#delgo'); if(dg) dg.onclick = deleteEvent;
  if(S.tab==='answer') bindAnswer();
}

/* 予定を消す。Firestore は配下を自動で消してくれないので、
   先に回答を消してから本体を消す。この順なら
   「回答は本人か主催者だけ消せる」ルールでも通る（本体が残っている間に判定できる）。 */
async function deleteEvent(){
  const ev = S.ev; if(!ev) return;
  const btn=$('#delgo'); if(btn){ btn.disabled=true; btn.textContent='消しています…'; }
  const code = ev.code;
  try{
    const qs = await evRef(code).collection('responses').get();
    for(const doc of qs.docs){ await doc.ref.delete(); }
    await evRef(code).delete();
    detach();
    S.mine = S.mine.filter(m=>m.code!==code); lset('mine', S.mine);
    S.ev=null; A=null; S.confirmDel=false; S.view='home';
    if(location.hash) location.hash='';
    render(); toast('予定を消しました');
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='消す'; }
    toast(fbMessage(e));
  }
}

/* --- answer form --- */
let A = null;
function answerHTML(ev){
  if(ev.closed) return `<div class="card"><div class="empty">この予定は回答をしめきりました。<br>集計をご覧ください。</div></div>`;
  const mine = ev.responses.find(r=>r.id===FB.uid);
  if(!A || A.code!==ev.code){
    // 名前の既定値は「前に出した自分の回答 → ログイン中のアカウント名 → この端末で覚えた名前」の順。
    // ログインしている人にまで、以前この端末で使った別人の名前を出さないようにする。
    const gname = FB.isAnon ? '' : (profileOf(FB.user).name || '');
    A = { code:ev.code, name: mine? mine.name : (gname || lget('name','')), days:{} };
    for(const d of ev.dates){
      const src = mine && mine.days[d];
      A.days[d] = src ? {mark:src.mark, bands:(src.bands||[]).map(b=>b.slice()), memo:src.memo||''}
                      : {mark:null, bands:[[ev.dayStart, ev.dayEnd]], memo:''};
      if(A.days[d].mark && A.days[d].mark!=='x' && !A.days[d].bands.length) A.days[d].bands=[[ev.dayStart, ev.dayEnd]];
    }
  }
  const blocks = ev.dates.map(d=>{
    const a = A.days[d];
    const bands = a.mark && a.mark!=='x' ? tlBlock(ev,d,a) : '';
    const memo = a.mark==='t' ? `<textarea data-mm="${d}" placeholder="どんな予定次第か（例：前の会議が延びたら遅れます）">${esc(a.memo)}</textarea>`:'';
    return `<div class="dayblock">
      <div class="dhead">
        <div class="dt">${dlabel(d)}</div>
        <div class="marks">
          ${['o','t','x'].map(m=>`<button class="mk ${a.mark===m?'on':''}" data-m="${m}" data-mk="${d}" aria-pressed="${a.mark===m}">${m==='o'?'○':m==='t'?'△':'✕'}</button>`).join('')}
        </div>
      </div>${bands}${memo}</div>`;
  }).join('');

  return `<div class="card">
    <p class="eyebrow">${mine?'回答を直す':'回答する'}</p>
    <label class="f">お名前</label>
    <input type="text" id="nm2" value="${esc(A.name)}" placeholder="山田 太郎">
    <p class="hint" style="margin-bottom:2px">○＝参加できる／△＝予定次第（メモを残せます）／✕＝むり。</p>
    <p class="hint" style="margin-bottom:6px">○と△は、バーをドラッグして空いている時間帯を選びます。帯は左右の端でのばし、まん中をつかむと動かせます。空いているところをタップすると ${durLabel(ev.duration)} ぶん足せます。−/＋は5分ずつ。</p>
    ${blocks}
    <button class="btn" id="send" style="margin-top:14px">${mine?'回答を更新する':'回答を送る'}</button>
  </div>`;
}
/* ---- 時間帯えらび（時間軸をドラッグ／±5分で微調整） ---- */
function bandPct(ev,m){ return (m-ev.dayStart)/(ev.dayEnd-ev.dayStart)*100; }

function tlInner(ev,a){
  let ticks='';
  for(let t=Math.ceil(ev.dayStart/60)*60; t<ev.dayEnd; t+=60){
    if(t<=ev.dayStart) continue;
    ticks += `<span class="tk" style="left:${bandPct(ev,t).toFixed(3)}%"></span>`;
  }
  const cls = a.mark==='t' ? ' t' : '';
  const bands = a.bands.map((b,i)=>{
    const l=bandPct(ev,b[0]), w=bandPct(ev,b[1])-l;
    return `<div class="tl-band${cls}" data-i="${i}" style="left:${l.toFixed(3)}%;width:${w.toFixed(3)}%">
      ${w>=27?`<span class="bl">${fmt(b[0])}–${fmt(b[1])}</span>`:''}
      ${w>=12?`<span class="h l"></span><span class="h r"></span>`:''}
    </div>`;
  }).join('');
  return ticks + bands;
}
function tlLabels(ev){
  const span=ev.dayEnd-ev.dayStart, step=Math.max(1, Math.ceil(Math.ceil(span/60)/5))*60;
  const ts=[]; for(let t=ev.dayStart; t<ev.dayEnd; t+=step) ts.push(t);
  if(ev.dayEnd-ts[ts.length-1] < step*0.6) ts.pop();
  ts.push(ev.dayEnd);
  return ts.map(t=>{
    const p=bandPct(ev,t);
    const tf = p<=0.5?'translateX(0)' : p>=99.5?'translateX(-100%)' : 'translateX(-50%)';
    return `<span style="left:${p.toFixed(3)}%;transform:${tf}">${fmt(t)}</span>`;
  }).join('');
}
function rowsHTML(ev,a){
  if(!a.bands.length) return `<p class="tlwarn">時間帯が選ばれていません。バーをドラッグするか「終日にする」を押してください。</p>`;
  return a.bands.map((b,i)=>`<div class="brow">
    <button class="step" data-st="${i}:0:-1" aria-label="開始を5分早める">−</button>
    <span class="bt mono">${fmt(b[0])}</span>
    <button class="step" data-st="${i}:0:1" aria-label="開始を5分遅らせる">＋</button>
    <span class="tilde">〜</span>
    <button class="step" data-st="${i}:1:-1" aria-label="終了を5分早める">−</button>
    <span class="bt mono">${fmt(b[1])}</span>
    <button class="step" data-st="${i}:1:1" aria-label="終了を5分遅らせる">＋</button>
    <button class="step del" data-bd="${i}" aria-label="この時間帯を消す">×</button>
  </div>`).join('');
}
function tlBlock(ev,d,a){
  return `<div class="tl">
    <div class="tl-track" data-d="${d}" role="group" aria-label="空いている時間帯">${tlInner(ev,a)}</div>
    <div class="tl-lbl mono">${tlLabels(ev)}</div>
    <div class="brows" data-d="${d}">${rowsHTML(ev,a)}</div>
    <div class="tl-acts">
      <button class="addband" data-ba="${d}">＋ 時間帯を足す</button>
      <button class="addband sub" data-ball="${d}">終日にする</button>
    </div>
  </div>`;
}
function normBands(list, ev){
  const cl = list.map(b=>[Math.max(ev.dayStart, Math.min(b[0],b[1])), Math.min(ev.dayEnd, Math.max(b[0],b[1]))])
                 .filter(b=> b[1]-b[0] >= SLOT)
                 .sort((x,y)=> x[0]-y[0]);
  const out=[];
  for(const b of cl){
    const p=out[out.length-1];
    if(p && b[0]<=p[1]) p[1]=Math.max(p[1], b[1]);
    else out.push(b.slice());
  }
  return out;
}
function firstGap(a, ev, want){
  const bs = normBands(a.bands, ev);
  let at = ev.dayStart;
  for(const b of bs){
    if(b[0]-at >= SLOT) return [at, Math.min(b[0], at+want)];
    at = Math.max(at, b[1]);
  }
  if(ev.dayEnd-at >= SLOT) return [at, Math.min(ev.dayEnd, at+want)];
  return null;
}
function paintDay(d){
  const ev=S.ev, a=A.days[d];
  const track=document.querySelector('.tl-track[data-d="'+d+'"]');
  const rows=document.querySelector('.brows[data-d="'+d+'"]');
  if(track) track.innerHTML = tlInner(ev,a);
  if(rows) rows.innerHTML = rowsHTML(ev,a);
}
function bindTimeline(track){
  const ev=S.ev, d=track.dataset.d;
  const DRAGSTEP = 15;              // 指で扱うぶんは15分刻み。5分は下の ± で。
  const span = ev.dayEnd - ev.dayStart;
  const toMin = x=>{
    const r=track.getBoundingClientRect();
    const p=Math.min(1, Math.max(0, (x-r.left)/r.width));
    return ev.dayStart + p*span;
  };
  const snap = m=>{
    const v=Math.round((m-ev.dayStart)/DRAGSTEP)*DRAGSTEP + ev.dayStart;
    return Math.min(ev.dayEnd, Math.max(ev.dayStart, v));
  };
  let drag=null;

  track.addEventListener('pointerdown', e=>{
    if(e.button && e.button!==0) return;
    const a=A.days[d];
    const handle=e.target.closest('.h'), bandEl=e.target.closest('.tl-band');
    if(handle && bandEl){
      const i=+bandEl.dataset.i;
      drag={kind:'edge', i, edge:handle.classList.contains('l')?0:1, orig:a.bands[i].slice()};
    }else if(bandEl){
      const i=+bandEl.dataset.i;
      drag={kind:'move', i, orig:a.bands[i].slice(), from:toMin(e.clientX)};
    }else{
      const at=snap(toMin(e.clientX));
      a.bands.push([at, Math.min(ev.dayEnd, at+SLOT)]);
      drag={kind:'new', i:a.bands.length-1, anchor:at};
      paintDay(d);
    }
    drag.moved=false;
    try{ track.setPointerCapture(e.pointerId); }catch(err){}
  });

  track.addEventListener('pointermove', e=>{
    if(!drag) return;
    const a=A.days[d], m=toMin(e.clientX);
    if(drag.kind==='new'){
      const v=snap(m); let lo=Math.min(drag.anchor,v), hi=Math.max(drag.anchor,v);
      if(hi-lo < SLOT) hi=Math.min(ev.dayEnd, lo+SLOT);
      if(a.bands[drag.i][0]!==lo || a.bands[drag.i][1]!==hi) drag.moved=true;
      a.bands[drag.i]=[lo,hi];
    }else if(drag.kind==='edge'){
      const b=a.bands[drag.i]; if(!b) return;
      const v=snap(m);
      if(drag.edge===0) b[0]=Math.max(ev.dayStart, Math.min(v, b[1]-SLOT));
      else b[1]=Math.min(ev.dayEnd, Math.max(v, b[0]+SLOT));
      drag.moved=true;
    }else{
      const b=a.bands[drag.i]; if(!b) return;
      const len=drag.orig[1]-drag.orig[0];
      let st=snap(drag.orig[0] + (m-drag.from));
      st=Math.max(ev.dayStart, Math.min(ev.dayEnd-len, st));
      a.bands[drag.i]=[st, st+len];
      drag.moved=true;
    }
    paintDay(d);
  });

  const finish = ()=>{
    if(!drag) return;
    const a=A.days[d];
    // 動かさずに置いただけなら、所要時間ぶんの帯を置く
    if(drag.kind==='new' && !drag.moved){
      const want=Math.max(SLOT, ev.duration);
      let st=drag.anchor, en=st+want;
      if(en>ev.dayEnd){ en=ev.dayEnd; st=Math.max(ev.dayStart, en-want); }
      a.bands[drag.i]=[st,en];
    }
    drag=null;
    a.bands=normBands(a.bands, ev);
    render();
  };
  track.addEventListener('pointerup', finish);
  track.addEventListener('lostpointercapture', finish);
  track.addEventListener('pointercancel', ()=>{
    if(!drag) return;
    const a=A.days[d];
    if(drag.kind==='new') a.bands.splice(drag.i,1);
    else if(a.bands[drag.i]) a.bands[drag.i]=drag.orig;
    drag=null; paintDay(d);
  });
}
function bindRows(rows){
  const ev=S.ev, d=rows.dataset.d;
  rows.addEventListener('click', e=>{
    const a=A.days[d];
    const st=e.target.closest('[data-st]');
    if(st){
      const [i,edge,dir]=st.dataset.st.split(':').map(Number);
      const b=a.bands[i]; if(!b) return;
      let v=b[edge]+dir*SLOT;
      if(edge===0) v=Math.max(ev.dayStart, Math.min(v, b[1]-SLOT));
      else v=Math.min(ev.dayEnd, Math.max(v, b[0]+SLOT));
      b[edge]=v; a.bands=normBands(a.bands, ev); render(); return;
    }
    const del=e.target.closest('[data-bd]');
    if(del){ a.bands.splice(+del.dataset.bd,1); render(); }
  });
}

function bindAnswer(){
  const ev=S.ev; if(ev.closed) return;
  const n=$('#nm2'); if(n) n.oninput = e=> A.name=e.target.value;
  document.querySelectorAll('.tl-track').forEach(bindTimeline);
  document.querySelectorAll('.brows').forEach(bindRows);
  document.querySelectorAll('[data-mk]').forEach(b=> b.onclick=()=>{
    const d=b.dataset.mk, a=A.days[d];
    a.mark = a.mark===b.dataset.m ? null : b.dataset.m;
    if(a.mark && a.mark!=='x' && !a.bands.length) a.bands=[[ev.dayStart,ev.dayEnd]];
    render();
  });
  document.querySelectorAll('[data-ba]').forEach(b=> b.onclick=()=>{
    const a=A.days[b.dataset.ba];
    const g=firstGap(a, ev, Math.max(SLOT, ev.duration));
    if(!g) return toast('空いているところがありません');
    a.bands.push(g); a.bands=normBands(a.bands, ev); render();
  });
  document.querySelectorAll('[data-ball]').forEach(b=> b.onclick=()=>{
    A.days[b.dataset.ball].bands=[[ev.dayStart, ev.dayEnd]]; render();
  });
  document.querySelectorAll('[data-mm]').forEach(t=> t.oninput=e=> A.days[t.dataset.mm].memo=e.target.value);
  $('#send').onclick = submit;
}
async function submit(){
  const ev=S.ev;
  if(!A.name.trim()) return toast('お名前を入れてください');
  if(!ev.dates.some(d=>A.days[d].mark)) return toast('どこか1日は答えてください');
  for(const d of ev.dates){
    const a=A.days[d];
    if(a.mark && a.mark!=='x' && !a.bands.length) return toast(dshort(d)+' の時間帯が選ばれていません');
  }
  if(ev.closed){ render(); return toast('しめきられました'); }
  const btn=$('#send'); btn.disabled=true; btn.textContent='送っています…';
  const days={};
  for(const d of ev.dates){ const a=A.days[d];
    days[d] = { mark:a.mark||'x', bands:(a.mark&&a.mark!=='x')? a.bands.map(b=>b.slice()):[], memo:(a.memo||'').trim() }; }
  try{
    await evRef(ev.code).collection('responses').doc(FB.uid).set({
      name:A.name.trim(), updatedAt:Date.now(), daysJson:JSON.stringify(days),
      provider: FB.isAnon ? 'anon' : 'google'
    });
    lset('name', A.name.trim());
    A=null; S.tab='result'; render(); toast('回答を送りました');
  }catch(e){
    btn.disabled=false; btn.textContent='回答を送る';
    toast(fbMessage(e));
  }
}

/* --- results --- */
function resultHTML(ev){
  const total = ev.responses.length;
  if(!total) return `<div class="card"><div class="empty">まだ回答がありません。<br>リンクを共有してみてください。</div></div>`;
  const best = allWindows(ev).slice(0,5);
  const names = ev.responses.map(r=> esc(r.name) + (r.provider==='google'? '<span class="vmark" title="Googleログイン済み">✓</span>':''));

  const bestHTML = best.map((w,i)=>winHTML(ev,w,i===0)).join('') || '<div class="empty">全員が空く時間は見つかりませんでした。</div>';

  const perDay = ev.dates.map(d=>{
    const den = density(ev,d);
    const bars = den.map((s)=>{
      const a = total? s.o/total : 0;
      const mh = total? (s.m/total)*100 : 0;
      const hour = ((s.t+SLOT)%60===0);
      return `<div class="slot${hour?' hour':''}" title="${fmt(s.t)} ○${s.o} △${s.m}">
        ${s.o?`<span class="fill" style="opacity:${(0.16+a*0.84).toFixed(2)}"></span>`:''}
        ${s.m?`<span class="mb" style="height:${Math.max(4,mh*0.28).toFixed(1)}px"></span>`:''}</div>`;
    }).join('');
    const top = windowsFor(ev,d).sort((a,b)=>(b.yes-a.yes)||(b.maybe-a.maybe)||(a.from-b.from)).slice(0,2);
    return `<div class="dayblock">
      <div class="dhead"><div class="dt">${dlabel(d)}</div></div>
      <div class="track">
        <div class="tlabels mono"><span>${fmt(ev.dayStart)}</span><span>${fmt(Math.round((ev.dayStart+ev.dayEnd)/2/SLOT)*SLOT)}</span><span>${fmt(ev.dayEnd)}</span></div>
        <div class="tbar">${bars}</div>
      </div>
      <div style="margin-top:10px">${top.map(w=>winHTML(ev,w,false,true)).join('')}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <p class="eyebrow">いちばん重なる時間</p>
    ${bestHTML}
    <p class="hint">${total}人が回答（${names.join('、')}）</p>
  </div>
  <div class="card">
    <p class="eyebrow">日ごとの重なり</p>
    <p class="hint" style="margin:0 0 6px">濃いほど○が多い時間。下の帯は△の人数です。</p>
    ${perDay}
  </div>`;
}
function winHTML(ev,w,isTop,noDate){
  const yes=[],may=[],no=[];
  ev.responses.forEach((r,i)=>{ const s=w.per[i]; (s==='o'?yes:s==='t'?may:no).push(r); });
  const span = w.to - w.from;
  const memos = may.filter(r=> r.days[w.date] && r.days[w.date].memo);
  return `<div class="win${isTop?' top':''}">
    <div class="wtop">
      <div><span class="date">${noDate?'':dshort(w.date)}</span><span class="time">${fmt(w.from)}–${fmt(w.to)}</span></div>
      <div class="tally"><span class="o">○${w.yes}</span><span class="t">△${w.maybe}</span><span class="x">✕${no.length}</span></div>
    </div>
    ${span>ev.duration? `<div class="free">この ${fmt(w.from)}–${fmt(w.to)} の中なら、どこで ${durLabel(ev.duration)} とっても同じ顔ぶれです</div>`:''}
    <div class="who">
      ${yes.length?`<span>○ <b>${yes.map(r=>esc(r.name)).join('、')}</b></span>`:''}
      ${may.length?`<span>△ <b>${may.map(r=>esc(r.name)).join('、')}</b></span>`:''}
      ${no.length?`<span>✕ ${no.map(r=>esc(r.name)).join('、')}</span>`:''}
    </div>
    ${memos.length? `<div class="memo">${memos.map(r=>`<p>${esc(r.name)}：${esc(r.days[w.date].memo)}</p>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- boot ---------- */
S.mine = lget('mine', []) || [];
render();
connect().then(()=>{
  if(FB.state!=='ready') return;
  const h = (location.hash||'').slice(1).toUpperCase();
  if(/^[A-Z0-9]{6}$/.test(h)) openEvent(h);
});
window.addEventListener('hashchange', ()=>{
  const h = (location.hash||'').slice(1).toUpperCase();
  if(FB.state!=='ready') return;
  if(/^[A-Z0-9]{6}$/.test(h)){ if(!S.ev || S.ev.code!==h) openEvent(h); }
  else if(S.view==='event'){ detach(); S.view='home'; S.ev=null; A=null; render(); }
});
</script>
</body>
</html>
