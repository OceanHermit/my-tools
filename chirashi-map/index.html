<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>チラシマップ — 配った区域を記録する</title>
<meta name="description" content="チームでチラシを配る区域を決め、人ごとに分け、配った場所と配っていない場所を地図上で記録するツール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#14182B;
  --slate:#59627E;
  --line:#D3D9E6;
  --field:#EBEFF6;
  --paper:#FFFFFF;
  --bg:#E4E9F2;
  --pulse:#2F5BFF;
  --done:#1E7A5A;
  --skip:#C9852B;
  --todo:#98A1B8;
  --danger:#B4453F;
  --solid:#14182B;
  --on-solid:#FFFFFF;
  --card-shadow:0 1px 0 rgba(20,24,43,.05),0 8px 24px -18px rgba(20,24,43,.5);
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  overscroll-behavior:none;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- 共通パーツ ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--solid);color:var(--on-solid);border-color:var(--solid);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#E7C4C2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--pulse);border-color:var(--pulse);color:#fff}
input[type=text],input[type=number],select{
  width:100%;border:1px solid var(--line);background:var(--field);
  border-radius:10px;padding:10px 12px;font-size:15px;
}
label.fld{display:block;margin:12px 0 0}
label.fld>span{display:block;font-size:12px;color:var(--slate);letter-spacing:.04em;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--slate);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;
  background:var(--field);color:var(--slate);letter-spacing:.03em}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--card-shadow)}
.card+.card{margin-top:14px}
.card h2{font-size:15px;font-weight:700;letter-spacing:.04em}

/* ---------- ホーム ---------- */
.screen{display:none}
.screen.on{display:block}
.page{max-width:640px;margin:0 auto;padding:0 16px 64px}
header.top{padding:26px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:26px;height:26px;flex:none;border-radius:7px;background:var(--done);position:relative}
.brand .mark::after{content:"";position:absolute;inset:6px 6px auto 6px;height:3px;border-radius:2px;background:#fff;
  box-shadow:0 6px 0 rgba(255,255,255,.55)}
.brand h1{font-size:21px;font-weight:900;letter-spacing:.12em}
.tagline{margin:6px 0 0;font-size:12.5px;color:var(--slate)}
.codein{letter-spacing:.34em;text-transform:uppercase;text-align:center;font-size:22px;font-weight:700}

/* ---------- アプリ本体 ---------- */
/* アプリを開いている間は文書をスクロールさせない。
   引っぱった拍子にページ全体やアドレスバーが動くのを止める */
html.app-open, html.app-open body{height:100%;overflow:hidden;overscroll-behavior:none}
#app.on{position:fixed;inset:0;display:flex;flex-direction:column}
#app.on .stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.topbar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);
  border-bottom:1px solid var(--line);flex:none;padding-top:max(8px,env(safe-area-inset-top))
}
.modesw{flex:1;min-width:0;max-width:260px;margin:0 auto}
.modesw button{padding:7px 4px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}

#mapwrap{position:relative;flex:1 1 auto;min-height:180px}
#map{position:absolute;inset:0;background:#dfe5ee}
.maptools{position:absolute;right:10px;top:10px;z-index:600;display:flex;flex-direction:column;gap:6px}
.maptools .iconbtn{box-shadow:0 2px 8px -4px rgba(20,24,43,.6)}
.legend{position:absolute;left:10px;bottom:10px;z-index:600;background:rgba(255,255,255,.94);
  border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11.5px;display:flex;gap:10px;color:var(--slate)}
/* 描画中は地図を全面に出し、操作は画面下の細い帯にまとめる */
.drawbar{
  position:absolute;left:0;right:0;bottom:0;z-index:700;background:var(--paper);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 26px -20px rgba(20,24,43,.9)
}
.drawhead{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.drawhead b{font-size:13px;font-weight:700;flex:none}
.drawhead span.h{font-size:11.5px;color:var(--slate);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawhead span.n{font-size:11.5px;color:var(--slate);flex:none}
.drawrow{display:flex;gap:8px;align-items:stretch}
.drawrow+.drawrow{margin-top:8px}

/* 描き方の切り替え。押すボタンではなく「いまどちらか」を示す部品として見せる */
.seg{display:flex;flex:1;min-width:0;background:var(--field);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;
  padding:8px 4px;font-size:13px;font-weight:500;color:var(--slate);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(20,24,43,.2)}

/* 道に沿わせるかどうかは入切のスイッチ。チェックで示す */
.chk{display:inline-flex;align-items:center;gap:7px;flex:none;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:11px;
  padding:8px 11px;font-size:12.5px;color:var(--slate);white-space:nowrap}
.chk i{width:18px;height:18px;border-radius:5px;flex:none;
  border:1.5px solid var(--line);background:var(--paper);
  display:grid;place-items:center;font-size:12px;line-height:1;color:transparent;font-style:normal}
.chk.on{color:var(--ink);border-color:var(--done)}
.chk.on i{background:var(--done);border-color:var(--done);color:#fff}

/* 実行する操作はこの行だけ。決定だけを主役にする */
.drawrow.act .btn{flex:1;min-width:0;padding:10px 4px;font-size:13.5px;white-space:nowrap}
.drawrow.act .btn.primary{flex:1.6}
.drawrow.act .btn.quiet{border-color:transparent;background:var(--field);color:var(--slate)}

body.drawing .legend{display:none}
body.drawing #btnBase,body.drawing #btnFit{display:none}
body.drawing .leaflet-control-zoom{display:none}
body.drawing .leaflet-bottom.leaflet-right{bottom:calc(var(--drawbar-h,130px) + 4px)}
/* 描画中はヘッダも隠して、地図に使える高さを稼ぐ（表題は帯の中に出ている） */
@media (max-width:859px){
  body.drawing .panel{display:none}
  body.drawing .topbar{display:none}
}

.panel{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);
  display:flex;flex-direction:column;max-height:46%}
.panel.collapsed{max-height:none}
.panel.collapsed .tabbody{display:none}
.panel.collapsed .tabs{display:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:11px 4px;font-size:13.5px;font-weight:500;
  color:var(--slate);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--solid)}
.tabbody{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grabber{width:100%;height:32px;display:flex;align-items:center;justify-content:center;gap:7px;
  border:0;border-bottom:1px solid var(--line);background:var(--paper);
  font:inherit;font-size:12.5px;color:var(--slate);cursor:pointer;flex:none;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.grabber:active{background:var(--field)}
.grabber i{font-style:normal;font-size:10px}

/* 区域・仲間の行 */
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.item+.item{margin-top:8px}
.item.sel{border-color:var(--solid);box-shadow:0 0 0 1px var(--solid) inset}
.item .hd{display:flex;align-items:center;gap:8px}
.item .hd b{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--done);border-radius:4px;transition:width .25s}
.sub{margin-top:8px;padding-left:12px;border-left:2px solid var(--field)}

.sr{list-style:none;margin:0;padding:0}
.sr li{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13.5px}
.sr li+li{margin-top:6px}
.sr li:hover{background:var(--field)}
.sr li b{display:block;font-weight:700}
.sr li span{color:var(--slate);font-size:12px}

/* 配る画面のいちばん上：地区ぜんたいの進み具合 */
.total{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--field);margin-bottom:12px}
.total .hd{display:flex;align-items:baseline;gap:8px}
.total .hd b{font-size:13px;font-weight:700}
.total .hd .mono{margin-left:auto;font-size:15px;font-weight:700}
.total p{margin-top:4px}

/* 仲間の一覧（配る画面） */
.mates{margin-bottom:12px}
.mates .cap{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.mates .cap b{font-size:12.5px;color:var(--slate);letter-spacing:.06em}
.mate{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);
  border-radius:11px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.mate+.mate{margin-top:6px}
.mate:disabled{cursor:default}
.mate .hd{display:flex;align-items:center;gap:7px}
.mate .hd b{font-size:13.5px;font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .hd .mono{font-size:13px;font-weight:700;flex:none}
.mate .bar{height:5px;margin-top:6px}
.pill.warn{background:#FCE9E4;color:#9C3B32}
.pill.live{background:#E4F2EC;color:#12664A}
.pill.old{background:var(--field);color:var(--slate)}

/* 位置を共有している間、地図の上に出しつづける印 */
.livechip{position:absolute;left:10px;top:10px;z-index:600;display:flex;align-items:center;gap:8px;
  background:var(--done);color:#fff;border-radius:999px;padding:6px 8px 6px 12px;font-size:12px;
  box-shadow:0 2px 10px -4px rgba(20,24,43,.7)}
.livechip button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;
  padding:3px 10px;font-size:11.5px;cursor:pointer;font:inherit;font-size:11.5px}
.livechip .blip{width:8px;height:8px;border-radius:50%;background:#fff;animation:blip 1.8s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

.banner{background:#FCF4E8;color:#7A5417;border:1px solid #EBD9B8;border-radius:12px;padding:10px 12px;font-size:12.5px}
.banner+*{margin-top:12px}

/* トースト */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:2000;
  background:var(--solid);color:var(--on-solid);border-radius:11px;padding:10px 16px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* モーダル */
#modal{position:fixed;inset:0;z-index:1500;background:rgba(20,24,43,.42);display:none;
  align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .box{background:var(--paper);border-radius:16px;padding:18px;max-width:420px;width:100%;
  box-shadow:0 24px 60px -24px rgba(20,24,43,.7);max-height:86dvh;overflow:auto}
#modal h2{font-size:16px;font-weight:700;margin-bottom:8px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* 地図の描画中カーソル */
.drawing .leaflet-container{cursor:crosshair}
.leaflet-container{font:inherit}
.unitlabel{background:transparent;border:0;box-shadow:none;font-size:10px;color:#14182B;text-shadow:0 0 3px #fff,0 0 3px #fff}

@media (min-width:860px){
  #app.on{flex-direction:row}
  #app.on .stack{min-width:0}
  .panel{max-height:none;height:100%;width:380px;flex:none;border-top:0;border-left:1px solid var(--line)}
  .panel.collapsed .tabbody{display:block}
  .grabber{display:none}
}
</style>
</head>
<body>

<!-- ===================== ホーム ===================== -->
<div id="home" class="screen on">
  <div class="page">
    <header class="top">
      <div class="brand"><i class="mark"></i><h1>チラシマップ</h1></div>
      <p class="tagline">配る区域を決めて人ごとに分け、配った所と残りを地図で残す。</p>
    </header>

    <div id="modeBanner" class="banner hide"></div>

    <div class="card">
      <h2>地区をつくる</h2>
      <p class="muted" style="margin-top:4px">つくった人が管理者になります。合言葉コードを仲間に配って参加してもらいます。</p>
      <label class="fld"><span>地区の名前</span><input type="text" id="newName" placeholder="例：秋のチラシ・東町"></label>
      <label class="fld"><span>あなたの名前</span><input type="text" id="newMe" placeholder="例：山田"></label>
      <div class="row" style="margin-top:14px"><button class="btn primary grow" id="btnCreate">つくる</button></div>
    </div>

    <div class="card">
      <h2>合言葉コードで参加</h2>
      <label class="fld"><span>コード（6文字）</span>
        <input type="text" id="joinCode" class="codein mono" maxlength="6" placeholder="ABC123" autocapitalize="characters" autocomplete="off"></label>
      <label class="fld"><span>あなたの名前</span><input type="text" id="joinMe" placeholder="例：佐藤"></label>
      <div class="row" style="margin-top:14px"><button class="btn primary grow" id="btnJoin">参加する</button></div>
    </div>

    <div class="card hide" id="recentCard">
      <h2>最近ひらいた地区</h2>
      <div id="recentList" style="margin-top:10px"></div>
    </div>

    <p class="muted" style="margin-top:22px;text-align:center">
      地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a> ／
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    </p>
  </div>
</div>

<!-- ===================== アプリ ===================== -->
<div id="app" class="screen">
  <div class="stack">
    <div class="topbar">
      <button class="iconbtn" id="btnHome" title="ホームへ">‹</button>
      <div class="seg modesw" id="modesw">
        <button data-view="prep">準備</button>
        <button data-view="go" class="on">配る</button>
      </div>
      <button class="iconbtn" id="btnMenu" title="この地区について">⋯</button>
    </div>

    <div id="mapwrap">
      <div id="map"></div>
      <div class="maptools">
        <button class="iconbtn" id="btnLocate" title="現在地">◎</button>
        <button class="iconbtn" id="btnBase" title="地図の種類">▤</button>
        <button class="iconbtn" id="btnFit" title="区域全体が入るように地図を合わせる">⤢</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="livechip hide" id="livechip">
        <i class="blip"></i>現在地を共有中<button id="btnStopShare">やめる</button>
      </div>
      <div class="drawbar hide" id="drawbar">
        <div class="drawhead">
          <b id="drawTitle">区域を囲む</b>
          <span class="h" id="drawHelp"></span>
          <span class="n mono" id="drawCount"></span>
        </div>
        <div class="drawrow">
          <div class="seg">
            <button id="drawModeTap" class="on">点を置く</button>
            <button id="drawModeTrace">なぞる</button>
          </div>
          <button class="chk on" id="drawSnap"><i>✓</i>道に沿わせる</button>
        </div>
        <div class="drawrow act">
          <button class="btn quiet" id="drawUndo">1つ戻す</button>
          <button class="btn quiet" id="drawCancel">やめる</button>
          <button class="btn primary" id="drawDone">この形で決定</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <button class="grabber" id="grabber"><span id="grabTxt">地図を広く</span><i id="grabIco">▼</i></button>
    <div class="tabs hide" id="tabs">
      <button data-tab="areas" class="on">区域</button>
      <button data-tab="mem">仲間</button>
    </div>
    <div class="tabbody" id="tab-mine"></div>
    <div class="tabbody hide" id="tab-areas"></div>
    <!-- 準備＝区域と仲間、配る＝自分の区画。上のスイッチで入れ替える -->
    <div class="tabbody hide" id="tab-mem"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

   0. 設定

   apiKey は Web 版 Firebase では公開される前提の値で、秘密情報ではない。
   実質的な防御は firestore.rules 側で行う。
   ここを "PLACEHOLDER" に戻すと、アプリは「この端末だけ」モードで動く。 */
const firebaseConfig = {
  apiKey:            "AIzaSyBTE8EFnN7UiBUGnNLMemu_YxCqH9mTmi4",
  authDomain:        "flyer-790e5.firebaseapp.com",
  projectId:         "flyer-790e5",
  storageBucket:     "flyer-790e5.firebasestorage.app",
  messagingSenderId: "276711881048",

};

const MEMBER_COLORS = ["#2F5BFF","#1E7A5A","#C9852B","#8B44AD","#B4453F","#0E7C86","#5E6AD2","#A0522D"];

/* 記録の状態 */
const ST_TODO = 0, ST_DONE = 1, ST_SKIP = 2;
const ST_LABEL = { 0:"未配布", 1:"配布済み", 2:"対象外" };
const ST_COLOR = { 0:"#98A1B8", 1:"#1E7A5A", 2:"#C9852B" };

/* =========================================================================
   1. 小道具
   ========================================================================= */
const $  = (s,r)=> (r||document).querySelector(s);

/* =========================================================================
   2. 幾何（緯度経度は [lat, lng] で統一）
   ========================================================================= */
const R_EARTH = 6378137;
const toRad = d => d*Math.PI/180;

function distM(a,b){
  const dLat=toRad(b[0]-a[0]), dLng=toRad(b[1]-a[1]);
  const la1=toRad(a[0]), la2=toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R_EARTH*Math.asin(Math.min(1,Math.sqrt(h)));
}
/* 局所平面（メートル）への射影。lat0 を基準にする */
function projector(lat0){
  const kx = Math.cos(toRad(lat0))*111320, ky = 110540;
  return {
    to:   p => [p[1]*kx, p[0]*ky],
    back: q => [q[1]/ky, q[0]/kx]
  };
}
function ringCenter(ring){
  let la=0,ln=0; for(const p of ring){ la+=p[0]; ln+=p[1]; }
  return [la/ring.length, ln/ring.length];
}
function bboxOf(ring){
  let s=90,w=180,n=-90,e=-180;
  for(const p of ring){ if(p[0]<s)s=p[0]; if(p[0]>n)n=p[0]; if(p[1]<w)w=p[1]; if(p[1]>e)e=p[1]; }
  return {s,w,n,e};
}
function padBbox(b, m){
  const dLat = m/110540, dLng = m/(Math.cos(toRad((b.s+b.n)/2))*111320);
  return {s:b.s-dLat, w:b.w-dLng, n:b.n+dLat, e:b.e+dLng};
}
/* 面積（m^2）。等距円筒近似 */
function areaM2(ring){
  if(!ring || ring.length<3) return 0;
  const c=ringCenter(ring), pr=projector(c[0]);
  let a=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const p=pr.to(ring[i]), q=pr.to(ring[j]);
    a += (q[0]+p[0])*(q[1]-p[1]);
  }
  return Math.abs(a/2);
}
function pointInRing(pt, ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const yi=ring[i][0], xi=ring[i][1], yj=ring[j][0], xj=ring[j][1];
    if((yi>pt[0])!==(yj>pt[0]) && pt[1] < (xj-xi)*(pt[0]-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
/* Douglas-Peucker（メートル指定） */
function simplify(pts, tolM){
  if(pts.length<3) return pts.slice();
  const c=ringCenter(pts), pr=projector(c[0]);
  const P=pts.map(pr.to);
  const keep=new Array(P.length).fill(false);
  keep[0]=keep[P.length-1]=true;
  const stack=[[0,P.length-1]];
  while(stack.length){
    const [a,b]=stack.pop();
    let best=-1, bd=tolM;
    const ax=P[a][0],ay=P[a][1],bx=P[b][0],by=P[b][1];
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
    for(let i=a+1;i<b;i++){
      const px=P[i][0]-ax, py=P[i][1]-ay;
      let t = L2>0 ? (px*dx+py*dy)/L2 : 0; t=clamp(t,0,1);
      const ex=px-t*dx, ey=py-t*dy, d=Math.hypot(ex,ey);
      if(d>bd){ bd=d; best=i; }
    }
    if(best>=0){ keep[best]=true; stack.push([a,best],[best,b]); }
  }
  return pts.filter((_,i)=>keep[i]);
}
/* Sutherland–Hodgman：任意の subject を凸の clip（矩形など）で切る */
function clipRingByConvex(subject, clip){
  let out = subject.slice();
  const n=clip.length;
  for(let i=0;i<n;i++){
    const A=clip[i], B=clip[(i+1)%n];
    const inp = out; out=[];
    if(!inp.length) break;
    const side = p => (B[1]-A[1])*(p[0]-A[0]) - (B[0]-A[0])*(p[1]-A[1]);
    const inter = (p,q) => {
      const sp=side(p), sq=side(q), t = sp/(sp-sq);
      return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
    };
    for(let j=0;j<inp.length;j++){
      const cur=inp[j], prev=inp[(j+inp.length-1)%inp.length];
      const sc=side(cur), sp=side(prev);
      if(sc>=0){ if(sp<0) out.push(inter(prev,cur)); out.push(cur); }
      else if(sp>=0) out.push(inter(prev,cur));
    }
  }
  return out;
}
/* 反時計回り（正の面積）に揃える。clipRingByConvex は向きに依存する */
function ccw(ring){
  let a=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++)
    a += (ring[j][1]+ring[i][1])*(ring[j][0]-ring[i][0]);
  return a>0 ? ring.slice().reverse() : ring.slice();
}
function rectRing(s,w,n,e){ return [[s,w],[s,e],[n,e],[n,w]]; }

/* 線分列をポリゴンで切り、内側の断片だけ返す */
function clipLineByRing(line, ring){
  const out=[]; let cur=[];
  for(let i=0;i<line.length-1;i++){
    const p=line[i], q=line[i+1];
    const ts=[0,1];
    for(let k=0,j=ring.length-1;k<ring.length;j=k++){
      const A=ring[j], B=ring[k];
      const d1=[q[0]-p[0], q[1]-p[1]], d2=[B[0]-A[0], B[1]-A[1]];
      const den = d1[1]*d2[0]-d1[0]*d2[1];
      if(Math.abs(den)<1e-14) continue;
      const t = ((A[1]-p[1])*d2[0]-(A[0]-p[0])*d2[1])/den;
      const u = ((A[1]-p[1])*d1[0]-(A[0]-p[0])*d1[1])/den;
      if(t>0 && t<1 && u>=0 && u<=1) ts.push(t);
    }
    ts.sort((a,b)=>a-b);
    for(let k=0;k<ts.length-1;k++){
      const t0=ts[k], t1=ts[k+1];
      if(t1-t0 < 1e-9) continue;
      const at = t => [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
      const mid = at((t0+t1)/2);
      const a=at(t0), b=at(t1);
      if(pointInRing(mid, ring)){
        if(cur.length===0) cur.push(a);
        cur.push(b);
      }else{
        if(cur.length>1) out.push(cur);
        cur=[];
      }
    }
  }
  if(cur.length>1) out.push(cur);
  return out;
}
function lineLenM(line){ let d=0; for(let i=0;i<line.length-1;i++) d+=distM(line[i],line[i+1]); return d; }
/* 線を最大長 maxM ごとに切る */
function chopLine(line, maxM){
  const total=lineLenM(line);
  if(total<=maxM) return [line];
  const parts=Math.ceil(total/maxM), step=total/parts;
  const out=[]; let cur=[line[0]], acc=0;
  for(let i=0;i<line.length-1;i++){
    let a=line[i], b=line[i+1], segd=distM(a,b);
    while(acc+segd >= step-1e-9 && out.length<parts-1){
      const need=step-acc, t=need/segd;
      const cut=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
      cur.push(cut); out.push(cur); cur=[cut];
      a=cut; segd=distM(a,b); acc=0;
    }
    acc+=segd; cur.push(b);
  }
  if(cur.length>1) out.push(cur);
  return out;
}
function fmtArea(m2){
  if(m2>=1e6) return (m2/1e6).toFixed(2)+" km²";
  if(m2>=1e4) return (m2/1e4).toFixed(1)+" ha";
  return Math.round(m2)+" m²";
}

/* 面積が等しくなるように n 分割する。axis: "auto" | "ns" | "ew" */
function splitRing(ring, n, axis){
  if(n<=1) return [ring.slice()];
  const R = ccw(ring), b = bboxOf(R), total = areaM2(R);
  const widthM  = distM([ (b.s+b.n)/2, b.w ], [ (b.s+b.n)/2, b.e ]);
  const heightM = distM([ b.s, (b.w+b.e)/2 ], [ b.n, (b.w+b.e)/2 ]);
  const vertical = axis==="ew" ? true : axis==="ns" ? false : widthM>=heightM;
  const pad = 0.002;
  const lo = vertical ? b.w : b.s, hi = vertical ? b.e : b.n;
  const bandTo = c => vertical
    ? rectRing(b.s-pad, b.w-pad, b.n+pad, c)
    : rectRing(b.s-pad, b.w-pad, c, b.e+pad);
  const cumArea = c => areaM2(clipRingByConvex(R, bandTo(c)));

  const cuts=[];
  for(let i=1;i<n;i++){
    const target = total*i/n;
    let a=lo, z=hi;
    for(let k=0;k<28;k++){
      const m=(a+z)/2;
      if(cumArea(m) < target) a=m; else z=m;
    }
    cuts.push((a+z)/2);
  }
  const edges=[lo-pad, ...cuts, hi+pad];
  const out=[];
  for(let i=0;i<n;i++){
    const win = vertical
      ? rectRing(b.s-pad, edges[i], b.n+pad, edges[i+1])
      : rectRing(edges[i], b.w-pad, edges[i+1], b.e+pad);
    const piece = clipRingByConvex(R, win);
    if(piece.length>=3) out.push(simplify(piece, 1.5));
  }
  return out;
}

/* =========================================================================
   3. 外部データ（Nominatim / Overpass）
   ========================================================================= */
async function fetchJSON(url, opts, ms){
  const ac = new AbortController();
  const to = setTimeout(()=>ac.abort(), ms||30000);
  try{
    const r = await fetch(url, Object.assign({signal:ac.signal}, opts||{}));
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}

let lastNominatim = 0;
async function geoSearch(q){
  const wait = 1100 - (Date.now()-lastNominatim);
  if(wait>0) await sleep(wait);
  lastNominatim = Date.now();
  const url = NOMINATIM + "?format=jsonv2&polygon_geojson=1&addressdetails=1&limit=8"
            + "&accept-language=ja&countrycodes=jp&q=" + encodeURIComponent(q);
  const rows = await fetchJSON(url, {headers:{"Accept":"application/json"}}, 20000);
  return rows.map(r=>{
    let ring=null;
    const g=r.geojson;
    if(g && g.type==="Polygon") ring = g.coordinates[0].map(c=>[c[1],c[0]]);
    else if(g && g.type==="MultiPolygon"){
      let best=null, ba=-1;
      for(const poly of g.coordinates){
        const rr = poly[0].map(c=>[c[1],c[0]]);
        const a = areaM2(rr); if(a>ba){ ba=a; best=rr; }
      }
      ring=best;
    }
    return {
      name: r.display_name,
      short: (r.name || r.display_name.split(",")[0]),
      kind: r.type,
      lat: parseFloat(r.lat), lng: parseFloat(r.lon),
      bb: r.boundingbox ? r.boundingbox.map(Number) : null,   // [s,n,w,e]
      ring: ring && ring.length>=4 ? simplify(ring, 3) : null
    };
  });
}

async function overpass(query){
  let lastErr=null;
  for(const ep of OVERPASS){
    try{
      return await fetchJSON(ep, {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(query)
      }, 60000);
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("Overpass に届きませんでした");
}

const ROAD_FILTER = '["highway"]["highway"!~"^(motorway|motorway_link|trunk|trunk_link|construction|proposed|raceway|bus_guideway|escape|elevator|corridor)$"]["area"!="yes"]';

async function fetchRoads(bb){
  const q = `[out:json][timeout:50];way${ROAD_FILTER}(${bb.s},${bb.w},${bb.n},${bb.e});out body geom;`;
  const j = await overpass(q);
  return (j.elements||[]).filter(e=>e.type==="way" && e.geometry && e.geometry.length>1).map(e=>({
    id:e.id,
    name:(e.tags&&(e.tags["name"]||e.tags["name:ja"]))||"",
    hw:(e.tags&&e.tags.highway)||"",
    nodes:e.nodes||[],
    geom:e.geometry.map(g=>[g.lat,g.lon])
  }));
}
async function fetchBuildings(bb){
  const q = `[out:json][timeout:60];(way["building"](${bb.s},${bb.w},${bb.n},${bb.e});relation["building"](${bb.s},${bb.w},${bb.n},${bb.e}););out center;`;
  const j = await overpass(q);
  const out=[];
  for(const e of (j.elements||[])){
    const c = e.center || (e.type==="node" ? {lat:e.lat, lon:e.lon} : null);
    if(!c) continue;
    const t=e.tags||{};
    out.push({
      id:e.type[0]+e.id, lat:c.lat, lng:c.lon,
      name: t["name"] || t["addr:housename"] || "",
      addr: [t["addr:block_number"], t["addr:housenumber"]].filter(Boolean).join("-"),
      kind: t.building || "yes",
      units: parseInt(t["building:flats"]||t["flats"]||"",10) || 0
    });
  }
  return out;
}

/* =========================================================================
   4. 道へのスナップ（描いた線を道路網に沿わせる）
   ========================================================================= */
function buildRoadGraph(ways){
  const key = p => p[0].toFixed(6)+","+p[1].toFixed(6);
  const idOf = new Map(); const pts=[]; const adj=[];
  const nid = p => {
    const k=key(p); let i=idOf.get(k);
    if(i===undefined){ i=pts.length; idOf.set(k,i); pts.push(p); adj.push([]); }
    return i;
  };
  for(const w of ways){
    let prev=nid(w.geom[0]);
    for(let i=1;i<w.geom.length;i++){
      const cur=nid(w.geom[i]);
      if(cur!==prev){
        const d=distM(pts[prev],pts[cur]);
        adj[prev].push({t:cur,w:d}); adj[cur].push({t:prev,w:d});
      }
      prev=cur;
    }
  }
  return {pts, adj};
}
function nearestNode(g, p){
  let bi=-1, bd=Infinity;
  for(let i=0;i<g.pts.length;i++){
    const q=g.pts[i];
    const d=(q[0]-p[0])*(q[0]-p[0]) + (q[1]-p[1])*(q[1]-p[1])*0.66;
    if(d<bd){ bd=d; bi=i; }
  }
  return bi;
}
/* A*。maxCost を超えたら諦める */
function routeBetween(g, a, b, maxCost){
  if(a===b) return [a];
  const N=g.pts.length;
  const dist=new Float64Array(N).fill(Infinity);
  const prev=new Int32Array(N).fill(-1);
  const seen=new Uint8Array(N);
  const h = i => distM(g.pts[i], g.pts[b]);
  const heap=[{i:a,f:h(a)}]; dist[a]=0;
  const push=x=>{ heap.push(x); let i=heap.length-1;
    while(i>0){ const p=(i-1)>>1; if(heap[p].f<=heap[i].f) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop();
    if(heap.length){ heap[0]=last; let i=0;
      for(;;){ const l=2*i+1,r=l+1; let m=i;
        if(l<heap.length&&heap[l].f<heap[m].f)m=l;
        if(r<heap.length&&heap[r].f<heap[m].f)m=r;
        if(m===i)break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } }
    return top; };
  let guard=0;
  while(heap.length){
    if(++guard > 400000) break;
    const cur=pop(); if(seen[cur.i]) continue; seen[cur.i]=1;
    if(cur.i===b) break;
    if(dist[cur.i] > maxCost) break;
    for(const e of g.adj[cur.i]){
      const nd=dist[cur.i]+e.w;
      if(nd<dist[e.t]){ dist[e.t]=nd; prev[e.t]=cur.i; push({i:e.t, f:nd+h(e.t)}); }
    }
  }
  if(!seen[b] || dist[b]>maxCost) return null;
  const path=[]; for(let i=b;i!==-1;i=prev[i]) path.push(i);
  return path.reverse();
}
/* 描いたリングを道に沿わせる。失敗した区間は直線のまま残す */
function snapRingToRoads(ring, ways){
  const g = buildRoadGraph(ways);
  if(g.pts.length<4) return {ring:ring, snapped:0, total:1};
  const anchors = simplify(ring, 22).slice(0, 80);
  if(anchors.length<3) return {ring:ring, snapped:0, total:1};
  const out=[]; let ok=0, total=0;
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i], b=anchors[(i+1)%anchors.length];
    total++;
    const na=nearestNode(g,a), nb=nearestNode(g,b);
    const straight=distM(a,b);
    const budget=Math.max(300, straight*2.6);
    const path = (na>=0&&nb>=0) ? routeBetween(g,na,nb,budget) : null;
    if(path && path.length>1){
      ok++;
      for(const idx of path){
        const p=g.pts[idx];
        if(!out.length || distM(out[out.length-1],p)>0.4) out.push(p);
      }
    }else{
      if(!out.length || distM(out[out.length-1],a)>0.4) out.push(a);
      out.push(b);
    }
  }
  const cleaned = simplify(out, 1.2);
  return {ring: cleaned.length>=3 ? cleaned : ring, snapped:ok, total};
}

   5. 記録の単位をつくる
   ========================================================================= */

/* 道路：交差点で切り、区域で切り、長すぎる区間はさらに分ける */
async function genRoadUnits(ring, onProgress){
  const bb = padBbox(bboxOf(ring), 120);
  onProgress && onProgress("道路を取り寄せています…");
  const ways = await fetchRoads(bb);
  onProgress && onProgress("道路を区切っています…");
  const useCount = new Map();
  for(const w of ways) for(const nd of w.nodes) useCount.set(nd, (useCount.get(nd)||0)+1);

  const units=[]; let i=0;
  for(const w of ways){
    /* 交差点で分割 */
    const pieces=[]; let cur=[w.geom[0]];
    for(let k=1;k<w.geom.length;k++){
      cur.push(w.geom[k]);
      const isEnd = k===w.geom.length-1;
      const isCross = w.nodes[k]!==undefined && (useCount.get(w.nodes[k])||0)>1;
      if(isCross && !isEnd){ pieces.push(cur); cur=[w.geom[k]]; }
    }
    if(cur.length>1) pieces.push(cur);

    for(const piece of pieces){
      for(const seg of clipLineByRing(piece, ring)){
        for(const part of chopLine(seg, 160)){
          const len = lineLenM(part);
          if(len < 8) continue;
          units.push({ id:"r"+(i++), t:"road", n:w.name, hw:w.hw, m:Math.round(len), g:part.map(roundPt) });
        }
      }
    }
  }
  return units;
}
const roundPt = p => [ +p[0].toFixed(6), +p[1].toFixed(6) ];

/* 区画：格子で切る */
function genBlockUnits(ring, sizeM){
  const R = ccw(ring), b = bboxOf(R);
  const dLat = sizeM/110540;
  const dLng = sizeM/(Math.cos(toRad((b.s+b.n)/2))*111320);
  const units=[]; let i=0;
  const cols = Math.ceil((b.e-b.w)/dLng), rows = Math.ceil((b.n-b.s)/dLat);
  if(cols*rows > 6000) throw new Error("区画が細かすぎます。もっと大きい区画にするか、区域を分けてください。");
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const s=b.s+r*dLat, w=b.w+c*dLng;
      const cell = rectRing(s, w, Math.min(s+dLat,b.n+dLat), Math.min(w+dLng,b.e+dLng));
      const piece = clipRingByConvex(R, cell);
      if(piece.length<3) continue;
      const a = areaM2(piece);
      if(a < sizeM*sizeM*0.06) continue;
      units.push({ id:"b"+(i++), t:"block", m:Math.round(a),
                   n:String.fromCharCode(65+(c%26))+(rows-r),
                   g:simplify(piece,1).map(roundPt) });
    }
  }
  return units;
}

/* 建物：中心点をピンにする */
async function genPinUnits(ring, onProgress){
  const bb = padBbox(bboxOf(ring), 40);
  onProgress && onProgress("建物を取り寄せています…");
  const all = await fetchBuildings(bb);
  const units=[]; let i=0;
  for(const b of all){
    if(!pointInRing([b.lat,b.lng], ring)) continue;
    units.push({ id:"p"+(i++), t:"pin", n:b.name||b.addr||"", k:b.kind, u:b.units,
                 g:[roundPt([b.lat,b.lng])] });
  }
  return units;
}

async function generateUnits(area, mode, opts, onProgress){
  const ring = area.ring;
  if(!ring || ring.length<3) throw new Error("区域の形がありません");
  const a = areaM2(ring);
  if(a > 12e6) throw new Error("区域が広すぎます（"+fmtArea(a)+"）。分けてから作ってください。");
  if(mode==="road")  return await genRoadUnits(ring, onProgress);
  if(mode==="block") return genBlockUnits(ring, (opts&&opts.gridSize)||80);
  if(mode==="pin")   return await genPinUnits(ring, onProgress);
  throw new Error("不明な単位です");
}

/* =========================================================================
   6. データの保存（Firebase / この端末だけ）
   ========================================================================= */
const CHUNK = 600000;

const Local = {
  key: c => LS_PREFIX+"pj:"+c,
  read(c){ try{ return JSON.parse(localStorage.getItem(Local.key(c))||"null"); }catch(e){ return null; } },
  write(c,v){ localStorage.setItem(Local.key(c), JSON.stringify(v));
              window.dispatchEvent(new CustomEvent("local-store", {detail:{code:c}})); },
  blank(){ return {project:null, members:{}, areas:{}, units:{}, stat:{}, live:{}}; }
};

const Store = {
  remote: HAS_FB, uid:null, db:null, fbError:null,

  initLocal(){
    this.remote = false;
    this.uid = localStorage.getItem(LS_PREFIX+"uid");
    if(!this.uid){ this.uid = "local-"+randCode(10).toLowerCase(); localStorage.setItem(LS_PREFIX+"uid", this.uid); }
  },
  async init(){
    if(!HAS_FB){ this.initLocal(); return; }
    if(typeof firebase==="undefined"){ this.fbError="Firebase を読み込めませんでした"; this.initLocal(); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    this.db = firebase.firestore();
    try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* 併用タブなどでは無効。動作には支障なし */ }
    const auth = firebase.auth();
    await new Promise((res)=>{
      const off = auth.onAuthStateChanged(u=>{ if(u){ this.uid=u.uid; off(); res(); } });
      auth.signInAnonymously().catch(e=>{
        this.fbError = e.code==="auth/operation-not-allowed"
          ? "Firebase 側で匿名ログインが有効になっていません" : (e.message||String(e));
        off(); this.initLocal(); res();
      });
    });
  },

  base(code){ return this.db.collection("artifacts").doc(APP_ID)
      .collection("public").doc("data").collection("projects").doc(code); },

  /* --- プロジェクト --- */
  async createProject(name, myName){
    const code = randCode(6);
    const pj = { name, ownerUid:this.uid, created:todayStr(), appVer:1 };
    const me = { name:myName, color:MEMBER_COLORS[0], admin:true, joined:todayStr() };
    if(this.remote){
      await this.base(code).set(pj);
      await this.base(code).collection("members").doc(this.uid).set(me);
    }else{
      const d=Local.blank(); d.project=Object.assign({code},pj); d.members[this.uid]=me; Local.write(code,d);
    }
    return {code};
  },
  async getProject(code){
    if(this.remote){ const s=await this.base(code).get(); return s.exists ? Object.assign({code}, s.data()) : null; }
    const d=Local.read(code); return d && d.project ? d.project : null;
  },
  async joinProject(code, myName){
    const pj = await this.getProject(code);
    if(!pj) return null;
    if(this.remote){
      const ref=this.base(code).collection("members").doc(this.uid);
      const cur=await ref.get();
      const n = cur.exists ? (cur.data().color||MEMBER_COLORS[0]) : null;
      const cnt = (await this.base(code).collection("members").get()).size;
      await ref.set({ name:myName, color:n||MEMBER_COLORS[cnt%MEMBER_COLORS.length],
                      admin: cur.exists ? !!cur.data().admin : (pj.ownerUid===this.uid), joined:todayStr() }, {merge:true});
    }else{
      const d=Local.read(code)||Local.blank();
      const cnt=Object.keys(d.members).length;
      const cur=d.members[this.uid]||{};
      d.members[this.uid]=Object.assign({}, cur, {name:myName, color:cur.color||MEMBER_COLORS[cnt%MEMBER_COLORS.length],
        admin: cur.admin!==undefined ? cur.admin : (pj.ownerUid===this.uid), joined:todayStr()});
      Local.write(code,d);
    }
    return pj;
  },
  async removeMember(code, uid){
    if(this.remote) await this.base(code).collection("members").doc(uid).delete();
    else { const d=Local.read(code); delete d.members[uid]; Local.write(code,d); }
  },
  async setMember(code, uid, patch){
    if(this.remote) await this.base(code).collection("members").doc(uid).set(patch,{merge:true});
    else { const d=Local.read(code); d.members[uid]=Object.assign({}, d.members[uid]||{}, patch); Local.write(code,d); }
  },

  /* --- 監視 --- */
  watch(code, cb){
    if(this.remote){
      const offs=[];
      let pj=null, members={}, areas={};
      const fire=()=>cb({project:pj, members, areas});
      offs.push(this.base(code).onSnapshot(s=>{ pj = s.exists?Object.assign({code},s.data()):null; fire(); }));
      offs.push(this.base(code).collection("members").onSnapshot(s=>{
        members={}; s.forEach(d=>members[d.id]=d.data()); fire(); }));
      offs.push(this.base(code).collection("areas").onSnapshot(s=>{
        areas={}; s.forEach(d=>areas[d.id]=Object.assign({id:d.id}, d.data())); fire(); }));
      return ()=>offs.forEach(f=>f());
    }
    const emit=()=>{ const d=Local.read(code)||Local.blank();
      const areas={}; for(const k in d.areas) areas[k]=Object.assign({id:k}, d.areas[k]);
      cb({project:d.project, members:d.members, areas}); };
    const h=e=>{ if(e.detail.code===code) emit(); };
    window.addEventListener("local-store", h);
    emit();
    return ()=>window.removeEventListener("local-store", h);
  },

  /* --- 区域 --- */
  async saveArea(code, area){
    const id = area.id || ("a"+Date.now().toString(36)+randCode(3).toLowerCase());
    const doc = {
      name: area.name||"", parent: area.parent||"", uid: area.uid||"",
      mode: area.mode||"road", grid: area.grid||80, color: area.color||"",
      ringJson: JSON.stringify((area.ring||[]).map(roundPt)),
      updated: todayStr()
    };
    if(this.remote) await this.base(code).collection("areas").doc(id).set(doc,{merge:true});
    else { const d=Local.read(code); d.areas[id]=Object.assign({}, d.areas[id]||{}, doc); Local.write(code,d); }
    return id;
  },
  async deleteArea(code, id){
    if(this.remote){
      for(const sub of ["geom","stat"]){
        const s=await this.base(code).collection("areas").doc(id).collection(sub).get();
        const batch=this.db.batch(); s.forEach(d=>batch.delete(d.ref)); await batch.commit();
      }
      await this.base(code).collection("areas").doc(id).delete();
    }else{
      const d=Local.read(code); delete d.areas[id];
      for(const k of Object.keys(d.units)) if(k.startsWith(id+"|")) delete d.units[k];
      for(const k of Object.keys(d.stat))  if(k.startsWith(id+"|")) delete d.stat[k];
      Local.write(code,d);
    }
  },

  /* --- 単位（形） --- */
  async saveUnits(code, areaId, mode, units){
    const json = JSON.stringify(units);
    const parts=[]; for(let i=0;i<json.length;i+=CHUNK) parts.push(json.slice(i,i+CHUNK));
    if(this.remote){
      const col=this.base(code).collection("areas").doc(areaId).collection("geom");
      const old=await col.get();
      const batch=this.db.batch();
      old.forEach(d=>{ if(d.id.startsWith(mode+"_")) batch.delete(d.ref); });
      parts.forEach((p,i)=> batch.set(col.doc(mode+"_"+i), {j:p, i}));
      batch.set(col.doc(mode+"_meta"), {n:parts.length, count:units.length, at:todayStr()});
      await batch.commit();
    }else{
      const d=Local.read(code); d.units[areaId+"|"+mode]=units; Local.write(code,d);
    }
  },
  async loadUnits(code, areaId, mode){
    if(this.remote){
      const col=this.base(code).collection("areas").doc(areaId).collection("geom");
      const meta=await col.doc(mode+"_meta").get();
      if(!meta.exists) return null;
      const n=meta.data().n||0; let json="";
      for(let i=0;i<n;i++){ const s=await col.doc(mode+"_"+i).get(); if(!s.exists) return null; json+=s.data().j; }
      try{ return JSON.parse(json); }catch(e){ return null; }
    }
    const d=Local.read(code); return (d && d.units[areaId+"|"+mode]) || null;
  },

  /* --- 記録（状態） --- */
  shardOf(unitId){ const m=/^[a-z](\d+)$/.exec(unitId); return Math.floor((m?+m[1]:0)/900); },
  async setStatus(code, areaId, mode, unitId, val, byName){
    const rec = {s:val, b:this.uid, bn:byName||"", t:Date.now()};
    if(this.remote){
      const ref=this.base(code).collection("areas").doc(areaId).collection("stat")
                 .doc(mode+"_"+this.shardOf(unitId));
      ref.set({p:{[unitId]:rec}}, {merge:true});   /* 待たない：オフラインでも即座に反映される */
    }else{
      const d=Local.read(code), k=areaId+"|"+mode;
      d.stat[k]=d.stat[k]||{}; d.stat[k][unitId]=rec; Local.write(code,d);
    }
  },
  async setStatusMany(code, areaId, mode, entries, byName){
    if(!entries.length) return;
    if(this.remote){
      const groups={};
      for(const [uid,val] of entries){ const sh=this.shardOf(uid); (groups[sh]=groups[sh]||{})[uid]={s:val,b:this.uid,bn:byName||"",t:Date.now()}; }
      const batch=this.db.batch();
      for(const sh in groups)
        batch.set(this.base(code).collection("areas").doc(areaId).collection("stat").doc(mode+"_"+sh), {p:groups[sh]}, {merge:true});
      await batch.commit();
    }else{
      const d=Local.read(code), k=areaId+"|"+mode; d.stat[k]=d.stat[k]||{};
      for(const [uid,val] of entries) d.stat[k][uid]={s:val,b:this.uid,bn:byName||"",t:Date.now()};
      Local.write(code,d);
    }
  },
  /* --- 現在地の共有（入れている人の分だけ置かれる） --- */
  async setLive(code, rec){
    if(this.remote) await this.base(code).collection("live").doc(this.uid).set(rec);
    else { const d=Local.read(code); d.live=d.live||{}; d.live[this.uid]=rec; Local.write(code,d); }
  },
  async clearLive(code){
    if(!code) return;
    if(this.remote){ try{ await this.base(code).collection("live").doc(this.uid).delete(); }catch(e){} }
    else { const d=Local.read(code); if(d&&d.live){ delete d.live[this.uid]; Local.write(code,d); } }
  },
  watchLive(code, cb){
    if(this.remote){
      return this.base(code).collection("live").onSnapshot(s=>{
        const out={}; s.forEach(d=>out[d.id]=d.data()); cb(out);
      }, ()=>cb({}));
    }
    const emit=()=>{ const d=Local.read(code)||Local.blank(); cb(Object.assign({}, d.live||{})); };
    const h=e=>{ if(e.detail.code===code) emit(); };
    window.addEventListener("local-store", h); emit();
    return ()=>window.removeEventListener("local-store", h);
  },

  watchStatus(code, areaId, mode, cb){
    if(this.remote){
      return this.base(code).collection("areas").doc(areaId).collection("stat").onSnapshot(s=>{
        const out={};
        s.forEach(d=>{ if(!d.id.startsWith(mode+"_")) return; Object.assign(out, d.data().p||{}); });
        cb(out);
      });
    }
    const emit=()=>{ const d=Local.read(code)||Local.blank(); cb(Object.assign({}, d.stat[areaId+"|"+mode]||{})); };
    const h=e=>{ if(e.detail.code===code) emit(); };
    window.addEventListener("local-store", h); emit();
    return ()=>window.removeEventListener("local-store", h);
  }
};

const S = {
  code:null, project:null, members:{}, areas:{}, uid:null,
  view:"go", viewInit:false, tab:"areas", activeAreaId:null, mode:"road",
  units:[], stat:{}, unitLayers:{},
  off:null, offStat:null,
  autoWalk:false, pos:null, posAcc:0,
  live:{}, offLive:null, share:false, shareWatch:null, shareLast:null, shareSent:0, shareMoved:0, shareStart:0,
  busy:false
};
const meMember = () => S.members[S.uid] || {name:"（あなた）", color:MEMBER_COLORS[0], admin:false};
const isAdmin  = () => !!(meMember().admin) || (S.project && S.project.ownerUid===S.uid);
const areaList = () => Object.values(S.areas);
const childrenOf = pid => areaList().filter(a=>a.parent===pid).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
const parents   = () => areaList().filter(a=>!a.parent).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
const ringOf = a => { try{ return JSON.parse(a.ringJson||"[]"); }catch(e){ return []; } };
const memberColor = uid => (S.members[uid] && S.members[uid].color) || "#98A1B8";
/* 同じ名前の人が複数いると、どの行が誰か分からなくなるので後ろに目印を足す */
function memberName(uid){
  const m=S.members[uid];
  if(!m) return "未割り当て";
  const nm=m.name||"名なし";
  const dup=Object.keys(S.members).filter(u=>((S.members[u].name||"名なし")===nm)).length>1;
  return dup ? nm+" #"+String(uid).slice(0,4) : nm;
}

let map, gArea, gUnit, gDraw, gLive, meMarker, meCircle;
const BASES = {};

function initMap(){
  map = L.map("map", {preferCanvas:true, zoomControl:false, attributionControl:true, tap:true})
        .setView([35.681, 139.767], 15);
  L.control.zoom({position:"bottomright"}).addTo(map);
  const gsiAttr = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>';
  const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
  BASES.pale = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {maxZoom:19, attribution:gsiAttr});
  BASES.std  = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",  {maxZoom:19, attribution:gsiAttr});
  BASES.photo= L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {maxZoom:18, attribution:gsiAttr});
  BASES.osm  = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:osmAttr});
  (BASES[baseName]||BASES.pale).addTo(map);

  gUnit = L.layerGroup().addTo(map);
  gDraw = L.layerGroup().addTo(map);
  gLive = L.layerGroup().addTo(map);
}
function setBase(n){
  for(const k in BASES) if(map.hasLayer(BASES[k])) map.removeLayer(BASES[k]);
  BASES[n].addTo(map); baseName=n; localStorage.setItem(LS_PREFIX+"base", n);
  BASES[n].bringToBack && BASES[n].bringToBack();
}
function fitRing(ring, pad){
  if(!ring || !ring.length) return;
  map.fitBounds(L.latLngBounds(ring.map(p=>L.latLng(p[0],p[1]))), {padding:[pad||24,pad||24]});
}

/* --- 区域を描く --- */
function drawAreas(){
  gArea.clearLayers();
  /* 配るときは、いま開いている区画だけをはっきり出す。
     ほかは向きが分かる程度の細い線にとどめ、押し間違いも防ぐ */
  if(S.view==="go"){
    for(const a of areaList()){
      const ring=ringOf(a); if(ring.length<3) continue;
      if(a.id===S.activeAreaId) continue;
      if(!a.parent && childrenOf(a.id).length) continue;
      L.polygon(ring, {color:"#98A1B8", weight:1, opacity:.45, fill:false, interactive:false}).addTo(gArea);
    }
    const act=S.areas[S.activeAreaId], ring=act?ringOf(act):[];
    if(ring.length>=3){
      const c = act.uid ? memberColor(act.uid) : "#59627E";
      L.polygon(ring, {color:c, weight:3, opacity:.95, fillColor:c, fillOpacity:0.04, interactive:false}).addTo(gArea);
    }
    return;
  }
  for(const a of parents()){
    const ring=ringOf(a); if(ring.length<3) continue;
    const sel = S.activeAreaId===a.id;
    L.polygon(ring, {color:"#14182B", weight:sel?3:2, opacity:.75, dashArray:"7 5",
                     fill:true, fillOpacity:0.02, interactive:true})
      .on("click", ()=>selectArea(a.id))
      .addTo(gArea);
  }
  for(const a of areaList().filter(x=>x.parent)){
    const ring=ringOf(a); if(ring.length<3) continue;
    const c = a.uid ? memberColor(a.uid) : "#98A1B8";
    const sel = S.activeAreaId===a.id;
    const poly = L.polygon(ring, {color:c, weight:sel?4:2, opacity:sel?1:.85,
                     fillColor:c, fillOpacity: sel?0.07:0.16, interactive:true})
      .on("click", ()=>selectArea(a.id))
      .addTo(gArea);
    poly.bindTooltip((a.name||"区画")+"／"+memberName(a.uid), {direction:"center", className:"unitlabel"});
  }
}

/* --- 単位を描く --- */
function drawUnits(){
  gUnit.clearLayers(); S.unitLayers={};
  if(S.view!=="go") return;          /* 準備のときは形だけを見せる */
  const area = S.areas[S.activeAreaId];
  if(!area || !S.units.length) return;
  for(const u of S.units){
    const st = (S.stat[u.id] && S.stat[u.id].s) || ST_TODO;
    const col = ST_COLOR[st];
    let layer;
    if(u.t==="road"){
      layer = L.polyline(u.g, {color:col, weight: st===ST_TODO?5:7, opacity: st===ST_TODO?.75:.92, lineCap:"round"});
    }else if(u.t==="block"){
      layer = L.polygon(u.g, {color:col, weight:1.2, opacity:.9, fillColor:col, fillOpacity: st===ST_TODO?0.12:0.42});
    }else{
      layer = L.circleMarker(u.g[0], {radius: st===ST_TODO?5:6, color:"#fff", weight:1.4,
                                      fillColor:col, fillOpacity:1});
    }
    layer.on("click", e=>{ L.DomEvent.stop(e); tapUnit(u.id); });
    layer.addTo(gUnit);
    S.unitLayers[u.id]=layer;
  }
}
function restyleUnit(u){
  const layer=S.unitLayers[u.id]; if(!layer) return;
  const st=(S.stat[u.id] && S.stat[u.id].s)||ST_TODO, col=ST_COLOR[st];
  if(u.t==="road") layer.setStyle({color:col, weight: st===ST_TODO?5:7, opacity: st===ST_TODO?.75:.92});
  else if(u.t==="block") layer.setStyle({color:col, fillColor:col, fillOpacity: st===ST_TODO?0.12:0.42});
  else layer.setStyle({fillColor:col});
}

/* =========================================================================
   9. 囲って描く
   ========================================================================= */
const Draw = {
  on:false, kind:"tap", snap:true, pts:[], line:null, verts:[], cb:null, tracing:false,
  start(opts){
    this.on=true; this.kind="tap"; this.pts=[]; this.cb=opts.onDone;
    this.snap = opts.snap!==false;
    $("#drawbar").classList.remove("hide");
    $("#drawTitle").textContent = opts.title||"区域を囲む";
    $("#drawHelp").textContent  = opts.help||"タップして角を置く";
    document.body.classList.add("drawing");
    setTimeout(()=>{
      map.invalidateSize();
      /* 地図の出典表示が帯に隠れないよう、実際の帯の高さを渡す */
      document.documentElement.style.setProperty("--drawbar-h", $("#drawbar").offsetHeight+"px");
    }, 30);
    this.paint(); this.syncBtns();
    map.on("click", this._click, this);
    map.getContainer().addEventListener("pointerdown", this._down, true);
  },
  syncBtns(){
    $("#drawModeTap").classList.toggle("on", this.kind==="tap");
    $("#drawModeTrace").classList.toggle("on", this.kind==="trace");
    $("#drawSnap").classList.toggle("on", this.snap);
    $("#drawUndo").disabled = this.pts.length===0;
  },
  setKind(k){
    this.kind=k;
    if(k==="trace"){ map.dragging.disable(); map.doubleClickZoom.disable(); }
    else { map.dragging.enable(); map.doubleClickZoom.enable(); }
    this.syncBtns();
    $("#drawHelp").textContent = k==="trace"
      ? "指でなぞる。離すと確定"
      : "タップして角を置く";
  },
  _click(e){ if(this.kind!=="tap") return; this.pts.push([e.latlng.lat, e.latlng.lng]); this.paint(); },
  _down(ev){
    if(!Draw.on || Draw.kind!=="trace") return;
    if(ev.target.closest(".drawbar") || ev.target.closest(".maptools")) return;
    ev.preventDefault(); ev.stopPropagation();
    Draw.tracing=true; Draw.pts=[];
    const move=e=>{
      if(!Draw.tracing) return;
      const ll=map.mouseEventToLatLng(e), p=[ll.lat,ll.lng];
      const last=Draw.pts[Draw.pts.length-1];
      if(!last || distM(last,p)>3){ Draw.pts.push(p); Draw.paint(); }
    };
    const up=()=>{
      Draw.tracing=false;
      window.removeEventListener("pointermove", move, true);
      window.removeEventListener("pointerup", up, true);
      window.removeEventListener("pointercancel", up, true);
      if(Draw.pts.length>4) Draw.finish();
    };
    window.addEventListener("pointermove", move, true);
    window.addEventListener("pointerup", up, true);
    window.addEventListener("pointercancel", up, true);
    move(ev);
  },
  paint(){
    gDraw.clearLayers();
    if(this.pts.length>1)
      L.polygon(this.pts, {color:"#2F5BFF", weight:3, dashArray:"6 4", fillColor:"#2F5BFF", fillOpacity:.08}).addTo(gDraw);
    if(this.kind==="tap")
      this.pts.forEach((p,i)=> L.circleMarker(p,{radius:6,color:"#fff",weight:2,fillColor:"#2F5BFF",fillOpacity:1}).addTo(gDraw));
    $("#drawDone").disabled = this.pts.length<3;
    $("#drawUndo").disabled = this.pts.length===0;
    $("#drawCount").textContent = this.pts.length ? this.pts.length+"点" : "";
  },
  undo(){ this.pts.pop(); this.paint(); },
  stop(){
    this.on=false; this.tracing=false;
    gDraw.clearLayers();
    $("#drawbar").classList.add("hide");
    document.body.classList.remove("drawing");
    setTimeout(()=>map.invalidateSize(), 30);
    map.off("click", this._click, this);
    map.getContainer().removeEventListener("pointerdown", this._down, true);
    map.dragging.enable(); map.doubleClickZoom.enable();
  },
  cancel(){ const cb=this.cb; this.stop(); cb && cb(null); },
  async finish(){
    if(this.pts.length<3) return;
    let ring = simplify(this.pts, 4);
    const cb=this.cb, wantSnap=this.snap;
    this.stop();
    if(wantSnap){
      try{
        toast("道に合わせています…", 9000);
        const bb = padBbox(bboxOf(ring), 150);
        const diag = distM([bb.s,bb.w],[bb.n,bb.e]);
        if(diag > 9000) throw new Error("範囲が広すぎます");
        const ways = await fetchRoads(bb);
        const res = snapRingToRoads(ring, ways);
        ring = res.ring;
        toast(res.snapped===res.total ? "道に合わせました"
              : "道に合わせました（"+res.snapped+"/"+res.total+"区間）", 2600);
      }catch(e){
        toast("道に合わせられませんでした（"+(e.message||e)+"）。描いた形のまま使います。", 4200);
      }
    }
    cb && cb(ring);
  }
};

/* 区域カードの進捗（見える化のため、開いた人が集計を書き戻す） */
Store.patchArea = async function(code, id, patch){
  if(this.remote) await this.base(code).collection("areas").doc(id).set(patch,{merge:true});
  else { const d=Local.read(code); if(d.areas[id]){ Object.assign(d.areas[id], patch); Local.write(code,d); } }
};

/* 地区ぜんたいの合計。親のうち子を持つものは二重に数えないよう外す */
function districtTotal(){
  let t=0, d=0;
  for(const a of areaList()){
    if(!a.parent && childrenOf(a.id).length) continue;
    if(a.id===S.activeAreaId && S.units.length){ const c=countStat(); t+=S.units.length; d+=c[1]; }
    else { t+=a.total|0; d+=a.done|0; }
  }
  return {t, d, pct: t? Math.round(d/t*100) : null};
}
function renderLegend(){
  if(S.view!=="go"){
    const n=areaList().filter(a=>a.parent||!childrenOf(a.id).length).length;
    $("#legend").innerHTML = n? '<span>区画 '+n+'</span>' : '<span>区域をつくってください</span>';
    return;
  }
  const a=S.areas[S.activeAreaId];
  if(!a || !S.units.length){ $("#legend").innerHTML = '<span>区画を選ぶと記録できます</span>'; return; }
  const c=countStat();
  $("#legend").innerHTML =
    ['<span><i class="dot" style="background:'+ST_COLOR[1]+'"></i> 済 '+c[1]+'</span>',
     '<span><i class="dot" style="background:'+ST_COLOR[0]+'"></i> 未 '+c[0]+'</span>',
     '<span><i class="dot" style="background:'+ST_COLOR[2]+'"></i> 対象外 '+c[2]+'</span>'].join("");
}
function countStat(){
  const c={0:0,1:0,2:0};
  for(const u of S.units) c[(S.stat[u.id]&&S.stat[u.id].s)||0]++;
  return c;
}
function progressOf(a){
  const t=a.total|0, d=a.done|0;
  return t? Math.round(d/t*100) : null;
}

/* 仲間の進み具合と居場所。歩きながら見るので1人1行にとどめる */
function statsOf(uid){
  let t=0, d=0, at=0;
  for(const a of areaList()){
    if(a.uid!==uid) continue;
    if(a.id===S.activeAreaId && S.units.length){ const c=countStat(); t+=S.units.length; d+=c[1]; at=Math.max(at,Date.now()); }
    else { t+=a.total|0; d+=a.done|0; at=Math.max(at, a.at|0); }
  }
  return {t, d, at, pct: t? Math.round(d/t*100) : null};
}

async function selectArea(id){
  if(S.offStat){ S.offStat(); S.offStat=null; }
  S.activeAreaId=id; S.units=[]; S.stat={}; S.unitLayers={};
  const a=S.areas[id];
  drawAreas(); drawUnits(); render();
  if(!a) return;
  S.mode = a.mode || "road";
  try{
    const u = await Store.loadUnits(S.code, id, S.mode);
    if(S.activeAreaId!==id) return;
    S.units = u || [];
  }catch(e){ S.units=[]; }
  S.offStat = Store.watchStatus(S.code, id, S.mode, st=>{
    S.stat=st;
    if(Object.keys(S.unitLayers).length) S.units.forEach(restyleUnit); else drawUnits();
    renderMine(); renderLegend(); pushCounts();
  });
  drawUnits(); render();

async function doGenerate(area, again){
  if(S.busy) return;
  if(again && !(await modal('<h2>作り直しますか？</h2><p class="muted">いまの記録（済み・対象外）は消えます。</p>',{ok:"作り直す"}))) return;
  S.busy=true;
  const box = msg => toast(msg, 20000);
  try{
    box("用意しています…");
    const units = await generateUnits({ring:ringOf(area)}, S.mode, {gridSize:area.grid||80}, box);
    if(!units.length){ toast("この範囲では見つかりませんでした。範囲か単位を変えてみてください。", 4000); return; }
    if(units.length>4000){ toast("多すぎます（"+units.length+"）。区域を分けてください。",4500); return; }
    await Store.saveUnits(S.code, area.id, S.mode, units);
    if(again){
      /* 記録を消す */
      if(!Store.remote){ const d=Local.read(S.code); delete d.stat[area.id+"|"+S.mode]; Local.write(S.code,d); }
      else { const col=Store.base(S.code).collection("areas").doc(area.id).collection("stat");
             const s=await col.get(); const b=Store.db.batch();
             s.forEach(x=>{ if(x.id.startsWith(S.mode+"_")) b.delete(x.ref); }); await b.commit(); }
    }
    await Store.patchArea(S.code, area.id, {total:units.length, done:0, skip:0, mode:S.mode});
    S.units=units; S.stat={}; drawUnits(); render();
    toast(MODE_LABEL[S.mode]+"を "+units.length+" 件つくりました");
  }catch(e){
    toast("うまくいきませんでした：" + (e.message||e), 5200);
  }finally{ S.busy=false; }
}

function tapUnit(id){
  const u=S.units.find(x=>x.id===id); if(!u) return;
  const cur=(S.stat[id]&&S.stat[id].s)||ST_TODO;
  const next=(cur+1)%3;
  S.stat[id]=Object.assign({}, S.stat[id]||{}, {s:next, b:S.uid, bn:meMember().name, t:Date.now()});
  restyleUnit(u); renderLegend(); renderMine(); pushCounts();
  Store.setStatus(S.code, S.activeAreaId, S.mode, id, next, meMember().name);
}

/* 位置情報が断られているときは、ただ失敗を出さずに直し方を出す。
   仲間への共有と、端末側の許可は別物なので、そこも書く */
async function geoState(){
  try{
    if(navigator.permissions && navigator.permissions.query)
      return (await navigator.permissions.query({name:"geolocation"})).state;
  }catch(e){}
  return "unknown";
}
function geoHelp(what){
  return modal('<h2>位置情報が使えません</h2>'
    + '<p class="muted"><b>'+esc(what)+'</b>には、この端末で位置情報を許可する必要があります。'
    + 'アプリの中の「現在地を知らせる」とは別の、端末側の設定です。</p>'
    + '<ul class="muted" style="margin:10px 0 0;padding-left:18px">'
    + '<li>LINE などのアプリの中で開いていると、位置情報が使えないことがあります。'
    + '画面右下の <b>…</b> から <b>Safari で開く</b> を試してください（これで通ることが多いです）</li>'
    + '<li>iPhone：設定 → プライバシーとセキュリティ → 位置情報サービス → 使っているブラウザ を'
    + '「このAppの使用中のみ許可」に</li>'
    + '<li>設定を変えたら、このページを開き直してください</li></ul>',
    {noCancel:true, ok:"わかりました"});
}
async function ensureGeo(what){
  if(!navigator.geolocation){ await geoHelp(what); return false; }
  if(await geoState()==="denied"){ await geoHelp(what); return false; }
  return true;
}
/* 断られたときだけ案内を出し、それ以外は短く知らせる */
async function onGeoError(e, what){
  if(e && e.code===1) await geoHelp(what);
  else toast("現在地をとれませんでした（"+((e&&e.message)||"原因不明")+"）", 4500);
}

let watchId=null;
function showMe(p, acc){
  const ll=[p[0],p[1]];
  if(!meMarker){
    meMarker=L.circleMarker(ll,{radius:7,color:"#fff",weight:2.5,fillColor:"#2F5BFF",fillOpacity:1}).addTo(map);
    meCircle=L.circle(ll,{radius:acc||20,color:"#2F5BFF",weight:1,opacity:.35,fillOpacity:.06}).addTo(map);
  }else{ meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc||20); }
}
async function locateOnce(){
  if(!(await ensureGeo("現在地を出すこと"))) return;
  navigator.geolocation.getCurrentPosition(
    p=>{ S.pos=[p.coords.latitude,p.coords.longitude]; showMe(S.pos,p.coords.accuracy); map.setView(S.pos, Math.max(map.getZoom(),17)); },
    e=>onGeoError(e, "現在地を出すこと"),
    {enableHighAccuracy:true, timeout:12000, maximumAge:5000});
}
async function toggleWalk(){
  if(S.autoWalk){ stopWalk(); return; }
  if(!(await ensureGeo("歩いた道の自動記録"))) return;
  S.autoWalk=true;
  watchId=navigator.geolocation.watchPosition(p=>{
    S.pos=[p.coords.latitude,p.coords.longitude]; S.posAcc=p.coords.accuracy;
    showMe(S.pos,p.coords.accuracy);
    if(p.coords.accuracy>40) return;
    autoMark(S.pos, Math.max(14, Math.min(25, p.coords.accuracy)));
  }, e=>{ stopWalk(); onGeoError(e, "歩いた道の自動記録"); },
     {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
  toast("歩いた道を自動で済みにします。画面を消しても続くとは限りません。", 4200);
  renderMine();
}
function stopWalk(){
  S.autoWalk=false;
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId=null; renderMine();
}
function distToSeg(p,a,b){
  const c=ringCenter([a,b]), pr=projector(c[0]);
  const P=pr.to(p), A=pr.to(a), B=pr.to(b);
  const dx=B[0]-A[0], dy=B[1]-A[1], L2=dx*dx+dy*dy;
  let t = L2>0 ? ((P[0]-A[0])*dx+(P[1]-A[1])*dy)/L2 : 0; t=clamp(t,0,1);
  return Math.hypot(P[0]-(A[0]+t*dx), P[1]-(A[1]+t*dy));
}
function autoMark(pos, radius){
  const hits=[];
  for(const u of S.units){
    if((S.stat[u.id]&&S.stat[u.id].s)) continue;
    let hit=false;
    if(u.t==="road"){
      for(let i=0;i<u.g.length-1 && !hit;i++) if(distToSeg(pos,u.g[i],u.g[i+1])<radius) hit=true;
    }else if(u.t==="block"){
      hit = pointInRing(pos, u.g);
    }
    if(hit) hits.push([u.id, ST_DONE]);
  }
  if(!hits.length) return;
  for(const [id] of hits){ S.stat[id]={s:ST_DONE,b:S.uid,bn:meMember().name,t:Date.now()}; }
  S.units.forEach(restyleUnit); renderLegend(); renderMine(); pushCounts();
  Store.setStatusMany(S.code, S.activeAreaId, S.mode, hits, meMember().name);
}
/* =========================================================================
   11b. 現在地の共有（本人が入れたときだけ）
   ========================================================================= */
const SHARE_MAX_MS = 4*3600*1000;   /* 入れっぱなしを防ぐ自動停止 */
const STALE_MS     = 5*60*1000;     /* これより古い位置は薄く出す */
const STILL_MS     = 20*60*1000;    /* これだけ動いていなければ知らせる */
const SEND_EVERY   = 45*1000;
const SEND_MOVE_M  = 25;

function relTime(t){
  if(!t) return "";
  const s=Math.floor((Date.now()-t)/1000);
  if(s<45) return "たった今";
  if(s<3600) return Math.round(s/60)+"分前";
  if(s<86400) return Math.round(s/3600)+"時間前";
  return Math.round(s/86400)+"日前";
}
function minsSince(t){ return Math.floor((Date.now()-t)/60000); }

async function toggleShare(){
  if(S.share){ stopShare(); toast("現在地の共有をやめました"); return; }
  if(!(await ensureGeo("仲間に現在地を知らせること"))) return;
  const ok = await modal('<h2>現在地を仲間に知らせる</h2>'
    + '<p class="muted">入れている間、あなたのいる場所が、この地区の仲間の地図に出ます。'
    + '進んでいない人を手伝いに行ったり、様子がおかしいときに向かうためのものです。</p>'
    + '<ul class="muted" style="margin:10px 0 0;padding-left:18px">'
    + '<li>やめればすぐ消えます。アプリを閉じたときも消えます</li>'
    + '<li>4時間たつと自動で止まります</li>'
    + '<li>知らせるのは、いる場所と時刻だけです</li>'
    + '<li>入れている間、画面に「共有中」が出つづけます</li></ul>',
    {ok:"知らせる", cancel:"やめておく"});
  if(!ok) return;
  startShare();
}
function startShare(){
  S.share=true; S.shareStart=Date.now(); S.shareLast=null; S.shareSent=0; S.shareMoved=Date.now();
  $("#livechip").classList.remove("hide");
  S.shareWatch = navigator.geolocation.watchPosition(p=>{
    const pos=[p.coords.latitude, p.coords.longitude];
    S.pos=pos; S.posAcc=p.coords.accuracy; showMe(pos, p.coords.accuracy);
    if(Date.now()-S.shareStart > SHARE_MAX_MS){ stopShare(); toast("4時間たったので現在地の共有を止めました",5000); return; }
    const moved = S.shareLast ? distM(S.shareLast,pos) : Infinity;
    if(moved > SEND_MOVE_M) S.shareMoved=Date.now();
    if(moved <= SEND_MOVE_M && Date.now()-S.shareSent < SEND_EVERY) return;
    S.shareLast=pos; S.shareSent=Date.now();
    Store.setLive(S.code, {lat:+pos[0].toFixed(5), lng:+pos[1].toFixed(5),
      acc:Math.round(p.coords.accuracy||0), at:Date.now(), mv:S.shareMoved, name:meMember().name||""});
  }, e=>{ stopShare(); onGeoError(e, "仲間に現在地を知らせること"); },
     {enableHighAccuracy:true, maximumAge:5000, timeout:25000});
  renderMine();
}
function stopShare(){
  if(S.shareWatch!=null) navigator.geolocation.clearWatch(S.shareWatch);
  S.shareWatch=null; S.share=false;
  $("#livechip").classList.add("hide");
  Store.clearLive(S.code);
  renderMine();
}

/* 仲間の居場所を地図に出す。古い位置は薄く、動きがないときは印をつける */
function drawLive(){
  gLive.clearLayers();
  for(const uid in S.live){
    if(uid===S.uid) continue;
    const lv=S.live[uid]; if(!lv || typeof lv.lat!=="number") continue;
    const age=Date.now()-(lv.at||0), stale=age>STALE_MS;
    const c=memberColor(uid), nm=(S.members[uid]&&S.members[uid].name)||lv.name||"仲間";
    const still = lv.mv && (Date.now()-lv.mv > STILL_MS);
    L.circleMarker([lv.lat,lv.lng], {radius: stale?7:9, color:"#fff", weight:2.5,
      fillColor: still ? "#B4453F" : c, fillOpacity: stale?0.45:1})
      .bindTooltip(nm+"／"+relTime(lv.at)+(still?"・動きなし":""),
                   {permanent:true, direction:"top", offset:[0,-6], className:"unitlabel"})
      .addTo(gLive);
  }
}

async function markVisibleDone(){

async function removeArea(a){

  if(!(await modal('<h2>「'+esc(a.name||"区域")+'」を消す</h2><p class="muted">'
      +(kids.length? "中の区画 "+kids.length+" 個も一緒に消えます。":"記録も一緒に消えます。")+'</p>',{ok:"消す"}))) return;

async function splitFlow(p){
  const kids=childrenOf(p.id);
  const box = await promptSplit(Object.keys(S.members).length||2, kids.length);
  if(!box) return;
  const ring=ringOf(p);
  const pieces = splitRing(ring, box.n, box.axis);
  if(pieces.length<box.n){ toast("うまく分けられませんでした。形を単純にしてから試してください。",4200); return; }
  if(box.replace) for(const k of kids) await Store.deleteArea(S.code, k.id);
  const uids=Object.keys(S.members);
  let i=0;
  for(const piece of pieces){
    await Store.saveArea(S.code, {
      name:(p.name||"区域")+"-"+String.fromCharCode(65+i),
      parent:p.id, ring:piece, mode:"road", grid:80,
      uid: box.assign && uids[i] ? uids[i] : ""
    });
    i++;
  }
  toast(box.n+" つに分けました");
}

  S.code=code; S.uid=Store.uid; S.viewInit=false;
  pushRecent(code, pj.name);
  location.hash = code;
  if(S.offLive) S.offLive();
  S.offLive = Store.watchLive(code, live=>{ S.live=live||{}; drawLive(); renderMine(); renderMembers(); });
  S.off = Store.watch(code, snap=>{
    S.project = snap.project; S.members = snap.members||{}; S.areas = snap.areas||{};
    if(!S.project) return;
    drawAreas(); render();
    if(!S.activeAreaId){
      const mine=areaList().filter(a=>a.parent && a.uid===S.uid);
      const first = mine[0] || areaList().filter(a=>a.parent)[0] || areaList()[0];
      if(first){ selectArea(first.id); }
      else {
        const all=areaList().map(a=>ringOf(a)).flat();
        if(all.length) fitRing(all);
      }
    }
    /* 最初の1回だけ、どちらの画面で始めるかを決める。
       担当の区画があれば「配る」、無ければ「準備」から。前回の選択があればそれを継ぐ */
    if(!S.viewInit){
      S.viewInit = true;
      const saved = localStorage.getItem(LS_PREFIX+"view:"+code);
      const mine  = areaList().filter(a=>a.parent && a.uid===S.uid);
      setView(saved || (mine.length ? "go" : "prep"));
    }
  });
  showScreen("app");
  return true;
}

function renderRecents(){
  const list=recents();
  if(!list.length) return;
  $("#recentCard").classList.remove("hide");
  $("#recentList").innerHTML = list.map(r=>
    '<div class="item"><div class="hd"><b>'+esc(r.name||"（名前なし）")+'</b>'
    + '<span class="pill mono">'+esc(r.code)+'</span>'
    + '<button class="btn sm" data-open="'+esc(r.code)+'">ひらく</button></div></div>').join("");
  $$("[data-open]", $("#recentList")).forEach(b=> b.onclick=async()=>{
    const code=b.dataset.open;
    const prev = localStorage.getItem(LS_PREFIX+"name") || "";
    const nm = prev || await promptText("あなたの名前","例：山田");
    if(nm===null) return;
    localStorage.setItem(LS_PREFIX+"name", nm);
    await openProject(code, nm);
  });
}

/* =========================================================================
   13. 起動
   ========================================================================= */
async function boot(){
  initMap();

  /* ホーム */
  $("#btnCreate").onclick = async ()=>{
    const name=$("#newName").value.trim(), me=$("#newMe").value.trim();
    if(!name){ toast("地区の名前を入れてください"); return; }
    if(!me){ toast("あなたの名前を入れてください"); return; }
    localStorage.setItem(LS_PREFIX+"name", me);
    const {code} = await Store.createProject(name, me);
    await openProject(code, me);
    await modal('<h2>できました</h2>'
      + '<p class="muted">仲間にこの合言葉コードを伝えてください。</p>'
      + '<p class="codein mono" style="margin:12px 0">'+esc(code)+'</p>'
      + '<p class="muted">あなたが管理者です。ほかの人を管理者にするときは「仲間」タブから。</p>',
      {noCancel:true, ok:"はじめる"});
    setTab("areas");
  };
  $("#btnJoin").onclick = async ()=>{
    const code=$("#joinCode").value.trim().toUpperCase(), me=$("#joinMe").value.trim();
    if(code.length!==6){ toast("コードは6文字です"); return; }
    if(!me){ toast("あなたの名前を入れてください"); return; }
    localStorage.setItem(LS_PREFIX+"name", me);
    await openProject(code, me);
  };
  $("#joinCode").addEventListener("input", e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  const savedName = localStorage.getItem(LS_PREFIX+"name")||"";
  if(savedName){ $("#newMe").value=savedName; $("#joinMe").value=savedName; }
  renderRecents();

  /* 上のバー */
  $("#btnHome").onclick = ()=>{ if(S.share) stopShare(); location.hash=""; showScreen("home"); renderRecents(); };
  $("#btnStopShare").onclick = ()=>{ stopShare(); toast("現在地の共有をやめました"); };
  $$("#modesw button").forEach(b=> b.onclick=()=>setView(b.dataset.view));
  $("#btnMenu").onclick = async ()=>{
    const ok = await modal('<h2>この地区について</h2>'
      + '<p class="muted">名前：'+esc(S.project.name)+'<br>コード：<b class="mono">'+esc(S.code)+'</b><br>'
      + '保存先：'+(Store.remote?"Firebase（仲間と共有）":"この端末だけ")+'</p>'
      + '<p class="muted" style="margin-top:10px">区域や記録の元データを書き出せます。</p>',
      {ok:"データを書き出す", cancel:"閉じる"});
    if(ok) exportJSON();
  };

  /* 地図ツール */
  $("#btnLocate").onclick = locateOnce;
  $("#btnFit").onclick = ()=>{
    const a=S.areas[S.activeAreaId];
    if(a) fitRing(ringOf(a));
    else { const all=areaList().map(x=>ringOf(x)).flat(); if(all.length) fitRing(all); }
  };
  $("#btnBase").onclick = async ()=>{
    const names={pale:"淡色地図",std:"標準地図",photo:"航空写真",osm:"OpenStreetMap"};
    const ok=await modal('<h2>地図の種類</h2>'+Object.keys(names).map(k=>
      '<label class="fld"><span><input type="radio" name="bs" value="'+k+'"'+(k===baseName?" checked":"")+'> '+names[k]+'</span></label>').join(""),
      {ok:"変える", onOpen:box=>{ box.querySelector('[data-x="1"]').addEventListener("click",()=>{
        const v=box.querySelector('input[name=bs]:checked'); if(v) setBase(v.value); },true); }});
  };

  /* 描画バー */
  $("#drawModeTap").onclick   = ()=>Draw.setKind("tap");
  $("#drawModeTrace").onclick = ()=>Draw.setKind("trace");
  $("#drawSnap").onclick      = ()=>{ Draw.snap=!Draw.snap; Draw.syncBtns(); };
  $("#drawUndo").onclick      = ()=>Draw.undo();
  $("#drawCancel").onclick    = ()=>Draw.cancel();
  $("#drawDone").onclick      = ()=>Draw.finish();

  /* タブ */
  $$(".tabs button").forEach(b=> b.onclick=()=>setTab(b.dataset.tab));

  /* パネルの高さを引っぱって変える */
  /* パネルは開くか、たたむかの2つだけ。いま押すと何が起きるかを文字で出す */
  const grab=$("#grabber"), panel=$("#panel");
  window.setPanelOpen = open=>{
    panel.classList.toggle("collapsed", !open);
    $("#grabTxt").textContent = open ? "地図を広く" : "一覧を出す";
    $("#grabIco").textContent = open ? "▼" : "▲";
    setTimeout(()=>map.invalidateSize(), 30);
  };
  grab.addEventListener("click", ()=> setPanelOpen(panel.classList.contains("collapsed")));
  setPanelOpen(true);

  /* データの保存先 */
  await Store.init();
  S.uid = Store.uid;
  if(!Store.remote){
    const b=$("#modeBanner"); b.classList.remove("hide");
    b.innerHTML = HAS_FB
      ? '<b>この端末だけのモードで動いています。</b><br>'+esc(Store.fbError||"Firebase につながりません")+'。記録は仲間と共有されません。'
      : '<b>まだ共有の設定がされていません。</b><br>いまは記録がこの端末の中だけに残ります。'
        + 'Firebase の設定を入れると、仲間とその場で共有できるようになります（README を参照）。';
  }

  /* URL の #コード から開く */
  const h=(location.hash||"").replace("#","").trim().toUpperCase();
  if(h.length===6){
    const nm = localStorage.getItem(LS_PREFIX+"name") || "";
    if(nm) await openProject(h, nm);
    else { $("#joinCode").value=h; $("#joinMe").focus(); }
  }
}

function exportJSON(){
  const data = {app:APP_ID, code:S.code, project:S.project, members:S.members,
                areas:areaList().map(a=>Object.assign({}, a, {ring:ringOf(a)})),
                activeUnits:{areaId:S.activeAreaId, mode:S.mode, units:S.units, stat:S.stat}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="chirashi-map-"+S.code+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* 画面を閉じたら現在地の共有も止める（置き去りにしない） */
function onLeave(){ if(S.autoWalk) stopWalk(); if(S.share) Store.clearLive(S.code); }
window.addEventListener("beforeunload", onLeave);
window.addEventListener("pagehide", onLeave);
/* 「◯分前」の表示を1分ごとに更新する */
setInterval(()=>{ if(S.project && Object.keys(S.live).length){ drawLive(); renderMine(); renderMembers(); } }, 60000);

boot().catch(e=>{ console.error(e); toast("起動できませんでした："+(e.message||e), 8000); });
</script>
</body>
</html>
