<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学でGo!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #FAF6F0;
            --color-surface: #FFFFFF;
            --color-surface-alt: #F6F1E9;
            --color-primary: #C9748A;
            --color-primary-dark: #B15F76;
            --color-primary-soft: #F6E7EA;
            --color-text: #3D332C;
            --color-text-soft: #8A7C6E;
            --color-border: #EAE1D4;
            --color-success: #5F8F6E;
            --color-success-soft: #E9F3EA;
            --color-danger: #B75F53;
            --color-danger-soft: #FBECE8;
            --color-gold: #B08F4C;
            --color-gold-soft: #F5EFDC;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: var(--color-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            padding: 1.5rem 1rem;
        }

        .game-container {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 34px rgba(61, 51, 44, 0.09);
            border: 1px solid var(--color-border);
            padding: 2.2rem 2rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1.3rem;
            letter-spacing: 0.02em;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background: var(--color-surface-alt);
            padding: 1rem 0.8rem;
            border-radius: var(--radius-md);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--color-text-soft);
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .timer {
            color: var(--color-danger) !important;
        }

        .life-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.15rem;
        }

        .life-heart {
            font-size: 1.3rem;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        .life-heart.lost {
            filter: grayscale(1);
            opacity: 0.3;
        }

        .life-heart.losing {
            animation: loseLife 0.7s ease-out forwards;
        }

        @keyframes loseLife {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0.3; filter: grayscale(1); }
        }

        .current-level {
            background: var(--color-primary-soft);
            padding: 0.45rem 1.1rem;
            border-radius: 999px;
            color: var(--color-primary-dark);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--color-surface-alt);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .question-area {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.8rem;
            margin-bottom: 1.6rem;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.7;
            margin-bottom: 1.3rem;
            color: var(--color-text);
            text-align: left;
        }

        .sub-questions-container {
            margin-top: 0.4rem;
            text-align: left;
        }

        .sub-question {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.8rem;
            position: relative;
            transition: all 0.25s ease;
        }

        .sub-question.correct {
            border-color: #B9D8BF;
            background: var(--color-success-soft);
        }

        .sub-question.incorrect {
            border-color: #E8BDB5;
            background: var(--color-danger-soft);
        }

        .sub-question-text {
            font-size: 1.02rem;
            font-weight: 500;
            margin-bottom: 0.6rem;
            color: var(--color-text);
        }

        .sub-question-input {
            width: 100%;
            padding: 0.7rem;
            font-size: 1rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            transition: border-color 0.25s ease;
        }

        .sub-question-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .sub-question-input:disabled {
            background: var(--color-surface-alt);
            color: var(--color-text-soft);
        }

        .sub-question-status {
            position: absolute;
            top: 0.6rem;
            right: 0.8rem;
            font-size: 1.2rem;
        }

        .question-progress {
            background: var(--color-primary-soft);
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            color: var(--color-primary-dark);
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: inline-block;
        }

        .hint-section {
            margin-bottom: 1.3rem;
        }

        .hint-toggle {
            background: var(--color-gold);
            border: none;
            padding: 0.7rem 1.3rem;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #FFFDF8;
            transition: all 0.2s ease;
            margin-bottom: 0.8rem;
        }

        .hint-toggle:hover {
            background: #9A7A3D;
        }

        .hint-text {
            font-size: 1.05rem;
            color: #8A6A2E;
            font-weight: 700;
            background: var(--color-gold-soft);
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            border: 1px dashed #D8C48E;
            display: none;
        }

        .input-area {
            margin-bottom: 1.6rem;
        }

        .answer-input {
            width: 100%;
            padding: 0.85rem;
            font-size: 1.1rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            text-align: center;
            transition: border-color 0.25s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .answer-input.incorrect {
            border-color: var(--color-danger);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 20%, 40%, 60%, 80% { transform: translateX(0); }
            10%, 30%, 50%, 70% { transform: translateX(-5px); }
        }

        .buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 1.6rem;
        }

        .btn {
            padding: 0.85rem 1.7rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background: var(--color-success);
            color: white;
        }

        .btn-submit:hover {
            background: #4C7A5A;
        }

        .btn-submit:disabled {
            background: #D6D0C6;
            cursor: not-allowed;
        }

        .btn-start {
            background: var(--color-primary);
            color: white;
            padding: 1.1rem 2.6rem;
            font-size: 1.15rem;
            border-radius: 999px;
        }

        .btn-start:hover {
            background: var(--color-primary-dark);
        }

        .btn-back {
            background: var(--color-surface-alt);
            color: var(--color-text-soft);
            padding: 0.85rem 1.7rem;
            font-size: 1rem;
            margin-bottom: 1.6rem;
            border: 1px solid var(--color-border);
        }

        .btn-back:hover {
            background: #EEE6D8;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.6rem;
        }

        .level-btn {
            background: var(--color-surface);
            color: var(--color-primary-dark);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-primary);
            border-radius: var(--radius-sm);
            padding: 1rem 0.6rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .level-btn:hover {
            background: var(--color-primary-soft);
        }

        .level-btn.master-level {
            border-left-color: var(--color-gold);
            color: #8A6A2E;
            grid-column: 2;
            font-size: 0.95rem;
        }

        .level-btn.master-level:hover {
            background: var(--color-gold-soft);
        }

        .level-description {
            font-size: 0.78rem;
            margin-top: 0.35rem;
            color: var(--color-text-soft);
            font-weight: 500;
        }

        .question-count-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.6rem;
        }

        .question-count-btn {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-top: 4px solid var(--color-success);
            border-radius: var(--radius-md);
            padding: 1.6rem 1rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .question-count-btn:hover {
            background: var(--color-success-soft);
        }

        .question-count-btn.count-50 {
            border-top-color: var(--color-gold);
        }

        .question-count-btn.count-50:hover {
            background: var(--color-gold-soft);
        }

        .count-description {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            color: var(--color-text-soft);
            line-height: 1.4;
            font-weight: 500;
        }

        .feedback {
            padding: 0.9rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-weight: 700;
            display: none;
            white-space: pre-line;
        }

        .feedback.correct {
            background: var(--color-success-soft);
            color: var(--color-success);
            border: 1px solid #CFE6D3;
        }

        .feedback.life-lost {
            background: var(--color-danger-soft);
            color: var(--color-danger);
            border: 1px solid #EFCFC9;
        }

        .start-screen {
            text-align: center;
        }

        .question-count-screen {
            text-align: center;
            display: none;
        }

        .level-select-screen {
            text-align: center;
            display: none;
        }

        .start-description {
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 1.8rem;
            color: var(--color-text-soft);
        }

        .game-over {
            display: none;
        }

        .final-score {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .attempt-indicator {
            font-size: 0.82rem;
            color: var(--color-text-soft);
            margin-bottom: 1rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(61, 51, 44, 0.35);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--color-surface);
            padding: 2rem;
            border-radius: var(--radius-md);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 1rem;
        }

        .modal-message {
            font-size: 0.98rem;
            color: var(--color-text-soft);
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.75rem 1.4rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-confirm {
            background: var(--color-danger);
            color: white;
        }

        .modal-btn-confirm:hover {
            background: #A34F44;
        }

        .modal-btn-cancel {
            background: var(--color-surface-alt);
            color: var(--color-text-soft);
        }

        .modal-btn-cancel:hover {
            background: #EEE6D8;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.6rem;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .buttons {
                flex-direction: column;
                gap: 0.6rem;
            }
            
            .stats {
                flex-wrap: wrap;
                gap: 0.8rem;
            }

            .level-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .level-btn.master-level {
                grid-column: span 2;
            }

            .question-count-grid {
                grid-template-columns: 1fr;
            }

            .sub-question-text {
                font-size: 0.98rem;
            }

            .sub-question-input {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">教学でGo!</h1>
        
        <div class="start-screen" id="startScreen">
            <p class="start-description">
                仏教の基本的な教えについて学びましょう！<br>
                制限時間内なら何度でも挑戦できます。<br>
                時間切れになるとライフを1つ失います。<br>
                ライフが0になるとゲームオーバーです。<br><br>
                <strong>新機能：</strong>複数の小問がある問題では、すべての小問に正解する必要があります。
            </p>
            <button class="btn btn-start" onclick="showLevelSelect()">レベル選択</button>
        </div>

        <div class="level-select-screen" id="levelSelectScreen">
            <p class="start-description">
                挑戦したいレベルを選んでください
            </p>
            
            <div class="level-grid">
                <button class="level-btn" onclick="showQuestionCountSelect(1)">
                    レベル 1
                    <div class="level-description">基本の教え</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(2)">
                    レベル 2
                    <div class="level-description">仏・法・僧</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(3)">
                    レベル 3
                    <div class="level-description">四苦八苦</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(4)">
                    レベル 4
                    <div class="level-description">悟りの道</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(5)">
                    レベル 5
                    <div class="level-description">経典の知識</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(6)">
                    レベル 6
                    <div class="level-description">宗派の教え</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(7)">
                    レベル 7
                    <div class="level-description">修行と実践</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(8)">
                    レベル 8
                    <div class="level-description">歴史と人物</div>
                </button>
                <button class="level-btn" onclick="showQuestionCountSelect(9)">
                    レベル 9
                    <div class="level-description">高度な教理</div>
                </button>
                <button class="level-btn master-level" onclick="startGame('master')">
                    大導師レベル
                    <div class="level-description">総合問題 30問</div>
                </button>
            </div>
            
            <button class="btn btn-back" onclick="showStart()">戻る</button>
        </div>

        <div class="question-count-screen" id="questionCountScreen">
            <p class="start-description">
                <strong id="selectedLevelText">レベル 1</strong> の問題数を選択してください
            </p>
            
            <div class="question-count-grid">
                <button class="question-count-btn" onclick="startGameWithCount(25)">
                    25問
                    <div class="count-description">標準モード<br>適度な挑戦</div>
                </button>
                <button class="question-count-btn count-50" onclick="startGameWithCount(50)">
                    50問
                    <div class="count-description">チャレンジモード<br>本格的な学習</div>
                </button>
            </div>
            
            <button class="btn btn-back" onclick="showLevelSelect()">レベル選択に戻る</button>
        </div>

        <div class="game-screen" id="gameScreen" style="display: none;">
            <div class="current-level" id="currentLevel">レベル 1</div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">スコア</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">問題</div>
                    <div class="stat-value"><span id="currentQ">1</span>/<span id="totalQ">10</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">ライフ</div>
                    <div class="life-display" id="lifeDisplay"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">時間</div>
                    <div class="stat-value timer" id="timer">30</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-area">
                <div class="question-text" id="questionText"></div>
                
                <div class="question-progress" id="questionProgress" style="display: none;"></div>
                
                <div class="single-question-area" id="singleQuestionArea">
                    <div class="hint-section">
                        <button class="hint-toggle" id="hintToggle" onclick="toggleHint()">
                            ひらがなヒントを表示
                        </button>
                        <div class="hint-text" id="hintText"></div>
                    </div>

                    <div class="input-area">
                        <input type="text" class="answer-input" id="answerInput" placeholder="答えを入力してください">
                    </div>
                </div>

                <div class="sub-questions-container" id="subQuestionsContainer" style="display: none;"></div>

                <div class="attempt-indicator" id="attemptIndicator"></div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="buttons">
                <button class="btn btn-submit" id="submitBtn" onclick="submitAnswer()">回答</button>
                <button class="btn btn-back" onclick="confirmRetire()">リタイア</button>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            <h2>ゲーム終了！</h2>
            <div class="final-score" id="finalScore">0</div>
            <p id="resultMessage"></p>
            <button class="btn btn-start" onclick="showLevelSelect()">レベル選択に戻る</button>
            <button class="btn btn-back" onclick="restartGame()" style="margin-left: 1rem;">同じレベルで再挑戦</button>
        </div>

        <div class="modal-overlay" id="confirmModal">
            <div class="modal-content">
                <div class="modal-title">リタイア確認</div>
                <div class="modal-message">
                    本当にリタイアしますか？<br>
                    現在のスコアは失われます。
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-confirm" onclick="retireGame()">リタイアする</button>
                    <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">続ける</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questionsByLevel = {
            1: [
                { question: "仏教を開いた人物は誰ですか？", answer: "ブッダ", hint: "ぶっだ" },
                { question: "お釈迦様の本名は何ですか？", answer: "ゴータマ", hint: "ごーたま" },
                { question: "お釈迦様が悟りを開いた場所にあった木は何ですか？", answer: "菩提樹", hint: "ぼだいじゅ" },
                { 
                    question: "以下の仏教の基本概念について答えてください。",
                    subQuestions: [
                        { question: "仏教で「悟り」を開くことを何と言いますか？", answer: "成仏", hint: "じょうぶつ" },
                        { question: "仏教で「慈悲」とは何を意味しますか？", answer: "慈しみ", hint: "いつくしみ" }
                    ]
                }
            ],
            2: [
                { question: "仏教の「三宝」とは、仏・法・何ですか？", answer: "僧", hint: "そう" },
                { 
                    question: "三宝について詳しく答えてください。",
                    subQuestions: [
                        { question: "「仏」とは何を指しますか？", answer: "覚者", hint: "かくしゃ" },
                        { question: "「法」とは何を指しますか？", answer: "教え", hint: "おしえ" },
                        { question: "「僧」とは何を指しますか？", answer: "修行者", hint: "しゅぎょうしゃ" }
                    ]
                },
                { question: "三宝に帰依することを何と言いますか？", answer: "帰依", hint: "きえ" }
            ],
            3: [
                { question: "人生は苦であるという教えを何と言いますか？", answer: "四苦八苦", hint: "しくはっく" },
                { 
                    question: "四苦について、それぞれ答えてください。",
                    subQuestions: [
                        { question: "生まれることの苦しみを何と言いますか？", answer: "生苦", hint: "しょうく" },
                        { question: "老いることの苦しみを何と言いますか？", answer: "老苦", hint: "ろうく" },
                        { question: "病気の苦しみを何と言いますか？", answer: "病苦", hint: "びょうく" },
                        { question: "死ぬことの苦しみを何と言いますか？", answer: "死苦", hint: "しく" }
                    ]
                }
            ],
            4: [
                { question: "仏教の「八正道」の最初は「正見」ですが、正しい何のことですか？", answer: "見解", hint: "けんかい" },
                { 
                    question: "八正道の主要な要素について答えてください。",
                    subQuestions: [
                        { question: "「正語」とは正しい何のことですか？", answer: "言葉", hint: "ことば" },
                        { question: "「正業」とは正しい何のことですか？", answer: "行い", hint: "おこない" },
                        { question: "「正念」とは正しい何のことですか？", answer: "思念", hint: "しねん" }
                    ]
                },
                { question: "八正道の「正定」とは正しい何のことですか？", answer: "瞑想", hint: "めいそう" }
            ],
            5: [
                { question: "仏教の経典の一つで「般若心経」の「般若」とは何を意味しますか？", answer: "智慧", hint: "ちえ" },
                { question: "「法華経」の正式名称は何ですか？", answer: "妙法蓮華経", hint: "みょうほうれんげきょう" },
                { 
                    question: "主要な経典とその関連宗派について答えてください。",
                    subQuestions: [
                        { question: "「阿弥陀経」は何宗の重要な経典ですか？", answer: "浄土宗", hint: "じょうどしゅう" },
                        { question: "経典を集めた三つの部門を何と言いますか？", answer: "三蔵", hint: "さんぞう" }
                    ]
                }
            ],
            6: [
                { question: "仏教の修行法の一つである「座禅」は何宗の修行法ですか？", answer: "禅宗", hint: "ぜんしゅう" },
                { 
                    question: "各宗派の念仏や題目について答えてください。",
                    subQuestions: [
                        { question: "「南無阿弥陀仏」は何宗の念仏ですか？", answer: "浄土宗", hint: "じょうどしゅう" },
                        { question: "「南無妙法蓮華経」を唱える宗派は何ですか？", answer: "日蓮宗", hint: "にちれんしゅう" }
                    ]
                },
                { 
                    question: "日本仏教の開祖について答えてください。",
                    subQuestions: [
                        { question: "真言宗の開祖は誰ですか？", answer: "空海", hint: "くうかい" },
                        { question: "天台宗の開祖は誰ですか？", answer: "最澄", hint: "さいちょう" }
                    ]
                }
            ],
            7: [
                { question: "仏教の基本的な修行を何と言いますか？", answer: "三学", hint: "さんがく" },
                { 
                    question: "三学について詳しく答えてください。",
                    subQuestions: [
                        { question: "戒律を守る修行を何と言いますか？", answer: "持戒", hint: "じかい" },
                        { question: "心を集中させる修行を何と言いますか？", answer: "禅定", hint: "ぜんじょう" },
                        { question: "智慧を得る修行を何と言いますか？", answer: "般若", hint: "はんにゃ" }
                    ]
                },
                { question: "出家者が守る基本的な戒律の数は？", answer: "227", hint: "にひゃくにじゅうなな" }
            ],
            8: [
                { question: "インドから中国に仏教を伝えた僧は誰ですか？", answer: "達磨", hint: "だるま" },
                { 
                    question: "日本への仏教伝来について答えてください。",
                    subQuestions: [
                        { question: "日本に仏教を伝来させた国はどこですか？", answer: "百済", hint: "くだら" },
                        { question: "法隆寺を建立した人物は誰ですか？", answer: "聖徳太子", hint: "しょうとくたいし" }
                    ]
                },
                { question: "奈良の大仏を建立した天皇は誰ですか？", answer: "聖武天皇", hint: "しょうむてんのう" }
            ],
            9: [
                { question: "煩悩の数として有名な数字は何ですか？", answer: "108", hint: "ひゃくはち" },
                { 
                    question: "仏教の高度な概念について答えてください。",
                    subQuestions: [
                        { question: "仏教で「空」とは何を意味しますか？", answer: "実体がない", hint: "じったいがない" },
                        { question: "「諸行無常」の「諸行」とは何を意味しますか？", answer: "すべての現象", hint: "すべてのげんしょう" },
                        { question: "「涅槃」とは何を意味しますか？", answer: "解脱", hint: "げだつ" }
                    ]
                },
                { question: "「菩薩」とは何を意味しますか？", answer: "覚りを求める者", hint: "さとりをもとめるもの" }
            ]
        };

        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timer = null;
        let gameQuestions = [];
        let totalLife = 3;
        let currentLife = 3;
        let hintVisible = false;
        let attempts = 0;
        let currentLevel = 1;
        let selectedQuestionCount = 25;
        let selectedLevel = 1;
        
        let currentSubQuestionAnswers = {};
        let isMultiQuestion = false;
        let subQuestionResetTimeouts = {};

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function showStart() {
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('questionCountScreen').style.display = 'none';
            document.getElementById('levelSelectScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
        }

        function showLevelSelect() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionCountScreen').style.display = 'none';
            document.getElementById('levelSelectScreen').style.display = 'block';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
        }

        function showQuestionCountSelect(level) {
            selectedLevel = level;
            document.getElementById('selectedLevelText').textContent = 'レベル ' + level;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionCountScreen').style.display = 'block';
            document.getElementById('levelSelectScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
        }

        function startGameWithCount(count) {
            selectedQuestionCount = count;
            startGame(selectedLevel);
        }

        function startGame(level = 1) {
            currentLevel = level;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('levelSelectScreen').style.display = 'none';
            document.getElementById('questionCountScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('gameOver').style.display = 'none';
            
            if (level === 'master') {
                document.getElementById('currentLevel').textContent = '大導師レベル';
                let allQuestions = [];
                for (let i = 1; i <= 9; i++) {
                    allQuestions = allQuestions.concat(questionsByLevel[i]);
                }
                gameQuestions = shuffleArray(allQuestions).slice(0, 30);
            } else {
                document.getElementById('currentLevel').textContent = `レベル ${level} (${selectedQuestionCount}問モード)`;
                const levelQuestions = questionsByLevel[level] || questionsByLevel[1];
                gameQuestions = levelQuestions.slice(0, Math.min(selectedQuestionCount, levelQuestions.length));
            }
            
            currentQuestionIndex = 0;
            score = 0;
            currentLife = totalLife;
            
            updateStats();
            updateLifeDisplay();
            showQuestion();
            startTimer();
        }

        function showQuestion() {
            if (currentQuestionIndex >= gameQuestions.length) {
                endGame();
                return;
            }

            const question = gameQuestions[currentQuestionIndex];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('feedback').style.display = 'none';
            
            isMultiQuestion = question.subQuestions && question.subQuestions.length > 0;
            currentSubQuestionAnswers = {};

            Object.values(subQuestionResetTimeouts).forEach(id => clearTimeout(id));
            subQuestionResetTimeouts = {};
            
            if (isMultiQuestion) {
                showMultiQuestion(question);
            } else {
                showSingleQuestion(question);
            }
            
            timeLeft = 30;
            attempts = 0;
            updateStats();
            updateProgress();
            updateAttemptIndicator();
        }

        function showSingleQuestion(question) {
            document.getElementById('singleQuestionArea').style.display = 'block';
            document.getElementById('subQuestionsContainer').style.display = 'none';
            document.getElementById('questionProgress').style.display = 'none';
            
            document.getElementById('hintText').textContent = question.hint;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').classList.remove('incorrect');
            
            hintVisible = false;
            document.getElementById('hintText').style.display = 'none';
            document.getElementById('hintToggle').textContent = 'ひらがなヒントを表示';
            
            updateSubmitButton();
            document.getElementById('answerInput').focus();
        }

        function showMultiQuestion(question) {
            document.getElementById('singleQuestionArea').style.display = 'none';
            document.getElementById('subQuestionsContainer').style.display = 'block';
            document.getElementById('questionProgress').style.display = 'block';
            
            const container = document.getElementById('subQuestionsContainer');
            container.innerHTML = '';
            
            question.subQuestions.forEach((subQ, index) => {
                const subQuestionDiv = document.createElement('div');
                subQuestionDiv.className = 'sub-question';
                subQuestionDiv.id = `subQuestion${index}`;
                
                subQuestionDiv.innerHTML = `
                    <div class="sub-question-status" id="subStatus${index}"></div>
                    <div class="sub-question-text">${index + 1}. ${subQ.question}</div>
                    <input type="text" class="sub-question-input" id="subInput${index}" 
                           placeholder="答えを入力してください" data-index="${index}">
                `;
                
                container.appendChild(subQuestionDiv);
                
                const input = subQuestionDiv.querySelector('.sub-question-input');
                input.addEventListener('input', function() {
                    updateSubmitButton();
                });
            });
            
            updateQuestionProgress();
            updateSubmitButton();

            const firstInput = container.querySelector('.sub-question-input');
            if (firstInput) firstInput.focus();
        }

        function checkSubQuestion(index) {
            const question = gameQuestions[currentQuestionIndex];
            const subQ = question.subQuestions[index];
            const input = document.getElementById(`subInput${index}`);
            const userAnswer = input.value.trim();
            const status = document.getElementById(`subStatus${index}`);
            const subQuestionDiv = document.getElementById(`subQuestion${index}`);

            if (subQuestionResetTimeouts[index]) {
                clearTimeout(subQuestionResetTimeouts[index]);
                delete subQuestionResetTimeouts[index];
            }
            
            if (userAnswer === subQ.answer) {
                currentSubQuestionAnswers[index] = true;
                status.textContent = '✓';
                status.style.color = '#28a745';
                subQuestionDiv.classList.add('correct');
                input.disabled = true;
            } else if (userAnswer !== '') {
                currentSubQuestionAnswers[index] = false;
                status.textContent = '✗';
                status.style.color = '#dc3545';
                subQuestionDiv.classList.add('incorrect');
                
                subQuestionResetTimeouts[index] = setTimeout(() => {
                    if (!currentSubQuestionAnswers[index]) {
                        subQuestionDiv.classList.remove('incorrect');
                        status.textContent = '';
                        input.value = '';
                        delete currentSubQuestionAnswers[index];
                    }
                    delete subQuestionResetTimeouts[index];
                    updateSubmitButton();
                }, 1500);
            }
            
            updateQuestionProgress();
            updateSubmitButton();
        }

        function updateQuestionProgress() {
            const question = gameQuestions[currentQuestionIndex];
            if (!isMultiQuestion) return;
            
            const totalSub = question.subQuestions.length;
            const completedSub = Object.keys(currentSubQuestionAnswers).filter(
                key => currentSubQuestionAnswers[key] === true
            ).length;
            
            document.getElementById('questionProgress').textContent = 
                `小問の進捗: ${completedSub}/${totalSub} 完了`;
        }

        function updateSubmitButton() {
            const submitBtn = document.getElementById('submitBtn');
            
            if (isMultiQuestion) {
                const question = gameQuestions[currentQuestionIndex];
                const totalSub = question.subQuestions.length;
                const completedSub = Object.keys(currentSubQuestionAnswers).filter(
                    key => currentSubQuestionAnswers[key] === true
                ).length;
                
                if (completedSub === totalSub) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'すべて正解！次へ';
                } else {
                    submitBtn.disabled = true;
                    submitBtn.textContent = `残り ${totalSub - completedSub} 問`;
                }
            } else {
                submitBtn.disabled = false;
                submitBtn.textContent = '回答';
            }
        }

        function toggleHint() {
            if (!isMultiQuestion) {
                hintVisible = !hintVisible;
                const hintText = document.getElementById('hintText');
                const hintToggle = document.getElementById('hintToggle');
                
                if (hintVisible) {
                    hintText.style.display = 'block';
                    hintToggle.textContent = 'ひらがなヒントを非表示';
                } else {
                    hintText.style.display = 'none';
                    hintToggle.textContent = 'ひらがなヒントを表示';
                }
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQ').textContent = gameQuestions.length;
            document.getElementById('timer').textContent = timeLeft;
        }

        function updateLifeDisplayWithAnimation() {
            const lifeDisplay = document.getElementById('lifeDisplay');
            lifeDisplay.innerHTML = '';
            
            for (let i = 0; i < totalLife; i++) {
                const heart = document.createElement('span');
                heart.className = 'life-heart';
                heart.textContent = '❤️';
                
                if (i >= currentLife) {
                    heart.classList.add('lost');
                    if (i === currentLife) {
                        heart.classList.add('losing');
                    }
                }
                
                lifeDisplay.appendChild(heart);
            }
        }

        function updateLifeDisplay() {
            const lifeDisplay = document.getElementById('lifeDisplay');
            lifeDisplay.innerHTML = '';
            
            for (let i = 0; i < totalLife; i++) {
                const heart = document.createElement('span');
                heart.className = 'life-heart';
                heart.textContent = '❤️';
                if (i >= currentLife) {
                    heart.classList.add('lost');
                }
                lifeDisplay.appendChild(heart);
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex) / gameQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateAttemptIndicator() {
            const indicator = document.getElementById('attemptIndicator');
            if (attempts === 0) {
                indicator.textContent = '';
            } else {
                indicator.textContent = `挑戦回数: ${attempts}回`;
            }
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            
            timer = setInterval(() => {
                timeLeft--;
                updateStats();
                
                if (timeLeft <= 0) {
                    loseLife();
                }
            }, 1000);
        }

        function submitAnswer() {
            if (isMultiQuestion) {
                const question = gameQuestions[currentQuestionIndex];
                const totalSub = question.subQuestions.length;
                const completedSub = Object.keys(currentSubQuestionAnswers).filter(
                    key => currentSubQuestionAnswers[key] === true
                ).length;
                
                if (completedSub === totalSub) {
                    clearInterval(timer);
                    score += Math.max(20, timeLeft * 2);
                    showFeedback(true, 'すべて正解！');
                    
                    setTimeout(() => {
                        nextQuestion();
                    }, 1500);
                }
            } else {
                const userAnswer = document.getElementById('answerInput').value.trim();
                const correctAnswer = gameQuestions[currentQuestionIndex].answer;
                
                attempts++;
                updateAttemptIndicator();
                
                if (userAnswer === correctAnswer) {
                    clearInterval(timer);
                    score += Math.max(10, timeLeft);
                    showFeedback(true, '正解！');
                    
                    setTimeout(() => {
                        nextQuestion();
                    }, 1500);
                } else {
                    document.getElementById('answerInput').classList.add('incorrect');
                    document.getElementById('answerInput').value = '';
                    
                    setTimeout(() => {
                        document.getElementById('answerInput').classList.remove('incorrect');
                    }, 500);
                }
            }
        }

        function loseLife() {
            clearInterval(timer);
            currentLife--;
            
            let correctAnswerText = '';
            const question = gameQuestions[currentQuestionIndex];
            
            if (isMultiQuestion) {
                correctAnswerText = '正解は：\n';
                question.subQuestions.forEach((subQ, index) => {
                    correctAnswerText += `${index + 1}. ${subQ.answer}\n`;
                });
            } else {
                correctAnswerText = `正解は「${question.answer}」でした。`;
            }
            
            showFeedback(false, `時間切れ！${correctAnswerText}ライフ -1`);
            
            setTimeout(() => {
                updateLifeDisplayWithAnimation();
            }, 500);
            
            if (currentLife <= 0) {
                setTimeout(() => {
                    endGame();
                }, 3000);
            } else {
                setTimeout(() => {
                    nextQuestion();
                }, 3000);
            }
        }

        function showFeedback(isCorrect, message) {
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.textContent = message;
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = message;
                feedback.className = 'feedback life-lost';
            }
            
            feedback.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
            if (currentQuestionIndex < gameQuestions.length && currentLife > 0) {
                startTimer();
            }
        }

        function endGame() {
            clearInterval(timer);
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'block';
            
            document.getElementById('finalScore').textContent = score;
            
            let message = '';
            if (currentLife <= 0) {
                if (currentLevel === 'master') {
                    message = '大導師への道のりはまだ続きます。また挑戦してみましょう。';
                } else {
                    message = 'ライフがなくなってしまいました。もう一度チャレンジしてみましょう。';
                }
            } else if (currentLevel === 'master') {
                if (score >= 800) {
                    message = '見事です。あなたはまさに大導師です。完璧な理解を示してくれました。';
                } else if (score >= 600) {
                    message = '素晴らしい。大導師の域に近づいています。';
                } else if (score >= 400) {
                    message = '良い成績です。大導師への道が見えてきましたね。';
                } else {
                    message = '基礎から一歩ずつ、着実に学んでいきましょう。';
                }
            } else if (score >= 400) {
                message = '素晴らしい。文句なしの好成績です。';
            } else if (score >= 250) {
                message = 'よくできました。高得点です。';
            } else if (score >= 100) {
                message = '基本はしっかり理解できています。この調子で続けましょう。';
            } else {
                message = '仏教の基本から、少しずつ学んでいきましょう。';
            }
            
            document.getElementById('resultMessage').textContent = message;
        }

        function restartGame() {
            startGame(currentLevel);
        }

        function confirmRetire() {
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function retireGame() {
            clearInterval(timer);
            document.getElementById('confirmModal').style.display = 'none';
            showStart();
            currentQuestionIndex = 0;
            score = 0;
            currentLife = 3;
            timeLeft = 30;
            attempts = 0;
            hintVisible = false;
            currentSubQuestionAnswers = {};
            isMultiQuestion = false;

            Object.values(subQuestionResetTimeouts).forEach(id => clearTimeout(id));
            subQuestionResetTimeouts = {};
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('answerInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    submitAnswer();
                }
            });
            
            document.getElementById('subQuestionsContainer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.isComposing && e.target.classList.contains('sub-question-input')) {
                    const index = parseInt(e.target.dataset.index);
                    checkSubQuestion(index);
                }
            });
        });
    </script>
</body>
</html>
