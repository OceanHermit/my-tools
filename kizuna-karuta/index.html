        // エラーハンドリング強化（トースト通知）
        function showError(title, detail) {
            const container = document.getElementById('error-console');
            const id = 'toast-' + Date.now();
            const detailText = typeof detail === 'object' ? (detail.message || JSON.stringify(detail)) : detail;

            const html = `
                <div id="${id}" class="error-toast">
                    <strong>⚠️ ${title}</strong>
                    <span>${detailText}</span>
                    <div style="text-align:right; margin-top:4px;">
                        <button onclick="document.getElementById('${id}').remove()" style="color:#9ca3af; text-decoration:underline; font-size:11px;">閉じる</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            console.error(title, detail);

            // 7秒後に自動消去
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '0';
                    el.style.transition = 'opacity 0.5s';
                    setTimeout(() => el.remove(), 500);
                }
            }, 7000);
        }

        window.onerror = function(msg, url, line, col, error) {
            if (msg === 'Script error.' && line === 0) {
                // 外部スクリプトエラーは頻発するためコンソールのみ
                console.warn('External script error');
            } else {
                showError('JavaScriptエラー', `Message: ${msg}\nLine: ${line}`);
            }
        };
        window.onunhandledrejection = function(e) {
            // キャンセル系エラーは無視
            const reason = e.reason ? (e.reason.message || e.reason) : 'Unknown Error';
            if (typeof reason === 'string' && (reason.includes('cancelled') || reason.includes('Aborted'))) return;
            showError('通信・処理エラー', reason);
        };
    </script>

                            .catch(e => {
                                console.error("Auth Error", e);
                                showError("ログインエラー", e.message + "\n\nFirebase Authenticationで「匿名ログイン」が有効になっているか確認してください。");
                            });
                    }
                });
                return () => {
                    unsubscribe();
                    clearTimeout(timer);
                };
            }, []);

            // 取り札画像URLの事前取得（ログイン後に一度だけ）
            useEffect(() => {
                if (!user) return;
                let cancelled = false;
                fetchTorifudaImageUrls()
                    .then((urls) => { if (!cancelled) setCardImages(urls); })
                    .catch((e) => console.warn("取り札画像のプリロードに失敗", e));
                return () => { cancelled = true; };
            }, [user]);

            useEffect(() => {
                if (!user || !room?.roomId) return;
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);

                const unsubscribe = roomRef.onSnapshot((snapshot) => {
                    if (snapshot.exists) {
                        const roomData = snapshot.data();

                        if (roomData.createdAt) {
                            const created = roomData.createdAt.toMillis ? roomData.createdAt.toMillis() : roomData.createdAt;
                            if (Date.now() - created > 30 * 60 * 1000) {
                                setErrorMsg("ルームの有効期限（30分）が経過したため解散しました。");
                                setRoom(null);
                                setView('landing');
                                return;
                            }
                        }

                        setRoom(roomData);
                        if (roomData.status === 'playing' && view !== 'game') setView('game');
                        if (roomData.status === 'finished' && view !== 'result') setView('result');
                        if (roomData.status === 'waiting' && view !== 'lobby') {
                            setView('lobby');
                            setIsResetting(false);
                        }
                    } else {
                        setRoom(null);
                        setView('landing');
                        setErrorMsg('ルームが存在しないか、解散されました。');
                    }
                }, (error) => {
                    console.error("Room sync error:", error);
                    showError("通信エラー", "データベースとの通信に失敗しました。\n" + error.message);
                });
                return () => unsubscribe();
            }, [user, room?.roomId]);

            useEffect(() => {
                if (!room?.gameState?.lastWinnerId) return;
                if (room.gameState.lastWinnerId !== user.uid) {
                    // 相手が取った瞬間の効果音（読み上げは余韻として最後まで流す＝次の札で自動的に止まる）
                    playSE(seOpponentRef);
                }
            }, [room?.gameState?.lastWinnerId]);

            // 読み札アニメーション ＋ 音声読み上げ
            useEffect(() => {
                if (view !== 'game' || !room?.gameState) return;
                if (introCountdown !== null) return; // 開始カウントダウン中は読み上げない

                const currentCardId = room.gameState.currentReadingId;
                if (!currentCardId) { setDisplayedYomi(''); return; }
                const yomiText = KARUTA_DATA.find(k => k.id === currentCardId)?.yomi || '';

                setDisplayedYomi('');
                playSE(seReadyRef);

                let interval = null;
                const startTimeout = setTimeout(() => {
                    speak(CARD_KANA[currentCardId] || yomiText); // 漢字は誤読するため、フリガナ由来のかなで読み上げる
                    let i = 0;
                    interval = setInterval(() => {
                        i++;
                        if (i <= yomiText.length) {
                            setDisplayedYomi(yomiText.slice(0, i));
                        } else {
                            clearInterval(interval);
                            interval = null;
                        }
                    }, 300);
                }, 1000);

                // 【修正】以前は clearInterval が setTimeout コールバックの戻り値になっていて
                // effect のクリーンアップとして機能せず、札が変わると旧 interval が生き残って
                // 文字がチラついていた。interval を effect スコープに持ち上げて確実に停止する。
                return () => {
                    clearTimeout(startTimeout);
                    if (interval) clearInterval(interval);
                    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
                    setDucking(false); // 札が切り替わってもBGMが絞られたままにならないように
                };
            }, [room?.gameState?.currentReadingId, view, introCountdown]);

            useEffect(() => {
                if (!room || !room.gameState || !room.gameState.resumeAt) {
                    setCountdown(null);
                    return;
                }
                const interval = setInterval(() => {
                    const now = Date.now();
                    const diff = Math.ceil((room.gameState.resumeAt - now) / 1000);
                    if (diff <= 0) {
                        setCountdown(0);
                        if (room.hostId === user.uid && room.gameState.bannedPlayerIds.length > 0) {
                            const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                            roomRef.update({ "gameState.bannedPlayerIds": [], "gameState.resumeAt": null }).catch(console.error);
                        }
                    } else {
                        setCountdown(diff);
                    }
                }, 200);
                return () => clearInterval(interval);
            }, [room?.gameState?.resumeAt, user?.uid]);

            // 次ターンへの自動進行（ホストが監視して進める）。
            // 以前は「取った本人の端末の setTimeout」だけが進行させていたため、
            // 勝者がその数秒間にタブを閉じる/通信断でゲームが永久停止する単一障害点だった。
            // gameState.advanceAt（進行予定時刻）を Firestore に持たせ、ホストが進めることで、
            // 誰の端末が落ちても止まらないようにする。
            useEffect(() => {
                if (!user || !room?.gameState?.advanceAt) return;
                if (room.hostId !== user.uid) return; // 進行役はホストのみ
                const delay = Math.max(0, room.gameState.advanceAt - Date.now());
                const deck = room.gameState.deck;
                const nextIndex = room.gameState.currentCardIndex + 1;
                const roomId = room.roomId;
                const t = setTimeout(() => { nextTurn(roomId, deck, nextIndex); }, delay);
                return () => clearTimeout(t);
            }, [room?.gameState?.advanceAt, room?.hostId, user?.uid]);

            // 開始カウントダウン（ゲーム開始時に一度だけ 3・2・1・はじめ！）
            useEffect(() => {
                if (view !== 'game') { introDoneRef.current = false; setIntroCountdown(null); return; }
                if (introDoneRef.current) return;
                if (!room?.gameState || room.gameState.currentCardIndex !== 0) return;
                introDoneRef.current = true;
                let n = 3;
                setIntroCountdown(n);
                const iv = setInterval(() => {
                    n -= 1;
                    if (n < 0) { clearInterval(iv); setIntroCountdown(null); }
                    else setIntroCountdown(n); // 0 は「はじめ！」表示
                }, 800);
                return () => clearInterval(iv);
            }, [view, room?.gameState?.currentCardIndex]);

            // タブを閉じた/離れた時のベストエフォート退出（無言離脱で相手を待たせない）
            useEffect(() => {
                if (!user || !room?.roomId) return;
                const handler = () => { try { leaveRoom(); } catch (e) {} };
                window.addEventListener('pagehide', handler);
                window.addEventListener('beforeunload', handler);
                return () => {
                    window.removeEventListener('pagehide', handler);
                    window.removeEventListener('beforeunload', handler);
                };
            }, [user, room?.roomId]);

            const joinOrCreateRoom = async (inputRoomId = null, isRandom = false) => {
                if (!playerName.trim()) { setErrorMsg('名前を入力してください'); return; }
                localStorage.setItem('karuta_player_name', playerName);
                setErrorMsg('');
                try {
                    let targetRoomId = inputRoomId;
                    const roomsCollection = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms');

                    if (isRandom) {
                        const q = roomsCollection.where("status", "==", "waiting").where("type", "==", "random");
                        const querySnapshot = await q.get();

                        let validRoomId = null;
                        if (!querySnapshot.empty) {
                            for (const doc of querySnapshot.docs) {
                                const data = doc.data();
                                const created = data.createdAt.toMillis ? data.createdAt.toMillis() : data.createdAt;
                                const players = data.players || [];
                                if (Date.now() - created <= 30 * 60 * 1000 && players.length < 2) {
                                    validRoomId = doc.id;
                                    break;
                                }
                            }
                        }
                        targetRoomId = validRoomId || Math.random().toString(36).substring(2, 8);
                    } else if (!targetRoomId) {
                        targetRoomId = Math.random().toString(36).substring(2, 8);
                    }
                    const roomRef = roomsCollection.doc(targetRoomId);

                    await db.runTransaction(async (transaction) => {
                        const roomDoc = await transaction.get(roomRef);
                        if (!roomDoc.exists) {
                            transaction.set(roomRef, {
                                roomId: targetRoomId, status: 'waiting', hostId: user.uid, type: isRandom ? 'random' : 'private',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                settings: { cardCount: 20 }, players: [{ uid: user.uid, name: playerName, score: 0, joinedAt: Date.now() }],
                                gameState: { deck: [], boardCards: [], currentCardIndex: null, readStartTime: null, correctCardId: null, bannedPlayerIds: [], resumeAt: null }
                            });
                        } else {
                            const data = roomDoc.data();
                            if (data.status !== 'waiting') throw new Error("ゲームは既に進行中です");
                            const created = data.createdAt.toMillis ? data.createdAt.toMillis() : data.createdAt;
                            if (Date.now() - created > 30 * 60 * 1000) throw new Error("このルームは有効期限切れです");

                            const players = data.players || [];
                            if (!players.some(p => p.uid === user.uid)) {
                                const newPlayers = [...players, { uid: user.uid, name: playerName, score: 0, joinedAt: Date.now() }];
                                transaction.update(roomRef, { players: newPlayers });

                                if (isRandom && newPlayers.length === 2) {
                                    const cardCount = Math.min(data.settings?.cardCount || 20, 50);
                                    const shuffledCards = shuffleArray(KARUTA_DATA).slice(0, cardCount);
                                    const boardCardIds = shuffledCards.map(c => c.id);
                                    const deck = shuffleArray([...boardCardIds]);

                                    transaction.update(roomRef, {
                                        status: 'playing',
                                        players: newPlayers.map(p => ({ ...p, score: 0 })),
                                        gameState: {
                                            deck: deck,
                                            boardCards: boardCardIds,
                                            currentCardIndex: 0,
                                            currentReadingId: deck[0],
                                            readStartTime: Date.now(),
                                            lastWinnerId: null,
                                            bannedPlayerIds: [],
                                            resumeAt: null,
                                            advanceAt: null
                                        }
                                    });
                                }
                            }
                        }
                    });
                    setRoom({ roomId: targetRoomId, type: isRandom ? 'random' : 'private' });
                } catch (err) {
                    console.error(err);
                    setErrorMsg(err.message || "ルームへの参加に失敗しました");
                    showError("参加エラー", err.message);
                }
            };

            const updateSettings = async (newSettings) => {
                if (!room || room.hostId !== user.uid) return;
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                await roomRef.update({ settings: { ...room.settings, ...newSettings } });
            };
            const transferHost = async (newHostId) => {
                if (!room || room.hostId !== user.uid) return;
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                await roomRef.update({ hostId: newHostId });
            };
            const startGame = async () => {
                if (!room || room.hostId !== user.uid) return;
                const cardCount = Math.min(room.settings.cardCount || 20, 50);
                const shuffledCards = shuffleArray(KARUTA_DATA).slice(0, cardCount);
                const boardCardIds = shuffledCards.map(c => c.id);
                const deck = shuffleArray([...boardCardIds]);
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                const resetPlayers = room.players.map(p => ({ ...p, score: 0 }));

                await roomRef.update({
                    status: 'playing', players: resetPlayers,
                    gameState: {
                        deck: deck,
                        boardCards: boardCardIds,
                        currentCardIndex: 0,
                        currentReadingId: deck[0],
                        readStartTime: Date.now(),
                        lastWinnerId: null,
                        bannedPlayerIds: [],
                        resumeAt: null,
                        advanceAt: null
                    }
                });
            };
            const nextTurn = async (roomId, deck, nextIndex) => {
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(roomId);
                if (nextIndex >= deck.length) { await roomRef.update({ status: 'finished', "gameState.advanceAt": null }); return; }
                const nextCardId = deck[nextIndex];
                await roomRef.update({
                    "gameState.currentCardIndex": nextIndex,
                    "gameState.currentReadingId": nextCardId,
                    "gameState.readStartTime": Date.now(),
                    "gameState.lastWinnerId": null,
                    "gameState.bannedPlayerIds": [],
                    "gameState.resumeAt": null,
                    "gameState.advanceAt": null
                });
            };
            const handleCardClick = async (cardId) => {
                if (!room || room.status !== 'playing') return;
                if (introCountdown !== null) return; // 開始カウントダウン中は取れない
                const { gameState } = room;
                if (gameState.lastWinnerId) return; // 既に取られた札の待機中は無効
                if (gameState.resumeAt || (gameState.bannedPlayerIds && gameState.bannedPlayerIds.includes(user.uid))) return;

                if (gameState.currentReadingId !== cardId) {
                    playSE(seMissRef);
                }

                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                try {
                    await db.runTransaction(async (transaction) => {
                        const sfDoc = await transaction.get(roomRef);
                        if (!sfDoc.exists) throw "Room does not exist!";
                        const data = sfDoc.data();
                        const currentBoard = data.gameState.boardCards;
                        const currentBans = data.gameState.bannedPlayerIds || [];
                        if (data.gameState.resumeAt) throw "Game paused";
                        if (currentBans.includes(user.uid)) throw "You are banned";
                        if (data.gameState.currentReadingId !== cardId) {
                            const newBans = [...currentBans, user.uid];
                            const updates = { "gameState.bannedPlayerIds": newBans };
                            if (newBans.length >= data.players.length) updates["gameState.resumeAt"] = Date.now() + 4000;
                            transaction.update(roomRef, updates);
                            return;
                        }
                        if (!currentBoard.includes(cardId)) throw "Card already taken";
                        const newBoard = currentBoard.filter(id => id !== cardId);
                        const players = data.players.map(p => p.uid === user.uid ? { ...p, score: p.score + 1 } : p);

                        // 次ターンへ進む予定時刻を Firestore に記録（進行はホストが担当）。
                        // 「読み上げ完了までの推定時間」と「取得後の余韻(3秒)」の長い方を採用し、
                        // 途中で取られても読み上げが最後まで流れてから次へ進むようにする。
                        const yomi = KARUTA_DATA.find(k => k.id === cardId)?.yomi || "";
                        const readingDuration = 1000 + (yomi.length * 300);
                        const timeSinceStart = Date.now() - data.gameState.readStartTime;
                        const remainingReadingTime = Math.max(0, readingDuration - timeSinceStart);
                        const waitTime = Math.max(3000, remainingReadingTime + 1000);

                        transaction.update(roomRef, {
                            "gameState.boardCards": newBoard,
                            "gameState.lastWinnerId": user.uid,
                            "players": players,
                            "gameState.advanceAt": Date.now() + waitTime
                        });
                    });

                    // 自分が正解の札を取れた場合の効果音（進行は advanceAt を見てホストが行う）
                    if (gameState.currentReadingId === cardId) {
                        playSE(seGetRef);
                    }
                } catch (e) { console.log("Action failed:", e); }
            };
            const leaveRoom = async () => {
                setShowConfirmModal(false);
                if (!room) return;
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);

                setRoom(null);
                setView('landing');

                try {
                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(roomRef);
                        if (!doc.exists) return;

                        const data = doc.data();
                        const newPlayers = data.players.filter(p => p.uid !== user.uid);

                        if (newPlayers.length === 0 || (data.type === 'private' && data.hostId === user.uid)) {
                            transaction.delete(roomRef);
                        } else {
                            let updates = { players: newPlayers };
                            if (data.hostId === user.uid) {
                                updates.hostId = newPlayers[0].uid;
                            }
                            transaction.update(roomRef, updates);
                        }
                    });
                } catch (error) {
                    console.error("Error leaving room:", error);
                }
            };
            const returnToLobby = async () => {
                setShowConfirmModal(false);
                if (!room || room.hostId !== user.uid) return;
                const roomRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('rooms').doc(room.roomId);
                await roomRef.update({ status: 'waiting' });
            };

            if (!user) return <LoadingScreen message={longLoading ? "接続に時間がかかっています。\nFirebase設定やネットワーク環境を確認してください。\n画面上部にエラーが表示されていないかも確認してください。" : null} />;

            if (view === 'landing') {
                return (
                    <div className="min-h-screen bg-stone-100 flex flex-col items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-xl shadow-xl overflow-hidden">
                            <div className="bg-red-600 p-6 text-center"><h1 className="text-3xl font-bold text-white mb-2" style={{ fontFamily: '"Noto Serif JP", serif' }}>キズナかるた</h1><p className="text-red-100 text-sm">オンライン対戦</p></div>
                            <div className="p-8 space-y-6">
                                <div><label className="block text-sm font-medium text-stone-700 mb-2">プレイヤー名</label><input type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="名前を入力" className="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none transition" /></div>
                                <div className="grid gap-4">
                                    <button onClick={() => joinOrCreateRoom(null, true)} className="flex items-center justify-center gap-2 w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold transition shadow-md active:transform active:scale-95"><Icon path={Icons.Shuffle} size={20} /> ランダムマッチに参加</button>
                                    <div className="relative"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-stone-200"></div></div><div className="relative flex justify-center text-sm"><span className="px-2 bg-white text-stone-500">または</span></div></div>
                                    <div className="flex gap-2"><div className="relative flex-1"><div className="absolute left-3 top-3.5 text-stone-400"><Icon path={Icons.Hash} size={18} /></div><input id="room-code" type="text" placeholder="ルームID" className="w-full pl-10 p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 outline-none" /></div><button onClick={() => joinOrCreateRoom(document.getElementById('room-code').value, false)} className="bg-stone-800 hover:bg-stone-900 text-white px-6 rounded-lg font-bold transition">入室</button></div>
                                </div>
                                {errorMsg && <p className="text-red-500 text-center text-sm bg-red-50 p-2 rounded">{errorMsg}</p>}
                            </div>
                        </div>
                    </div>
                );
            }
            if (view === 'lobby' && room) {
                if (!room.players) return <LoadingScreen />;
                const isHost = room.hostId === user.uid;

                if (room.type === 'random' && room.players.length < 2) {
                    return (
                        <div className="min-h-screen bg-stone-100 flex flex-col items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl p-8 max-w-md w-full text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse"><Icon path={Icons.Users} size={32} /></div>
                                <h2 className="text-2xl font-bold text-stone-800 mb-2">対戦相手を探しています</h2>
                                <p className="text-stone-500 mb-8">しばらくお待ちください...</p>
                                <button onClick={leaveRoom} className="w-full py-3 text-stone-500 font-bold hover:bg-stone-100 rounded-lg transition">キャンセル</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-stone-100 flex flex-col items-center p-4">
                        <header className="w-full max-w-2xl bg-white shadow-sm rounded-lg p-4 mb-6 flex justify-between items-center"><div><span className="text-xs text-stone-500 font-bold tracking-wider">ROOM ID</span><h2 className="text-2xl font-mono font-bold text-stone-800">{room.roomId}</h2></div><button onClick={leaveRoom} className="flex items-center gap-1 bg-stone-100 hover:bg-stone-200 text-stone-600 px-3 py-2 rounded-lg transition font-bold text-sm"><Icon path={Icons.Home} size={18} /> ホームへ</button></header>
                        <div className="w-full max-w-2xl grid gap-6 md:grid-cols-2">
                            <div className="bg-white rounded-xl shadow p-6"><h3 className="flex items-center gap-2 font-bold text-stone-700 mb-4 pb-2 border-b"><Icon path={Icons.Users} size={18} /> 参加者 ({room.players.length})</h3><ul className="space-y-3">{room.players.map(p => (<li key={p.uid} className="flex items-center justify-between p-2 bg-stone-50 rounded-lg"><div className="flex items-center gap-2">{p.uid === room.hostId ? <span className="text-yellow-500"><Icon path={Icons.Crown} size={16} className="fill-current" /></span> : <span className="text-stone-400"><Icon path={Icons.User} size={16} /></span>}<span className={p.uid === user.uid ? "font-bold" : ""}>{p.name}</span></div>{isHost && p.uid !== user.uid && <button onClick={() => transferHost(p.uid)} className="text-xs bg-stone-200 hover:bg-stone-300 px-2 py-1 rounded text-stone-600">親を譲る</button>}</li>))}</ul></div>
                            <div className="bg-white rounded-xl shadow p-6 flex flex-col justify-between"><div><h3 className="flex items-center gap-2 font-bold text-stone-700 mb-4 pb-2 border-b"><Icon path={Icons.Settings} size={18} /> 設定</h3><div className="mb-4"><label className="block text-sm text-stone-500 mb-1">使用する札の枚数</label>{isHost ? (<div className="flex items-center gap-4"><input type="range" min="5" max="50" step="5" value={room.settings?.cardCount || 20} onChange={(e) => updateSettings({ cardCount: parseInt(e.target.value) })} className="flex-1 h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-red-600" /><span className="text-xl font-bold w-12 text-center">{room.settings?.cardCount || 20}</span></div>) : (<div className="text-xl font-bold text-stone-800">{room.settings?.cardCount || 20}枚</div>)}</div>
                                <div className="mb-2">
                                    <label className="block text-sm text-stone-500 mb-2">札の大きさ <span className="text-xs text-stone-400">（自分の画面のみ／ゲーム中も変更できます）</span></label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {CARD_SIZE_ORDER.map(k => (
                                            <button key={k} onClick={() => chooseCardSize(k)} className={`rounded-lg overflow-hidden border-2 transition ${cardSize === k ? 'border-red-600 ring-2 ring-red-200' : 'border-stone-200 hover:border-stone-400'}`}>
                                                <CardSizePreview sizeKey={k} images={cardImages} />
                                                <div className={`text-xs font-bold py-1 ${cardSize === k ? 'bg-red-600 text-white' : 'bg-stone-100 text-stone-500'}`}>{CARD_SIZES[k].label}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>{isHost ? <button onClick={startGame} className="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-bold shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2"><Icon path={Icons.Play} size={20} className="fill-current" /> ゲーム開始</button> : <div className="text-center py-4 text-stone-500 bg-stone-50 rounded-lg animate-pulse">ホストが開始するのを待っています...</div>}</div>
                        </div>
                    </div>
                );
            }
            if (view === 'game' && room) {
                if (!room.gameState || !room.players) return <LoadingScreen />;
                const { gameState, players } = room;
                const isIntro = introCountdown !== null;
                const isWaitingNext = !gameState.currentReadingId || gameState.lastWinnerId;
                const isBanned = gameState.bannedPlayerIds?.includes(user.uid);
                const isAllBanned = gameState.resumeAt != null;
                const takenCard = gameState.lastWinnerId ? KARUTA_DATA.find(k => k.id === gameState.currentReadingId) : null;
                const sortedPlayers = [...players].sort((a,b) => b.score - a.score);
                const lastWinnerName = gameState.lastWinnerId ? players.find(p => p.uid === gameState.lastWinnerId)?.name : null;
                const isHost = room.hostId === user.uid;
                const sz = CARD_SIZES[cardSize] || CARD_SIZES.m;
                return (
                    <div className="app-screen bg-stone-800 flex flex-col relative overflow-hidden">
                        {showConfirmModal && <ConfirmModal title={isHost ? "ゲームを中断して待機室に戻りますか？" : "ゲームから退出してホームに戻りますか？"} onCancel={() => setShowConfirmModal(false)} onConfirm={isHost ? () => { leaveRoom(); } : leaveRoom} />}
                        {lastWinnerName && <div className="fixed inset-0 z-50 flex items-center justify-center pointer-events-none p-4"><div className="bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-2xl shadow-2xl animate-in zoom-in duration-300 flex flex-col items-center max-w-xs w-full">{takenCard && cardImages[takenCard.id] ? <img src={cardImages[takenCard.id]} alt="取られた札" className="w-24 h-36 object-cover shadow-lg mb-4 animate-in zoom-in duration-300" /> : <span className="text-yellow-500 mb-4"><Icon path={Icons.Trophy} size={64} /></span>}<div className="flex items-center gap-2 mb-1"><span className="text-yellow-500"><Icon path={Icons.Trophy} size={24} /></span><h2 className="text-2xl md:text-4xl font-bold text-stone-900">{lastWinnerName}</h2></div><p className="text-base text-stone-500 font-bold">が取りました！</p></div></div>}
                        {isIntro && <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm"><div key={introCountdown} className="text-7xl md:text-9xl font-black text-white drop-shadow-lg animate-in zoom-in duration-300">{introCountdown > 0 ? introCountdown : "はじめ！"}</div></div>}
                        {isAllBanned && countdown !== null && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm animate-in fade-in"><div className="text-center"><p className="text-white font-bold text-xl mb-4 bg-red-600 px-6 py-2 rounded-full animate-pulse">全員お手つき！</p><div className="text-9xl font-black text-white drop-shadow-md scale-150">{countdown > 0 ? countdown : "GO!"}</div><p className="text-white/80 mt-4">まもなく再開します</p></div></div>}
                        {isBanned && !lastWinnerName && !isAllBanned && <div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none"><div className="bg-sky-500/90 backdrop-blur-sm text-white p-8 rounded-2xl shadow-xl flex flex-col items-center animate-in fade-in zoom-in duration-300"><span className="mb-4 text-white"><Icon path={Icons.Coffee} size={56} /></span><span className="text-2xl font-bold mb-1">お手つき</span><span className="text-sky-100">一回休み...</span></div></div>}
                        {/* ヘッダー：スクロールしても常に見えるよう固定領域にする（shrink-0） */}
                        <div className="bg-white px-3 pt-2.5 pb-2 shadow-lg z-30 relative shrink-0">
                            <div className="absolute top-0 left-0 w-full h-1.5 bg-red-600"></div>
                            <div className="flex items-center justify-between gap-2">
                                <span className="text-[11px] md:text-xs font-bold text-stone-400 tracking-wider shrink-0">残り {gameState.boardCards.length}枚</span>
                                <div className="flex items-center gap-1 shrink-0">
                                    <button onClick={cycleCardSize} title="札の大きさを変える" className="w-8 h-8 flex items-center justify-center text-xs font-bold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 rounded-full transition">{CARD_SIZES[cardSize].label}</button>
                                    <button onClick={() => setMuted(m => !m)} title={muted ? "ミュート解除" : "ミュート"} className="w-8 h-8 flex items-center justify-center text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 rounded-full transition"><Icon path={muted ? Icons.VolumeX : Icons.Volume2} size={16} /></button>
                                    <button onClick={() => setShowConfirmModal(true)} title="退出" className="w-8 h-8 flex items-center justify-center text-stone-400 hover:text-red-600 bg-stone-100 hover:bg-red-50 rounded-full transition"><Icon path={Icons.LogOut} size={16} /></button>
                                </div>
                            </div>
                            {/* 高さを予約しておき、文字送りで盤面が上下にずれないようにする */}
                            <h2 className="max-w-4xl mx-auto text-center min-h-[2.75rem] md:min-h-[3.25rem] flex items-center justify-center text-base md:text-2xl font-bold text-stone-900 leading-snug" style={{ fontFamily: '"Noto Serif JP", serif' }}>{displayedYomi}</h2>
                        </div>
                        {/* 盤面：ここだけが内部スクロールする（min-h-0 が無いと flex 子要素が縮まずページ全体が伸びる） */}
                        <div className="flex-1 min-h-0 overflow-y-auto overscroll-contain p-2 md:p-4">
                            <div className="max-w-5xl mx-auto"><div style={{ display: 'grid', gridTemplateColumns: `repeat(auto-fill, minmax(${sz.min}px, 1fr))`, gap: `${sz.gap}px`, alignContent: 'start' }}>{gameState.boardCards.map(cardId => { const cardData = KARUTA_DATA.find(k => k.id === cardId); return (<button key={cardId} onClick={() => handleCardClick(cardId)} disabled={isWaitingNext || isBanned || isAllBanned || isIntro} className={`relative w-full aspect-[2/3] flex items-center justify-center overflow-hidden p-0 transition-all duration-200 ${(isWaitingNext || isBanned || isAllBanned || isIntro) ? 'opacity-50 cursor-not-allowed scale-95 grayscale' : 'hover:-translate-y-1 cursor-pointer active:scale-95'}`}><TorifudaFace cardData={cardData} imageUrl={cardImages[cardId]} /></button>); })}</div></div>
                        </div>
                        {/* スコア：常に見えるよう最下部に固定（shrink-0） */}
                        <div className="bg-stone-900 text-white px-3 py-2 safe-area-pb shrink-0"><div className="max-w-4xl mx-auto flex gap-2 overflow-x-auto scrollbar-hide">{sortedPlayers.map((p, idx) => (<div key={p.uid} className={`flex items-center gap-2 px-3 py-1.5 rounded-full min-w-[118px] border ${p.uid === user.uid ? 'bg-stone-700 border-red-500 ring-1 ring-red-500' : 'bg-stone-800 border-stone-700'} ${gameState.bannedPlayerIds?.includes(p.uid) ? 'opacity-70 bg-stone-800/50' : ''} transition-all duration-300`}><span className="text-xs text-stone-400 font-bold truncate max-w-[80px]">{gameState.bannedPlayerIds?.includes(p.uid) && <span className="inline-block mr-1 text-sky-400"><Icon path={Icons.Coffee} size={12} /></span>}{idx+1}. {p.name}</span><span className="ml-auto text-lg font-bold text-yellow-400">{p.score}</span></div>))}</div></div>
                    </div>
                );
            }
            if (view === 'result' && room) {
                if (!room.players) return <LoadingScreen />;
                const sortedPlayers = [...room.players].sort((a,b) => b.score - a.score);
                const isHost = room.hostId === user.uid;

                return (
                    <div className="min-h-screen bg-stone-800 flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
                            <div className="bg-gradient-to-r from-red-600 to-red-500 p-8 text-center"><span className="inline-block mx-auto text-white drop-shadow-md mb-2"><Icon path={Icons.Trophy} size={48} /></span><h2 className="text-3xl font-black text-white drop-shadow-sm uppercase tracking-wider">結果発表</h2><p className="text-red-100 text-sm mt-2">対戦ありがとうございました！</p></div>
                            <div className="p-6">
                                <div className="space-y-4 mb-8 max-h-60 overflow-y-auto pr-2">{sortedPlayers.map((p, index) => (<div key={p.uid} className="flex items-center justify-between p-4 bg-stone-50 rounded-xl border border-stone-100"><div className="flex items-center gap-4"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-white ${index === 0 ? 'bg-yellow-400 shadow-md' : index === 1 ? 'bg-stone-400' : index === 2 ? 'bg-orange-400' : 'bg-stone-200 text-stone-500'}`}>{index + 1}</div><span className={`font-bold text-lg ${p.uid === user.uid ? 'text-red-600' : 'text-stone-800'}`}>{p.name}{p.uid === user.uid && <span className="text-xs ml-2 bg-red-100 text-red-600 px-2 py-0.5 rounded-full">YOU</span>}</span></div><span className="text-2xl font-bold text-stone-600">{p.score}<span className="text-sm font-normal ml-1">枚</span></span></div>))}</div>
                                <div className="flex gap-3">
                                    {isHost ? (
                                        <>
                                            <button onClick={leaveRoom} className="flex-1 py-3 text-stone-500 font-bold hover:bg-stone-100 rounded-lg transition flex items-center justify-center gap-2">解散してホームへ <Icon path={Icons.LogOut} size={18} /></button>
                                            <button
                                                onClick={returnToLobby}
                                                disabled={isResetting}
                                                className="flex-1 py-3 bg-red-600 hover:bg-red-700 disabled:bg-stone-400 text-white font-bold rounded-lg shadow-lg transition flex items-center justify-center gap-2"
                                            >
                                                {isResetting ? "処理中..." : "同じ部屋でもう一戦"} <Icon path={Icons.RotateCcw} size={18} />
                                            </button>
                                        </>
                                    ) : (
                                        <button onClick={leaveRoom} className="flex-1 py-3 text-stone-500 font-bold hover:bg-stone-100 rounded-lg transition">ホームへ戻る</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
